    { q: 'We hang nine masses on spring A, then take them all off. Will the spring go back to its original length?',
      a: 'No. Nine masses (8.8 N) is past the elastic limit, so the spring stays permanently stretched. Below the elastic limit it would go back to 15 cm.',
      setup: p => Object.assign(p, { compare: false, spring: 'soft', n: 9 }) },
    { q: 'Is the length of the spring directly proportional to the force on it?',
      a: 'No: the extension is. On the Force–length graph the line is straight but does not go through the origin, because the spring is already 15 cm long with no force on it.',
      setup: p => Object.assign(p, { compare: false, spring: 'soft', n: 3 }) },
  ],

  table: {
    columns: [
      { key: 'spring', label: 'Spring' },
      { key: 'mass', label: 'Mass added', unit: 'g', fmt: v => fx(v, 0) },
      { key: 'F', label: 'Force F', unit: 'N', fmt: v => fx(v, 2) },
      { key: 'len', label: 'Length', unit: 'cm', fmt: v => fx(v, 1) },
      { key: 'ecm', label: 'Extension e', unit: 'cm', fmt: v => fx(v, 1) },
      { key: 'em', label: 'Extension e', unit: 'm', fmt: v => fx(v, 3) },
    ],
    hint: 'Read the length to the nearest mm, with your eye level with the bottom of the spring. Extension = length − original length. Plot force (y-axis) against extension in m (x-axis): the gradient is the spring constant k in N/m.',
  },

  // ---- simulation ----
  lanes() { return this.p.compare ? ['A', 'B'] : ['A']; },
  springKey(k) { return this.p.compare ? (k === 'A' ? 'soft' : 'stiff') : this.p.spring; },
  springFor(k) { return SPRINGS[this.springKey(k)]; },
  force() { return this.p.n * SLOTTED_MASS * SETTINGS.g; },
  target(k) { return Physics.springExtension(this.force(), this.springFor(k), this.s.Fmax); },
  // Reset = a brand-new spring with the current masses already hanging still.
  reset() {
    this.s = { t: 0, Fmax: this.force(), A: { e: 0, v: 0 }, B: { e: 0, v: 0 } };
    for (const k of ['A', 'B']) this.s[k].e = this.target(k);
    this.dragM = null;
  },
  // Called when the number of masses changes.
  onParam(key) {
    if (key !== 'n') return;
    this.s.Fmax = Math.max(this.s.Fmax, this.force());
    if (this.p.realistic) { if (!App.running) setRunning(true); }
    else for (const k of ['A', 'B']) { this.s[k].e = this.target(k); this.s[k].v = 0; }
  },
  addMasses(d) { setParam(this, 'n', this.p.n + d); this.onParam('n'); updateReadouts(); },
  step(dt) {
    const s = this.s;
    s.t += dt;
    for (const k of ['A', 'B']) {
      const st = s[k], target = this.target(k);
      if (!this.p.realistic) { st.e = target; st.v = 0; continue; }
      // damped bounce towards the new resting position
      const M = Math.max(0.05, this.p.n * SLOTTED_MASS), w = Math.sqrt(this.springFor(k).k / M), zeta = 0.2;
      st.v += (-w * w * (st.e - target) - 2 * zeta * w * st.v) * dt;
      st.e += st.v * dt;
    }
  },
  settled() { return this.lanes().every(k => Math.abs(this.s[k].e - this.target(k)) < 1e-4 && Math.abs(this.s[k].v) < 1e-3); },
  finished() { return false; },
  clock() { return App.running ? 'Bouncing…' : 'Spring is still'; },

  drawDiagram(ctx, w, h, C) {
    const p = this.p, s = this.s, ov = this.ov, fs = App.fs, lanes = this.lanes();
    const pw = w / lanes.length, F = this.force();
    const topY = fs * 1.9, benchY = h - fs * 1.5;
    const ppm = (benchY - topY - fs * 6.2) / 1.0;      // pixels per metre: the ruler shows 0 to 100 cm
    const mh = fs * 0.42;                               // height of one slotted mass
    const pxN = fs * 0.35;                              // force arrow length per newton
    lanes.forEach((k, i) => {
      const x0 = i * pw, sp = this.springFor(k), col = k === 'A' ? C.a : C.b;
      const e = s[k].e, len = sp.L0 + e;
      if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, x0, 0, x0, h); }
      ctx.fillStyle = C.ground; ctx.fillRect(x0, benchY, pw, h - benchY);

      // clamp stand
      const rodX = x0 + pw * 0.1, sx = x0 + pw * 0.4, rx = sx + fs * 2.6;
      ctx.fillStyle = C.muted; ctx.fillRect(rodX - fs * 1.2, benchY - fs * 0.5, fs * 3.4, fs * 0.5);
      ctx.strokeStyle = C.muted; ctx.lineWidth = 6; line(ctx, rodX, benchY - fs * 0.5, rodX, topY - fs * 0.8);
      ctx.lineWidth = 5; line(ctx, rodX, topY - fs * 0.5, sx + fs * 0.6, topY - fs * 0.5);
      ctx.fillStyle = C.ink; ctx.fillRect(sx - fs * 0.5, topY - fs * 0.75, fs * 1.0, fs * 0.5);

      // metre rule (0 cm level with the top of the spring)
      ctx.fillStyle = C.panel2; ctx.fillRect(rx, topY, fs * 1.4, ppm);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.strokeRect(rx, topY, fs * 1.4, ppm);
      ctx.fillStyle = C.muted; ctx.font = `${fs * 0.7}px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      for (let cm = 0; cm <= 100; cm++) {
        const y = topY + cm / 100 * ppm, big = cm % 10 === 0, mid = cm % 5 === 0;
        if (!mid && ppm / 100 < 3) continue;
        ctx.lineWidth = big ? 1.5 : 1;
        line(ctx, rx, y, rx + (big ? fs * 0.8 : mid ? fs * 0.5 : fs * 0.25), y);
        if (big) ctx.fillText(cm + (cm === 0 ? ' cm' : ''), rx + fs * 1.55, y);
      }

      // the spring: a zig-zag from the clamp to the hook
      const yBot = topY + len * ppm, hook = fs * 0.35, coils = 14, cw = fs * 0.6, span = yBot - topY - 2 * hook;
      ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(sx, topY); ctx.lineTo(sx, topY + hook);
      for (let j = 1; j <= coils * 2; j++) ctx.lineTo(sx + (j % 2 ? cw : -cw), topY + hook + span * (j - 0.5) / (coils * 2));
      ctx.lineTo(sx, yBot - hook); ctx.lineTo(sx, yBot); ctx.stroke();

      // hanger and slotted masses
      const stackTop = yBot + fs * 0.45, n = p.n - (this.dragM && this.dragM.from === 'hung' ? 1 : 0);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; line(ctx, sx, yBot, sx, stackTop + n * mh + fs * 0.15);
      for (let j = 0; j < n; j++) { ctx.fillStyle = C.muted; ctx.fillRect(sx - fs * 1.0, stackTop + j * mh, fs * 2.0, mh - 1.5); }
      ctx.fillStyle = C.ink; ctx.fillRect(sx - fs * 1.1, stackTop + n * mh, fs * 2.2, fs * 0.2);
      const stackBottom = stackTop + n * mh + fs * 0.2;

      // pointer to the ruler and the reading
      arrow(ctx, sx + cw + 2, yBot, rx - 1, yBot, C.ink, { width: 2 });
      const reading = p.realistic ? Math.round(len * 1000) / 10 : len * 100;
      if (ov.values) label(ctx, `${fx(reading, 1)} cm`, rx + fs * 3.6, yBot, C.ink, { align: 'left', fs: fs * 0.9 });

      // original length and extension
      const yL0 = topY + sp.L0 * ppm;
      ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]); line(ctx, sx - fs * 2.4, yL0, rx, yL0); ctx.setLineDash([]);
      if (ov.ext) {
        label(ctx, 'original length', sx - fs * 2.6, yL0, C.muted, { align: 'right', fs: fs * 0.8 });
        if (yBot - yL0 > fs * 0.8) {
          const bx = sx - fs * 1.7;
          arrow(ctx, bx, (yL0 + yBot) / 2, bx, yL0 + 1, C.acc, { width: 2.5 });
          arrow(ctx, bx, (yL0 + yBot) / 2, bx, yBot - 1, C.acc, { width: 2.5 });
          label(ctx, ov.values ? `e = ${fx(e * 100, 1)} cm` : 'extension e', bx - fs * 0.4, Math.max((yL0 + yBot) / 2, yL0 + fs * 1.6), C.acc, { align: 'right', fs: fs * 0.9 });
        }
      }
      // limit of proportionality marked on the ruler
      if (ov.lop) {
        const y = topY + (sp.L0 + sp.lop / sp.k) * ppm;
        ctx.strokeStyle = C.force; ctx.lineWidth = 3; line(ctx, rx - fs * 0.3, y, rx + fs * 1.4, y);
        label(ctx, lanes.length > 1 ? 'limit of prop.' : 'limit of proportionality', rx + fs * 3.6, y, C.force, { align: 'left', fs: fs * 0.8 });
      }

      // forces: weight of the masses down, spring pulling up
      if (ov.forces && F > 0) {
        arrow(ctx, sx, stackBottom, sx, stackBottom + F * pxN, C.force, { width: 4 });
        const pull = Math.max(0, F * (s[k].e / Math.max(this.target(k), 1e-9)));   // while bouncing, the pull changes
        arrow(ctx, sx + fs * 1.4, stackTop + n * mh * 0.5, sx + fs * 1.4, stackTop + n * mh * 0.5 - pull * pxN, C.friction, { width: 4 });
        label(ctx, ov.values ? `weight W = ${fx(F, 2)} N` : 'weight', x0 + pw - fs * 0.3, topY + fs * 1.0, C.force, { align: 'right', fs: fs * 0.85 });
        label(ctx, ov.values ? `spring force = ${fx(pull, 2)} N` : 'spring force', x0 + pw - fs * 0.3, topY + fs * 2.4, C.friction, { align: 'right', fs: fs * 0.85 });
      }
      if (ov.eq) {
        const text = F <= sp.lop + 1e-9
          ? `e = F ÷ k = ${fx(F, 2)} N ÷ ${sp.k} N/m = ${fx(F / sp.k, 3)} m`
          : 'F = k e no longer works: past the limit of proportionality';
        label(ctx, text, x0 + pw - fs * 0.3, fs * 0.75, C.ink, { align: 'right', fs: fs * 0.85 });
      }
      // status message on the bench
      let msg = '';
      if (s.Fmax > Physics.elasticLimit(sp) + 1e-9) msg = 'Past the elastic limit: permanently stretched';
      else if (F > sp.lop + 1e-9) msg = 'Past the limit of proportionality';
      if (msg) label(ctx, msg, x0 + pw / 2, benchY + (h - benchY) / 2, C.force, { fs: fs * 0.85, weight: 750 });

      // masses waiting on the bench: drag one onto the hanger, or drag one off
      const bxm = x0 + pw * 0.88, left = MAX_MASSES - p.n - (this.dragM && this.dragM.from === 'bench' ? 1 : 0);
      for (let j = 0; j < left; j++) { ctx.fillStyle = C.muted; ctx.fillRect(bxm - fs * 1.0, benchY - (j + 1) * mh, fs * 2.0, mh - 1.5); }
      if (MAX_MASSES - p.n > 0) {
        addHandle(ctx, { id: 'bench' + k, x: bxm, y: benchY - left * mh - mh / 2, r: fs * 1.2,
          start: (x, y) => { this.dragM = { from: 'bench', x, y }; },
          onDrag: (x, y) => { if (this.dragM) { this.dragM.x = x; this.dragM.y = y; } },
          end: () => { const d = this.dragM; this.dragM = null; if (d && Math.abs(d.x - sx) < pw * 0.2 && d.y < benchY) this.addMasses(1); } });
      }
      if (p.n > 0) {
        addHandle(ctx, { id: 'hung' + k, x: sx, y: stackTop + (p.n - 0.5) * mh, r: fs * 1.2,
          start: (x, y) => { this.dragM = { from: 'hung', x, y }; },
          onDrag: (x, y) => { if (this.dragM) { this.dragM.x = x; this.dragM.y = y; } },
          end: () => { const d = this.dragM; this.dragM = null; if (d && Math.abs(d.x - sx) > pw * 0.15) this.addMasses(-1); } });
      }
      if (this.dragM && i === 0) { ctx.fillStyle = C.muted; ctx.fillRect(this.dragM.x - fs, this.dragM.y - mh / 2, fs * 2, mh); }
    });
  },

  drawGraph(cv, id, C) {
    const p = this.p, lanes = this.lanes(), F = this.force(), rows = App.rows[this.id] || [];
    const maxF = MAX_MASSES * SLOTTED_MASS * SETTINGS.g;
    const lengthAxis = id === 'FL';
    const eMax = Math.max(...lanes.map(k => Physics.springExtension(maxF, this.springFor(k))));
    const o = { xLabel: lengthAxis ? 'Length of spring (m)' : 'Extension e (m)', yLabel: 'Force F (N)',
                xMax: niceCeil((lengthAxis ? 0.15 : 0) + eMax * 1.05), yMax: niceCeil(maxF), series: [], points: [], lines: [], notes: [] };
    for (const k of lanes) {
      const sp = this.springFor(k), key = this.springKey(k), col = k === 'A' ? C.a : C.b, off = lengthAxis ? sp.L0 : 0;
      const tag = lanes.length > 1 ? k + ': ' : '';
      if (this.ov.model) {
        const pts = [];
        for (let f = 0; f <= maxF + 1e-9; f += maxF / 60) pts.push([off + Physics.springExtension(f, sp), f]);
        o.series.push({ pts, color: col, width: 2, dash: [6, 5] });
      }
      const mine = rows.filter(r => r.sp === key);
      for (const r of mine) o.points.push({ x: off + r.em, y: r.F, color: col });
      if (!lengthAxis) {
        const fitPts = mine.filter(r => r.F > 0 && r.F <= sp.lop + 1e-9 && r.Fmax <= Physics.elasticLimit(sp) + 1e-9).map(r => ({ x: r.em, y: r.F }));
        const fit = fitPts.length >= 2 ? fitOrigin(fitPts) : null;   // gradient of F against e = k
        if (fit) {
          const eL = sp.lop / fit.k;
          o.lines.push({ x1: 0, y1: 0, x2: eL, y2: sp.lop, color: col, width: 2.5 });
          o.notes.push({ text: `${tag}gradient = k = ${sf(fit.k, 3)} N/m`, color: col });
        }
      }
      o.points.push({ x: off + sp.lop / sp.k, y: sp.lop, color: C.force, dot: true, label: lanes.length > 1 ? `${k}: limit of proportionality` : 'limit of proportionality' });
      o.points.push({ x: off + this.s[k].e, y: F, color: col, dot: true });
    }
    if (lengthAxis) {
      o.notes.push({ text: 'Straight line, but it does not go through the origin:', color: C.ink });
      o.notes.push({ text: 'length is NOT proportional to force. It starts at the original length.', color: C.ink });
    } else {
      o.notes.push({ text: 'Straight line through the origin: F ∝ e (Hooke’s law)', color: C.muted });
      if (!rows.length) o.message = 'Record a reading after adding each mass';
    }
    plot(cv, o);
  },

  readouts() {
    const lanes = this.lanes(), F = this.force();
    const per = fn => lanes.map(k => fn(this.springFor(k), this.s[k].e));
    return {
      cols: lanes.length > 1 ? [{ name: 'A', cls: 'A' }, { name: 'B', cls: 'B' }] : [{ name: '', cls: 'A' }],
      rows: [
        { label: 'Mass added', unit: 'g', vals: [fx(this.p.n * 100, 0)] },
        { label: 'Force F = W', unit: 'N', vals: [fx(F, 2)] },
        { label: 'Length', unit: 'cm', vals: per((sp, e) => fx((sp.L0 + e) * 100, 1)) },
        { label: 'Extension e', unit: 'cm', vals: per((sp, e) => fx(e * 100, 1)) },
        { label: 'Extension e', unit: 'm', vals: per((sp, e) => fx(e, 3)) },
        { label: 'Elastic energy ½ k e²', unit: 'J', vals: per((sp, e) => F <= sp.lop + 1e-9 && this.s.Fmax <= Physics.elasticLimit(sp) ? sf(0.5 * sp.k * e * e, 2) : 'n/a') },
      ],
    };
  },

  record() {
    if (this.p.realistic && !this.settled()) return 'Wait for the spring to stop bouncing, then record';
    return this.lanes().map(k => {
      const sp = this.springFor(k);
      let L = sp.L0 + this.target(k);
      if (this.p.realistic) L = Math.round(L * 1000) / 1000;   // read to the nearest mm
      const e = L - sp.L0;
      return { sp: this.springKey(k), spring: sp.short, mass: this.p.n * 100, F: this.force(), len: L * 100, ecm: e * 100, em: e, Fmax: this.s.Fmax };
    });
  },
});
/* ---------------------------------------------------------------------
   CIRCUIT DRAWING HELPERS (used by experiments 4 and 5)
   Wires are drawn first; symbols are drawn on top with a background fill
   so the wire does not show through them.
   --------------------------------------------------------------------- */
const Circuit = {
  wire(ctx, pts, C) {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke();
  },
  node(ctx, x, y, C) { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); },
  resistor(ctx, x, y, vertical, fs, C) {
    const w = vertical ? fs * 1.0 : fs * 2.6, h = vertical ? fs * 2.6 : fs * 1.0;
    ctx.fillStyle = C.bg; ctx.fillRect(x - w / 2, y - h / 2, w, h);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.strokeRect(x - w / 2, y - h / 2, w, h);
  },
  // Filament lamp: circle with a cross. glow 0 = off, 1 = normal brightness.
  lamp(ctx, x, y, fs, C, glow) {
    const r = fs * 1.1, g = Math.min(Math.max(glow, 0), 1.5);
    if (g > 0.01) {
      const R = r * (1.4 + 2.2 * g), grad = ctx.createRadialGradient(x, y, r * 0.3, x, y, R);
      grad.addColorStop(0, `rgba(255,205,0,${0.9 * Math.min(g, 1)})`); grad.addColorStop(1, 'rgba(255,205,0,0)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = g > 0.01 ? `rgba(255,226,110,${0.35 + 0.65 * Math.min(g, 1)})` : C.bg;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.stroke();
    const d = r * 0.7;
    line(ctx, x - d, y - d, x + d, y + d); line(ctx, x - d, y + d, x + d, y - d);
  },
  // Diode: triangle points the way current can flow. angle 0 = to the right, π/2 = down.
  diode(ctx, x, y, angle, fs, C) {
    const s = fs * 0.9;
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
    ctx.fillStyle = C.bg; ctx.fillRect(-s * 1.1, -s * 1.1, s * 2.2, s * 2.2);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    line(ctx, -s * 1.1, 0, s * 1.1, 0);
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(-s * 0.8, -s); ctx.lineTo(-s * 0.8, s); ctx.lineTo(s * 0.8, 0); ctx.closePath(); ctx.fill();
    line(ctx, s * 0.8, -s, s * 0.8, s);
    ctx.restore();
  },
  meter(ctx, x, y, letter, fs, C) {
    const r = fs * 1.0;
    ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = C.ink; ctx.font = `800 ${fs * 1.05}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(letter, x, y + fs * 0.05);
  },
  // Cell / power supply on an up-down wire. The long plate (+) is at the top.
  supply(ctx, x, y, fs, C, variable) {
    const g = fs * 0.32;
    ctx.fillStyle = C.bg; ctx.fillRect(x - fs, y - g + 2, fs * 2, g * 2 - 4);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; line(ctx, x - fs * 0.95, y - g, x + fs * 0.95, y - g);
    ctx.lineWidth = 7; line(ctx, x - fs * 0.45, y + g, x + fs * 0.45, y + g);
    if (variable) arrow(ctx, x - fs * 1.2, y + fs * 0.9, x + fs * 1.2, y - fs * 0.9, C.ink, { width: 2 });
    ctx.fillStyle = C.ink; ctx.font = `700 ${fs * 0.8}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('+', x + fs * 1.25, y - g - fs * 0.35);
  },
  // On-off switch on a left-right wire.
  switch(ctx, x, y, closed, fs, C) {
    ctx.fillStyle = C.bg; ctx.fillRect(x - fs * 1.1, y - fs * 1.1, fs * 2.2, fs * 1.4);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    line(ctx, x - fs * 0.9, y, closed ? x + fs * 0.9 : x + fs * 0.65, closed ? y : y - fs * 0.85);
    ctx.fillStyle = C.ink;
    for (const dx of [-fs * 0.9, fs * 0.9]) { ctx.beginPath(); ctx.arc(x + dx, y, 4.5, 0, Math.PI * 2); ctx.fill(); }
  },
  // Moving dots showing (conventional) current along a path. phase grows with time × current.
  flow(ctx, pts, phase, color, fs) {
    const sp = fs * 2.2, start = ((phase % sp) + sp) % sp;
    ctx.fillStyle = color;
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      const [x1, y1] = pts[i - 1], [x2, y2] = pts[i], L = Math.hypot(x2 - x1, y2 - y1);
      for (let d = start + Math.ceil((acc - start) / sp) * sp - acc; d < L; d += sp) {
        ctx.beginPath(); ctx.arc(x1 + (x2 - x1) * d / L, y1 + (y2 - y1) * d / L, fs * 0.22, 0, Math.PI * 2); ctx.fill();
      }
      acc += L;
    }
  },
};
// Time since the last frame, for animations that run even when paused (e.g. current flow).
function frameDt(obj) {
  const now = performance.now(), dt = Math.min(0.05, (now - (obj.lastFrame || now)) / 1000);
  obj.lastFrame = now;
  return dt;
}

/* ---------------------------------------------------------------------
   EXPERIMENT 4: I–V CHARACTERISTICS  (V = I R)
   --------------------------------------------------------------------- */
const COMPONENTS = {
  resistor: { label: 'Fixed resistor' },
  lamp: { label: 'Filament lamp' },
  diode: { label: 'Diode (with protective resistor)' },
};
const DIODE_RP = 100;   // Ω: protective resistor in series with the diode

Object.assign(Physics, {
  // Resistance of the fixed resistor. o.R0 = value (Ω). With o.heating it warms up
  // at large currents: R = R0 (1 + 0.06 × power), solved for the power V²/R.
  resistorR(V, o) {
    if (!o.heating) return o.R0;
    return (o.R0 + Math.sqrt(o.R0 * o.R0 + 0.24 * o.R0 * V * V)) / 2;
  },
  // Filament lamp: about 2.5 Ω cold, rising to 12.5 Ω at 6 V as the filament heats up.
  lampR(V) { return 2.5 * (1 + 4 * Math.pow(Math.abs(V) / 6, 0.8)); },
  // Silicon diode: current grows very quickly above about 0.6 V; tiny current in reverse.
  diodeI(V) { return 1.5e-8 * (Math.exp(V / (1.8 * 0.02585)) - 1); },
  componentCurrent(type, V, o) {
    if (type === 'resistor') return V / Physics.resistorR(V, o);
    if (type === 'lamp') return V / Physics.lampR(V);
    return Physics.diodeI(V);
  },
  // p.d. across and current through the component for a supply p.d. Vs.
  // The diode has a protective resistor in series, so the supply p.d. is shared.
  ivReading(type, Vs, o) {
    if (type !== 'diode') return { V: Vs, I: Physics.componentCurrent(type, Vs, o) };
    let lo = Math.min(0, Vs), hi = Math.max(0, Vs);
    for (let i = 0; i < 100; i++) {          // find V where Vs = V + I × R_protective
      const m = (lo + hi) / 2;
      if (Physics.diodeI(m) * DIODE_RP + m > Vs) hi = m; else lo = m;
    }
    const V = (lo + hi) / 2;
    return { V, I: (Vs - V) / DIODE_RP };
  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 5: SERIES AND PARALLEL CIRCUITS  (and RP3 resistor mode)
   --------------------------------------------------------------------- */
const BULB_R = 12;       // Ω: each bulb is treated as a fixed 12 Ω resistor
const INTERNAL_R = 1;    // Ω: internal resistance of the battery in Realistic mode

Object.assign(Physics, {
  /* Currents in resistors (or bulbs) joined in series or in parallel.
     Rs = list of resistances (Ω); null = a bulb that has been taken out (a gap).
     E = battery p.d. (V); r = battery's internal resistance (0 when ideal).
     Returns: I total current, Vt p.d. across the circuit, Ii and Vi for each
     component, and Rtot the total resistance of the components.              */
  solveCircuit(layout, Rs, E, r = 0) {
    const none = { I: 0, Vt: E, Ii: Rs.map(() => 0), Vi: Rs.map(() => 0), Rtot: Infinity };
    if (layout === 'series') {
      if (Rs.some(R => R === null)) return none;                 // a gap breaks a series circuit
      const Rtot = Rs.reduce((a, b) => a + b, 0), I = E / (Rtot + r);
      return { I, Vt: E - I * r, Ii: Rs.map(() => I), Vi: Rs.map(R => I * R), Rtot };
    }
    const G = Rs.reduce((g, R) => g + (R === null ? 0 : 1 / R), 0);
    if (G === 0) return none;
    const Rtot = 1 / G, I = E / (Rtot + r), Vt = E - I * r;    // every branch has the same p.d.
    return { I, Vt, Ii: Rs.map(R => R === null ? 0 : Vt / R), Vi: Rs.map(R => R === null ? 0 : Vt), Rtot };
  },
});

      setup: p => Object.assign(p, { kind: 'bulbs', compare: true, realistic: false, n: 3, V: 6 }) },
    { q: 'A 10 Ω and a 20 Ω resistor are connected in parallel. Is the total resistance more or less than 10 Ω?',
      a: 'Less: about 6.7 Ω. A parallel branch gives the current another path, so the total resistance is less than the smallest resistor. In series it would be 10 + 20 = 30 Ω.',
      setup: p => Object.assign(p, { kind: 'resistors', compare: true, realistic: false, R1: 10, R2: 20, V: 6 }) },
  ],

  table: {
    columns: [
      { key: 'arr', label: 'Arrangement' },
      { key: 'what', label: 'Components' },
      { key: 'V', label: 'p.d. V', unit: 'V', fmt: v => fx(v, 2) },
      { key: 'I', label: 'Current I', unit: 'A', fmt: v => fx(v, 2) },
      { key: 'R', label: 'Resistance R = V ÷ I', unit: 'Ω', fmt: v => isFinite(v) ? sf(v, 3) : '—' },
    ],
    hint: 'RP3: read the voltmeter and the ammeter, then calculate R = V ÷ I for the combination. Compare the series total with R₁ + R₂, and check the parallel total is less than either resistor.',
  },

  // ---- simulation ----
  lanes() { return this.p.compare ? ['series', 'parallel'] : [this.p.layout]; },
  comps(lane) {
    const p = this.p;
    if (p.kind === 'resistors') return [p.R1, p.R2];
    return Array.from({ length: p.n }, (_, j) => this.s.out[lane][j] ? null : BULB_R);
  },
  solve(lane, on) { return Physics.solveCircuit(lane, this.comps(lane), on ? this.p.V : 0, this.p.realistic ? INTERNAL_R : 0); },
  ammeters(lane, sol) {
    if (lane === 'series') return this.comps(lane).concat([0]).map((_, j) => ({ name: `A${j + 1}`, I: sol.I }));
    return [{ name: 'A1', I: sol.I }].concat(sol.Ii.map((I, j) => ({ name: `A${j + 2}`, I })));
  },
  reset() { this.s = { t: 0, out: { series: [false, false, false], parallel: [false, false, false] }, phase: {} }; },
  step(dt) { this.s.t += dt; },
  finished() { return false; },
  clock() { return App.running ? 'Switch: ON' : 'Switch: OFF'; },

  drawDiagram(ctx, w, h, C) {
    const lanes = this.lanes(), lh = h / lanes.length, dt = frameDt(this);
    lanes.forEach((lane, i) => this.drawLane(ctx, lane, i * lh, w, lh, C, i, dt));
  },
  drawLane(ctx, lane, y0, w, h, C, i, dt) {
    const p = this.p, ov = this.ov, fs = App.fs, on = App.running, sol = this.solve(lane, on), comps = this.comps(lane), n = comps.length;
    const res = p.kind === 'resistors';
    if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, 0, y0, w, y0); }
    const xl = w * (res ? 0.2 : 0.1), xr = w * 0.92, yt = y0 + h * 0.27, yb = y0 + h * 0.76, ym = (yt + yb) / 2;
    label(ctx, lane === 'series' ? 'Series' : 'Parallel', fs * 0.4, y0 + fs * 0.9, lane === 'series' ? C.a : C.b, { align: 'left', weight: 800, fs: fs * 1.05 });
    const P1 = p.V * p.V / BULB_R;                     // power of one bulb on its own = normal brightness
    const glowOf = j => comps[j] === null ? 0 : sol.Ii[j] * sol.Ii[j] * comps[j] / P1;
    const adv = (key, I) => { const k = lane + key; this.s.phase[k] = (this.s.phase[k] || 0) + I * fs * 8 * dt; return this.s.phase[k]; };

    // voltmeter across the battery (= across the resistor combination) in resistor mode
    if (res) {
      const xv = w * 0.07, dv = (yb - yt) * 0.36;
      Circuit.wire(ctx, [[xl, ym - dv], [xv, ym - dv], [xv, ym + dv], [xl, ym + dv]], C);
      Circuit.node(ctx, xl, ym - dv, C); Circuit.node(ctx, xl, ym + dv, C);
      Circuit.meter(ctx, xv, ym, 'V', fs, C);
      if (ov.values) label(ctx, `${fx(on ? sol.Vt : 0, 2)} V`, xv, ym - dv - fs * 0.9, C.ink, { fs: fs * 0.95, weight: 800 });
    }

    if (lane === 'series') {
      Circuit.wire(ctx, [[xl, yt], [xr, yt], [xr, yb], [xl, yb], [xl, yt]], C);
      if (ov.flow && sol.I > 1e-6) Circuit.flow(ctx, [[xl, ym], [xl, yt], [xr, yt], [xr, yb], [xl, yb], [xl, ym]], adv('loop', sol.I), C.vel, fs);
      // along the top: ammeter, component, ammeter, component, ...
      const items = [];
      for (let j = 0; j < n; j++) items.push({ A: j }, { C: j });
      items.forEach((it, j) => {
        const x = xl + (xr - xl) * (j + 1) / (items.length + 1);
        if (it.A !== undefined) this.drawAmmeter(ctx, x, yt, `A${it.A + 1}`, sol.I, 'above', C);
        else this.drawComp(ctx, lane, it.C, x, yt, false, comps, sol, glowOf(it.C), C);
      });
      this.drawAmmeter(ctx, xl + (xr - xl) * 0.68, yb, `A${n + 1}`, sol.I, 'below', C);
      this.drawSwitch(ctx, xl + (xr - xl) * 0.32, yb, C);
    } else {
      const xs = comps.map((_, j) => xl + (xr - xl) * (0.3 + 0.7 * (j + 1) / n)), xe = xs[n - 1];
      Circuit.wire(ctx, [[xe, yt], [xl, yt], [xl, yb], [xe, yb]], C);
      xs.forEach(x => Circuit.wire(ctx, [[x, yt], [x, yb]], C));
      xs.slice(0, -1).forEach(x => { Circuit.node(ctx, x, yt, C); Circuit.node(ctx, x, yb, C); });
      if (ov.flow && sol.I > 1e-6) {
        // the current splits at each junction and joins up again
        Circuit.flow(ctx, [[xl, yb], [xl, yt], [xs[0], yt]], adv('main', sol.I), C.vel, fs);
        Circuit.flow(ctx, [[xs[0], yb], [xl, yb]], adv('mainb', sol.I), C.vel, fs);
        let left = sol.I;
        xs.forEach((x, j) => {
          if (sol.Ii[j] > 1e-6) Circuit.flow(ctx, [[x, yt], [x, yb]], adv('b' + j, sol.Ii[j]), C.vel, fs);
          left -= sol.Ii[j];
          if (j < n - 1 && left > 1e-6) {
            Circuit.flow(ctx, [[x, yt], [xs[j + 1], yt]], adv('t' + j, left), C.vel, fs);
            Circuit.flow(ctx, [[xs[j + 1], yb], [x, yb]], adv('u' + j, left), C.vel, fs);
          }
        });
      }
      const xm = xl + (xs[0] - xl) * 0.5;
      this.drawAmmeter(ctx, xm, yt, 'A1', sol.I, 'above', C);
      this.drawSwitch(ctx, xm, yb, C);
      xs.forEach((x, j) => {
        this.drawAmmeter(ctx, x, yt + (yb - yt) * 0.3, `A${j + 2}`, sol.Ii[j], 'left', C);
        this.drawComp(ctx, lane, j, x, yt + (yb - yt) * 0.7, true, comps, sol, glowOf(j), C);
      });
    }
    Circuit.supply(ctx, xl, ym, fs, C, false);
    label(ctx, `${fx(p.V, 1)} V`, xl + fs * 1.5, ym, C.ink, { align: 'left', fs: fs * 0.95, weight: 800 });

    if (ov.eq) {
      let text;
      if (!on) text = 'Switch is off: no current flows';
      else if (sol.I < 1e-9) text = lane === 'series' ? 'A bulb is out: the circuit is broken, so no current flows anywhere' : 'All bulbs removed: no current';
      else if (res) text = `R_total = V ÷ I = ${fx(sol.Vt, 2)} V ÷ ${fx(sol.I, 2)} A = ${sf(sol.Vt / sol.I, 3)} Ω`;
      else if (lane === 'series') text = `I = V ÷ R = ${fx(p.V, 1)} V ÷ ${sf(sol.Rtot + (p.realistic ? INTERNAL_R : 0), 3)} Ω = ${fx(sol.I, 2)} A` + (p.realistic ? ' (R includes 1 Ω in the battery)' : '');
      else text = `Main current = ${sol.Ii.filter((x, j) => comps[j] !== null).map(x => fx(x, 2)).join(' + ')} = ${fx(sol.I, 2)} A`;
      label(ctx, text, fs * 0.5, y0 + h - fs * 0.8, C.ink, { align: 'left', fs: fs * 0.9 });
    }
  },
  drawAmmeter(ctx, x, y, name, I, where, C) {
    const fs = App.fs;
    Circuit.meter(ctx, x, y, 'A', fs, C);
    const text = this.ov.values ? `${name}: ${fx(I, 2)} A` : name;
    if (where === 'left') label(ctx, text, x - fs * 1.3, y, C.ink, { align: 'right', fs: fs * 0.88, weight: 750 });
    else label(ctx, text, x, y + (where === 'above' ? -fs * 1.75 : fs * 1.75), C.ink, { fs: fs * 0.88, weight: 750 });
  },
  drawComp(ctx, lane, j, x, y, vertical, comps, sol, glow, C) {
    const fs = App.fs;
    if (this.p.kind === 'resistors') {
      Circuit.resistor(ctx, x, y, vertical, fs, C);
      label(ctx, `R${j ? '₂' : '₁'} = ${comps[j]} Ω`, vertical ? x - fs * 0.9 : x, vertical ? y : y + fs * 1.5, C.muted, { align: vertical ? 'right' : 'center', fs: fs * 0.85 });
    } else if (comps[j] === null) {
      ctx.fillStyle = C.bg; ctx.fillRect(x - fs * 1.2, y - fs * 1.2, fs * 2.4, fs * 2.4);
      ctx.strokeStyle = C.muted; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(x, y, fs * 1.1, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      label(ctx, 'removed', x, y, C.muted, { fs: fs * 0.7, bg: false });
    } else Circuit.lamp(ctx, x, y, fs, C, glow);
    if (this.ov.pd && comps[j] !== null) {
      label(ctx, `${fx(sol.Vi[j], 2)} V`, vertical ? x + fs * 1.3 : x, vertical ? y : y - fs * 1.75, C.acc, { align: vertical ? 'left' : 'center', fs: fs * 0.85, weight: 750 });
    }
    if (this.p.kind === 'bulbs') {
      addHandle(ctx, { id: `bulb${lane}${j}`, x, y, r: fs * 1.3, cursor: 'pointer', start: () => { this.s.out[lane][j] = !this.s.out[lane][j]; } });
    }
  },
  drawSwitch(ctx, x, y, C) {
    Circuit.switch(ctx, x, y, App.running, App.fs, C);
    addHandle(ctx, { id: 'switch' + y, x, y, r: App.fs * 1.2, cursor: 'pointer', start: () => setRunning(!App.running) });
  },

  drawGraph(cv, id, C) {
    const p = this.p, lanes = this.lanes(), on = App.running;
    const colOf = lane => lane === 'series' ? C.a : C.b;
    if (id === 'amps') {
      const groups = lanes.map(l => ({ l, sol: this.solve(l, on) })).map(g => ({ ...g, list: this.ammeters(g.l, g.sol) }));
      const count = Math.max(...groups.map(g => g.list.length)), bars = [], notes = [];
      let top = 0;
      groups.forEach((g, gi) => g.list.forEach((a, j) => {
        bars.push({ x: j + 1 + (lanes.length > 1 ? (gi - 0.5) * 0.4 : 0), y: a.I, width: lanes.length > 1 ? 0.36 : 0.6, color: colOf(g.l), label: fx(a.I, 2) });
        top = Math.max(top, a.I);
      }));
      for (const g of groups) {
        if (g.l === 'series') notes.push({ text: 'Series: every ammeter reads the same', color: colOf(g.l) });
        else notes.push({ text: `Parallel: A1 (main) = ${g.list.slice(1).map(a => fx(a.I, 2)).join(' + ')} = ${fx(g.sol.I, 2)} A`, color: colOf(g.l) });
      }
      const xTicks = [];
      for (let j = 1; j <= count; j++) xTicks.push([j, lanes.length === 1 && lanes[0] === 'parallel' && j === 1 ? 'A1 (main)' : 'A' + j]);
      plot(cv, { xLabel: 'Ammeter', yLabel: 'Current I (A)', xMin: 0.3, xMax: count + 0.7, yMax: niceCeil(Math.max(top * 1.35, 0.5)),
                 bars, xTicks, notes, message: on ? '' : 'Switch on to see the currents' });
      return;
    }
    const o = { yLabel: 'Total resistance (Ω)', series: [], points: [], lines: [], notes: [] };
    if (p.kind === 'bulbs') {
      Object.assign(o, { xLabel: 'Number of bulbs', xMin: 0.5, xMax: 3.5, yMax: 40, xTicks: [[1, '1 bulb'], [2, '2 bulbs'], [3, '3 bulbs']] });
      const ser = [1, 2, 3].map(k => [k, k * BULB_R]), par = [1, 2, 3].map(k => [k, BULB_R / k]);
      o.series.push({ pts: ser, color: C.a, width: 3, label: 'series' }, { pts: par, color: C.b, width: 3, label: 'parallel' });
      for (const q of ser.concat(par)) o.points.push({ x: q[0], y: q[1], color: q[1] >= BULB_R && ser.includes(q) ? C.a : C.b });
      for (const l of lanes) o.points.push({ x: p.n, y: l === 'series' ? p.n * BULB_R : BULB_R / p.n, color: colOf(l), dot: true, label: 'now' });
      o.notes.push({ text: 'Series: each extra bulb adds 12 Ω', color: C.a }, { text: 'Parallel: each extra branch lowers the total', color: C.b });
    } else {
      Object.assign(o, { xLabel: 'Resistor R₂ (Ω)', xMax: 100, yMax: niceCeil(p.R1 + 100) });
      const ser = [], par = [];
      for (let x = 0; x <= 100; x += 1) { ser.push([x, p.R1 + x]); par.push([x, p.R1 * x / (p.R1 + x)]); }
      o.series.push({ pts: ser, color: C.a, width: 3, label: 'series: R₁ + R₂' }, { pts: par, color: C.b, width: 3, label: 'parallel' });
      o.lines.push({ x1: 0, y1: p.R1, x2: 100, y2: p.R1, color: C.muted, dash: [5, 5], label: `R₁ = ${p.R1} Ω` });
      for (const l of lanes) o.points.push({ x: p.R2, y: l === 'series' ? p.R1 + p.R2 : p.R1 * p.R2 / (p.R1 + p.R2), color: colOf(l), dot: true });
      for (const r of (App.rows[this.id] || []).filter(r => r.kind === 'resistors' && r.R1 === p.R1 && isFinite(r.R))) {
        o.points.push({ x: r.R2, y: r.R, color: r.arr === 'series' ? C.a : C.b });
      }
      o.notes.push({ text: 'Parallel total is always less than the smaller resistor', color: C.b });
    }
    plot(cv, o);
  },

  readouts() {
    const p = this.p, lanes = this.lanes(), on = App.running;
    const per = fn => lanes.map(l => fn(this.solve(l, on), l));
    const rows = [
      { label: 'Battery p.d.', unit: 'V', vals: [fx(p.V, 1)] },
      { label: 'Total current', unit: 'A', vals: per(sol => fx(sol.I, 2)) },
      { label: 'Total resistance', unit: 'Ω', vals: lanes.map(l => { const R = this.solve(l, true).Rtot; return isFinite(R) ? sf(R, 3) : 'broken'; }) },
      { label: 'Current in each', unit: 'A', vals: per((sol, l) => sol.Ii.map((x, j) => this.comps(l)[j] === null ? '–' : fx(x, 2)).join(', ')) },
      { label: 'p.d. across each', unit: 'V', vals: per((sol, l) => sol.Vi.map((x, j) => this.comps(l)[j] === null ? '–' : fx(x, 2)).join(', ')) },
    ];
    if (p.realistic) rows.splice(1, 0, { label: 'p.d. across the circuit', unit: 'V', vals: per(sol => fx(on ? sol.Vt : 0, 2)) });
    return {
      cols: lanes.length > 1 ? [{ name: 'Series', cls: 'A' }, { name: 'Parallel', cls: 'B' }] : [{ name: '', cls: 'A' }],
      rows,
    };
  },

  // Readings are taken with the switch on.
  record() {
    return this.lanes().map(l => {
      const sol = this.solve(l, true), comps = this.comps(l), p = this.p;
      const what = p.kind === 'resistors' ? `${p.R1} Ω and ${p.R2} Ω` : `${comps.filter(c => c !== null).length} of ${comps.length} bulbs lit`;
      return { arr: l, what, V: sol.Vt, I: sol.I, R: sol.I > 1e-9 ? sol.Vt / sol.I : Infinity, kind: p.kind, R1: p.R1, R2: p.R2 };
    });
  },
});
/* ---------------------------------------------------------------------
   EXPERIMENT 6: REFRACTION THROUGH A GLASS BLOCK
   --------------------------------------------------------------------- */
// n = refractive index (how much the material slows light down: speed = 3.00 × 10⁸ ÷ n)
const MATERIALS = {
  glass: { label: 'Glass (refractive index 1.50)', short: 'glass', n: 1.5 },
  perspex: { label: 'Perspex (refractive index 1.49)', short: 'Perspex', n: 1.49 },
  water: { label: 'Water in a thin clear tank (1.33)', short: 'water', n: 1.33 },
};
const BLOCK_THICKNESS = 0.06;   // m: the block is 6 cm thick (top to bottom)
const DEG = Math.PI / 180;

Object.assign(Physics, {
  // Angle of refraction r (°) for light going from air into a material: sin i = n × sin r (Snell's law).
  refractionAngle(i, n) { return Math.asin(Math.sin(i * DEG) / n) / DEG; },
  // Angle of the ray leaving the bottom face back into air: sin e = n × sin r.
  emergenceAngle(r, n) { return Math.asin(Math.min(1, n * Math.sin(r * DEG))) / DEG; },
  // How far the ray is shifted sideways by a block of thickness t (m).
  lateralShift(i, n, t) { const r = Physics.refractionAngle(i, n) * DEG; return t * Math.sin(i * DEG - r) / Math.cos(r); },
});

  finished() { return this.s.done; },

  drawDiagram(ctx, w, h, C) {
    const lanes = this.lanes(), lw = w / lanes.length;
    let done = true;
    lanes.forEach((k, idx) => { if (!this.drawLane(ctx, k, idx * lw, lw, h, C, idx)) done = false; });
    this.s.done = this.s.t > 0 && done;
  },
  // Draws one ray through the block. Returns true when the light pulse has gone right through.
  drawLane(ctx, k, x0, lw, h, C, idx) {
    const p = this.p, ov = this.ov, fs = App.fs, { i, r, e, n } = this.angles(k);
    if (idx > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, x0, 0, x0, h); }
    const bw = lw * 0.62, bh = h * 0.34, bx = x0 + (lw - bw) / 2, by = h * 0.36;
    const ir = i * DEG, rr = r * DEG, travel = bh * Math.tan(rr);
    const eKey = k === 'B' ? 'entryB' : 'entry';
    const efMax = Math.max(0.05, (bw - travel - fs * 0.8) / bw);
    const ef = clamp(p[eKey], 0.05, efMax);
    const E = [bx + bw * ef, by], X = [E[0] + travel, by + bh];
    const d = [Math.sin(ir), Math.cos(ir)];
    // keep the ray box (about 3 font-heights long) inside the picture
    const Lin = Math.min((by - fs * 2.6) / Math.max(d[1], 0.17), (E[0] - x0 - fs * 3.2) / Math.max(d[0], 1e-3), lw * 0.5);
    const S = [E[0] - d[0] * Lin, E[1] - d[1] * Lin];
    const Lout = Math.min((h - X[1] - fs * 0.4) / Math.max(d[1], 0.17), (x0 + lw - X[0] - 4) / Math.max(d[0], 1e-3));
    const Z = [X[0] + d[0] * Lout, X[1] + d[1] * Lout];
    const ray = C.force;

    // block
    ctx.fillStyle = C.a; ctx.globalAlpha = 0.13; ctx.fillRect(bx, by, bw, bh); ctx.globalAlpha = 1;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.strokeRect(bx, by, bw, bh);
    label(ctx, MATERIALS[p.mat].short, bx + bw - fs * 0.4, by + bh - fs * 0.8, C.muted, { align: 'right', fs: fs * 0.85, bg: false });
    if (this.lanes().length > 1) label(ctx, `Ray ${k}`, x0 + fs * 0.4, fs * 0.9, k === 'A' ? C.a : C.b, { align: 'left', weight: 800 });

    // normals
    if (ov.normals) {
      ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]);
      line(ctx, E[0], E[1] - fs * 3.6, E[0], E[1] + fs * 3.6); line(ctx, X[0], X[1] - fs * 3.6, X[0], X[1] + fs * 3.6);
      ctx.setLineDash([]);
      label(ctx, 'normal', E[0], E[1] - fs * 4.1, C.muted, { fs: fs * 0.75 });
    }
    // sideways shift: where the ray would have gone without the block
    if (ov.shift && i > 0.5) {
      ctx.strokeStyle = ray; ctx.globalAlpha = 0.45; ctx.lineWidth = 2; ctx.setLineDash([3, 6]);
      line(ctx, E[0], E[1], E[0] + d[0] * (Lout + bh / Math.max(d[1], 0.17)), E[1] + d[1] * (Lout + bh / Math.max(d[1], 0.17)));
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      label(ctx, `sideways shift ${fx(Physics.lateralShift(i, n, BLOCK_THICKNESS) * 1000, 1)} mm`, X[0] - fs * 0.8, X[1] + fs * 1.6, ray, { align: 'right', fs: fs * 0.8 });
    }
    // partial reflections (realistic)
    if (p.realistic) {
      ctx.strokeStyle = ray; ctx.lineWidth = 2; ctx.globalAlpha = 0.3;
      line(ctx, E[0], E[1], E[0] + d[0] * Lin * 0.7, E[1] - d[1] * Lin * 0.7);
      line(ctx, X[0], X[1], X[0] + Math.sin(rr) * bh * 0.8 / Math.cos(rr), X[1] - bh * 0.8);
      ctx.globalAlpha = 1;
    }
    // the ray: in, through, out
    const path = [S, E, X, Z];
    if (p.realistic) {
      ctx.strokeStyle = ray; ctx.globalAlpha = 0.25; ctx.lineWidth = fs * 0.7; ctx.lineJoin = 'round';
      ctx.beginPath(); path.forEach((q, j) => j ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke(); ctx.globalAlpha = 1;
    }
    for (let j = 1; j < path.length; j++) {
      const [a, b] = [path[j - 1], path[j]], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      ctx.strokeStyle = ray; ctx.lineWidth = 3; line(ctx, a[0], a[1], b[0], b[1]);
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      arrow(ctx, mx - (b[0] - a[0]) / L * fs * 0.6, my - (b[1] - a[1]) / L * fs * 0.6, mx + (b[0] - a[0]) / L * fs * 0.6, my + (b[1] - a[1]) / L * fs * 0.6, ray, { width: 3 });
    }
    // ray box (drag it to change the angle)
    ctx.save(); ctx.translate(S[0], S[1]); ctx.rotate(Math.atan2(d[1], d[0]));
    ctx.fillStyle = C.ink; roundRect(ctx, -fs * 2.8, -fs * 0.65, fs * 2.8, fs * 1.3, 4); ctx.fill();
    ctx.fillStyle = ray; ctx.fillRect(-fs * 0.25, -fs * 0.15, fs * 0.25, fs * 0.3);
    ctx.restore();
    addHandle(ctx, { id: 'box' + k, x: S[0] - d[0] * fs * 1.4, y: S[1] - d[1] * fs * 1.4, r: fs * 1.5, cursor: 'grab',
      onDrag: (px, py) => {
        const ang = Math.atan2(E[0] - px, E[1] - py) / DEG;     // angle from the normal
        setParam(this, k === 'B' ? 'iB' : 'i', clamp(ang, 0, 80));
      } });
    addHandle(ctx, { id: 'entry' + k, x: E[0], y: E[1], r: fs * 0.9, cursor: 'ew-resize',
      onDrag: px => { p[eKey] = clamp((px - bx) / bw, 0.05, efMax); } });

    // angle arcs and labels
    if (ov.angles) {
      const R = fs * 2.4;
      const arc = (cx, cy, a1, a2, col, text, bis) => {
        if (a2 - a1 < 0.01) return;
        ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy, R, a1, a2); ctx.stroke();
        label(ctx, text, cx + Math.cos(bis) * (R + fs * 1.5), cy + Math.sin(bis) * (R + fs * 1.5), col, { fs: fs * 0.9, weight: 800 });
      };
      const show = (name, v) => ov.values ? `${name} = ${fx(v, p.realistic ? 0 : 1)}°` : name;
      arc(E[0], E[1], -Math.PI / 2 - ir, -Math.PI / 2, C.a, show('i', i), -Math.PI / 2 - Math.max(ir / 2, 0.35));
      arc(E[0], E[1], Math.PI / 2 - rr, Math.PI / 2, C.acc, show('r', r), Math.PI / 2 - Math.max(rr / 2, 0.35));
      arc(X[0], X[1], Math.PI / 2 - ir, Math.PI / 2, C.vel, show('e', e), Math.PI / 2 - Math.max(ir / 2, 0.35));
    }
    if (ov.eq) {
      const text = i < 0.5 ? 'Along the normal: no bending, but the light still slows down'
        : `Into the ${MATERIALS[p.mat].short}: slows down, bends towards the normal (r < i)`;
      label(ctx, text, x0 + lw / 2, h - fs * 0.8, C.ink, { fs: fs * (this.lanes().length > 1 ? 0.75 : 0.9) });
    }

    // the pulse of light: slower inside the block (speed ÷ n)
    const v = lw * 0.28, segT = [Math.hypot(E[0] - S[0], E[1] - S[1]) / v, Math.hypot(X[0] - E[0], X[1] - E[1]) * n / v, Math.hypot(Z[0] - X[0], Z[1] - X[1]) / v];
    let t = this.s.t;
    if (t <= 0) return false;
    for (let j = 0; j < 3; j++) {
      if (t <= segT[j]) {
        const a = path[j], b = path[j + 1], f = t / segT[j], px = a[0] + (b[0] - a[0]) * f, py = a[1] + (b[1] - a[1]) * f;
        const g = ctx.createRadialGradient(px, py, 0, px, py, fs * 1.2);
        g.addColorStop(0, 'rgba(255,240,120,1)'); g.addColorStop(1, 'rgba(255,200,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, fs * 1.2, 0, Math.PI * 2); ctx.fill();
        if (j === 1) label(ctx, `slower in ${MATERIALS[p.mat].short}: ${fx(3 / n, 2)} × 10⁸ m/s`, px + fs * 1.4, py, C.ink, { align: 'left', fs: fs * 0.8 });
        return false;
      }
      t -= segT[j];
    }
    return true;
  },

  drawGraph(cv, id, C) {
    const p = this.p, lanes = this.lanes(), n = MATERIALS[p.mat].n;
    const rows = (App.rows[this.id] || []).filter(r => r.matKey === p.mat);
    const o = { xLabel: 'Angle of incidence i (°)', xMax: 90, yMax: 90, series: [], points: [], lines: [], notes: [] };
    if (id === 'ri') {
      o.yLabel = 'Angle of refraction r (°)';
      o.lines.push({ x1: 0, y1: 0, x2: 90, y2: 90, color: C.muted, dash: [4, 6], label: 'r = i (no bending)' });
      if (this.ov.model) {
        const pts = [];
        for (let a = 0; a <= 90; a += 1) pts.push([a, Physics.refractionAngle(a, n)]);
        o.series.push({ pts, color: C.acc, width: 2, dash: [6, 5] });
      }
      for (const r of rows) o.points.push({ x: r.i, y: r.r, color: C.acc });
      for (const k of lanes) { const a = this.angles(k); o.points.push({ x: a.i, y: a.r, color: k === 'A' ? C.a : C.b, dot: true }); }
      o.notes.push({ text: 'r is always smaller than i: the ray bends towards the normal', color: C.ink });
      o.notes.push({ text: `This graph is for ${MATERIALS[p.mat].short}`, color: C.muted });
    } else {
      o.yLabel = 'Angle of emergence (°)';
      o.lines.push({ x1: 0, y1: 0, x2: 90, y2: 90, color: C.vel, width: 2.5, label: 'emergence = i' });
      for (const r of rows) o.points.push({ x: r.i, y: r.e, color: C.vel });
      for (const k of lanes) { const a = this.angles(k); o.points.push({ x: a.i, y: a.e, color: k === 'A' ? C.a : C.b, dot: true }); }
      o.notes.push({ text: 'The ray leaves at the same angle it went in:', color: C.ink });
      o.notes.push({ text: 'the emergent ray is parallel to the incident ray', color: C.ink });
    }
    if (!rows.length) o.message = 'Record readings at several angles to plot your own points';
    plot(cv, o);
  },

  readouts() {
    const lanes = this.lanes(), dp = this.p.realistic ? 0 : 1, per = fn => lanes.map(k => fn(this.angles(k)));
    return {
      cols: lanes.length > 1 ? [{ name: 'A', cls: 'A' }, { name: 'B', cls: 'B' }] : [{ name: '', cls: 'A' }],
      rows: [
        { label: 'Angle of incidence i', unit: '°', vals: per(a => fx(a.i, 0)) },
        { label: 'Angle of refraction r', unit: '°', vals: per(a => fx(a.r, dp)) },
        { label: 'Angle of emergence', unit: '°', vals: per(a => fx(a.e, dp)) },
        { label: 'Sideways shift (6 cm block)', unit: 'mm', vals: per(a => fx(Physics.lateralShift(a.i, a.n, BLOCK_THICKNESS) * 1000, 1)) },
        { label: 'Speed of light in block', unit: '× 10⁸ m/s', vals: [fx(3 / MATERIALS[this.p.mat].n, 2)] },
      ],
    };
  },

  record() {
    const jitter = () => this.p.realistic ? Math.round(Math.random() * 2 - 1) : 0;   // protractor reading ±1°
    return this.lanes().map(k => {
      const a = this.angles(k);
      return { matKey: this.p.mat, mat: MATERIALS[this.p.mat].short, i: a.i, r: Math.round(a.r) + jitter(), e: Math.round(a.e) + jitter() };
    });
  },
});
/* ---------------------------------------------------------------------
   EXPERIMENT 7: DISTANCE–TIME AND VELOCITY–TIME GRAPHS
   --------------------------------------------------------------------- */
// JOURNEYS: v0 = starting speed (m/s); each stage lasts dur seconds with acceleration a (m/s²).
const JOURNEYS = {
  steady: { label: 'Steady speed: 10 m/s', v0: 10, stages: [{ dur: 10, a: 0 }] },
  slow: { label: 'Steady speed: 5 m/s', v0: 5, stages: [{ dur: 10, a: 0 }] },
  speedup: { label: 'Speeding up, then steady', v0: 0, stages: [{ dur: 5, a: 2 }, { dur: 5, a: 0 }] },
  trip: { label: 'Speed up, steady, then brake', v0: 0, stages: [{ dur: 4, a: 2.5 }, { dur: 6, a: 0 }, { dur: 5, a: -2 }] },
  traffic: { label: 'Stop–start traffic', v0: 0, stages: [{ dur: 4, a: 2 }, { dur: 3, a: 0 }, { dur: 2, a: -4 }, { dur: 3, a: 0 }, { dur: 4, a: 2 }, { dur: 2, a: 0 }] },
  drive: { label: 'Drive it yourself (use the sliders)' },
};
const DRIVE_TIME = 30;   // s: how long "drive it yourself" runs for

Object.assign(Physics, {
  // Where a journey has got to at time t: distance x (m), velocity v (m/s), acceleration a (m/s²).
  // Uses s = u t + ½ a t² and v = u + a t for each stage, so it is exact.
  journeyState(j, t) {
    let x = 0, v = j.v0, left = t, a = 0;
    for (const st of j.stages) {
      const d = Math.min(left, st.dur);
      if (d <= 0) break;
      x += v * d + 0.5 * st.a * d * d; v += st.a * d; a = st.a; left -= d;
    }
    if (left > 0) a = 0;
    return { x, v: Math.max(0, v), a };
  },
  journeyDuration(j) { return j.stages.reduce((s, st) => s + st.dur, 0); },
});

  table: {

      { key: 'car', label: 'Car' },

    ],
    hint: 'Record a reading every second or two, then draw your own distance–time graph. The gradient of your graph at any time should match the velocity column.',
  },

  // ---- simulation ----
  lanes() { return this.p.compare ? ['A', 'B'] : ['A']; },
  journeyOf(k) { return JOURNEYS[k === 'B' ? this.p.journeyB : this.p.journey]; },
  usesDrive() { return this.p.journey === 'drive' || (this.p.compare && this.p.journeyB === 'drive'); },
  duration(k) { const j = this.journeyOf(k); return j.stages ? Physics.journeyDuration(j) : DRIVE_TIME; },
  reset() {
    this.s = { t: 0, lastSample: 0, cursor: null, A: null, B: null, hist: { A: [], B: [] } };
    for (const k of ['A', 'B']) {
      const j = this.journeyOf(k);
      this.s[k] = j.stages ? Physics.journeyState(j, 0) : { x: 0, v: 0, a: 0 };
      this.s.hist[k].push([0, this.s[k].x, this.s[k].v, this.s[k].a]);
    }
  },
  step(dt) {
    const s = this.s, p = this.p;
    s.t += dt; s.cursor = null;
    for (const k of this.lanes()) {
      const j = this.journeyOf(k), st = s[k];
      if (j.stages) { s[k] = Physics.journeyState(j, Math.min(s.t, this.duration(k))); continue; }
      // drive it yourself: change speed at the chosen rate until the target speed is reached
      const diff = p.vT - st.v, dv = p.acc * dt;
      if (Math.abs(diff) <= dv) { st.x += (st.v + p.vT) / 2 * dt; st.v = p.vT; st.a = 0; }
      else { st.a = Math.sign(diff) * p.acc; st.x += st.v * dt + 0.5 * st.a * dt * dt; st.v += st.a * dt; }
    }
    if (s.t - s.lastSample >= 0.05) {
      s.lastSample = s.t;
      for (const k of this.lanes()) if (s.t <= this.duration(k) + 0.05) s.hist[k].push([s.t, s[k].x, s[k].v, s[k].a]);
    }
  },
  finished() { return this.lanes().every(k => this.s.t >= this.duration(k)); },
  // The moment being looked at: now, or an earlier time picked by dragging the car.
  tNow() { return this.s.cursor !== null ? this.s.cursor : this.s.t; },
  stateAt(k, t) {
    const j = this.journeyOf(k);
    if (j.stages) return Physics.journeyState(j, Math.min(t, this.duration(k)));
    const h = this.s.hist[k];
    if (t >= this.s.t - 1e-9) return this.s[k];
    for (let i = 1; i < h.length; i++) {
      if (h[i][0] >= t) {
        const f = (t - h[i - 1][0]) / Math.max(1e-9, h[i][0] - h[i - 1][0]);
        return { x: h[i - 1][1] + (h[i][1] - h[i - 1][1]) * f, v: h[i - 1][2] + (h[i][2] - h[i - 1][2]) * f, a: h[i][3] };
      }
    }
    return this.s[k];
  },
  clock() { return this.s.cursor !== null ? `t = ${fx(this.s.cursor, 1)} s (looking back)` : `t = ${fx(this.s.t, 2)} s`; },
  // Biggest distance and speed, used to fix the road scale and graph axes.
  ranges() {
    let dMax = 10, vMax = 5, tMax = 10;
    for (const k of this.lanes()) {
      const j = this.journeyOf(k);
      if (j.stages) {
        const T = this.duration(k);
        tMax = Math.max(tMax, T);
        for (let t = 0; t <= T + 1e-9; t += T / 100) { const q = Physics.journeyState(j, t); dMax = Math.max(dMax, q.x); vMax = Math.max(vMax, q.v); }
      } else {

  },

  drawDiagram(ctx, w, h, C) {
    const lanes = this.lanes(), lh = h / lanes.length, fs = App.fs, ov = this.ov, rg = this.ranges(), tc = this.tNow();
    const xr0 = fs * 2.2, xr1 = w - fs * 2.2, ppm = (xr1 - xr0) / rg.dMax;
    const pxV = w / 50, pxA = w / 30;
    lanes.forEach((k, i) => {
      const y0 = i * lh, col = k === 'A' ? C.a : C.b, st = this.stateAt(k, tc);
      if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, 0, y0, w, y0); }
      const roadY = y0 + lh * 0.6, roadH = Math.min(lh * 0.2, fs * 2.6);
      // road with distance markers
      ctx.fillStyle = C.panel2; ctx.fillRect(0, roadY - roadH / 2, w, roadH);
      ctx.strokeStyle = C.muted; ctx.lineWidth = 2; ctx.setLineDash([fs, fs]); line(ctx, 0, roadY, w, roadY); ctx.setLineDash([]);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; line(ctx, 0, roadY + roadH / 2, w, roadY + roadH / 2);
      const step = niceStep(rg.dMax, 6);
      ctx.fillStyle = C.muted; ctx.font = `${fs * 0.8}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (let m = 0; m <= rg.dMax + 1e-9; m += step) {
        const X = xr0 + m * ppm;
        line(ctx, X, roadY + roadH / 2, X, roadY + roadH / 2 + fs * 0.4);
        ctx.fillText(m + ' m', X, roadY + roadH / 2 + fs * 0.45);
      }
      // the car (centre at its distance along the road)
      const X = xr0 + st.x * ppm, cw = fs * 3.4, ch = fs * 1.1, cy = roadY - fs * 0.15;
      ctx.fillStyle = col; roundRect(ctx, X - cw / 2, cy - ch, cw, ch, 5); ctx.fill();
      roundRect(ctx, X - cw * 0.28, cy - ch * 1.75, cw * 0.5, ch * 0.85, 5); ctx.fill();
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; roundRect(ctx, X - cw / 2, cy - ch, cw, ch, 5); ctx.stroke();
      ctx.fillStyle = C.ink;
      for (const wx of [X - cw * 0.3, X + cw * 0.3]) { ctx.beginPath(); ctx.arc(wx, cy, fs * 0.38, 0, Math.PI * 2); ctx.fill(); }
      if (lanes.length > 1) label(ctx, `Car ${k}: ${this.journeyOf(k).label}`, fs * 0.4, y0 + fs * 0.9, col, { align: 'left', weight: 800, fs: fs * 0.9 });
      // drag the car (when paused) to look back in time
      if (!App.running && this.s.t > 0) {
        addHandle(ctx, { id: 'car' + k, x: X, y: cy - ch * 0.6, r: fs * 1.8, cursor: 'ew-resize',
          onDrag: px => {
            const target = (px - xr0) / ppm, hist = this.s.hist[k];
            let t = this.s.t;
            for (const q of hist) if (q[1] >= target - 1e-9) { t = q[0]; break; }
            this.s.cursor = clamp(t, 0, this.s.t);
          } });
      }
      // arrows above the car
      let ay = cy - ch * 1.75 - fs * 0.9;
      if (ov.vel) {
        if (st.v > 1e-3) arrow(ctx, X, ay, X + Math.min(st.v * pxV, w * 0.4), ay, C.vel, { width: 5, label: ov.values ? `v = ${fx(st.v, 1)} m/s` : 'velocity', lx: X + Math.min(st.v * pxV, w * 0.4) + fs * 0.4, align: 'left' });
        else label(ctx, 'v = 0 (stopped)', X, ay, C.vel, { fs: fs * 0.85 });
        ay -= fs * 1.5;
      }
      if (ov.acc) {
        if (Math.abs(st.a) > 1e-3) {
          const L = st.a * pxA;
          arrow(ctx, X, ay, X + L, ay, C.acc, { width: 4, label: ov.values ? `a = ${fx(st.a, 2)} m/s²` : (st.a > 0 ? 'speeding up' : 'slowing down'), lx: X + L + (L > 0 ? fs * 0.4 : -fs * 0.4), align: L > 0 ? 'left' : 'right' });
        } else label(ctx, 'a = 0', X, ay, C.acc, { fs: fs * 0.85 });
      }
      if (ov.eq) {
        const text = tc > 0 ? `average speed = distance ÷ time = ${fx(st.x, 1)} m ÷ ${fx(tc, 1)} s = ${fx(st.x / tc, 1)} m/s` : 'average speed = distance ÷ time';
        label(ctx, text, fs * 0.4, y0 + lh - fs * 0.8, C.ink, { align: 'left', fs: fs * 0.88 });
      }
      if (i === 0 && !App.running && this.s.t > 0) label(ctx, 'Drag the car to look back in time', w - fs * 0.4, fs * 0.9, C.muted, { align: 'right', fs: fs * 0.8 });
    });
  },

  // One graph (distance–time or velocity–time). area = part of the canvas to draw in (for "both").
  oneGraph(cv, kind, C, area, compact) {
    const lanes = this.lanes(), rg = this.ranges(), tc = this.tNow(), ov = this.ov;
    const dist = kind === 'dt', idx = dist ? 1 : 2;
    const o = { xLabel: 'Time t (s)', yLabel: dist ? 'Distance s (m)' : 'Velocity v (m/s)', xMax: rg.tMax, yMax: dist ? rg.dMax : rg.vMax,
                series: [], points: [], lines: [], notes: [], shade: [] };
    const span = rg.tMax * 0.12;
    for (const k of lanes) {
      const col = k === 'A' ? C.a : C.b, tag = lanes.length > 1 ? k + ': ' : '';
      const pts = this.s.hist[k].map(q => [q[0], q[idx]]);
      const now = this.s[k];
      if (this.s.t <= this.duration(k)) pts.push([this.s.t, dist ? now.x : now.v]);
      o.series.push({ pts, color: col, width: 3.5, label: !compact && lanes.length > 1 ? `Car ${k}` : null });
      const st = this.stateAt(k, tc);
      o.points.push({ x: tc, y: dist ? st.x : st.v, color: col, dot: true });
      if (!dist && ov.area) {
        o.shade.push({ pts: pts.filter(q => q[0] <= tc + 1e-9).concat([[tc, st.v]]), color: col });
        if (!(compact && lanes.length > 1)) o.notes.push({ text: `${tag}shaded area = distance travelled = ${fx(st.x, 1)} m`, color: col });
      }
      if (ov.tangent) {
        const g = dist ? st.v : st.a, y = dist ? st.x : st.v;
        o.lines.push({ x1: tc - span, y1: y - g * span, x2: tc + span, y2: y + g * span, color: C.ink, width: 2, dash: [6, 4] });
        o.notes.push({ text: dist ? `${tag}gradient = speed = ${fx(g, 1)} m/s` : `${tag}gradient = acceleration = ${fx(g, 2)} m/s²`, color: col });
      }
    }
    plot(cv, o, area);
  },
  drawGraph(cv, id, C) {
    if (id !== 'both') return this.oneGraph(cv, id, C, null, false);
    const { ctx, w, h } = prep(cv);
    this.oneGraph(cv, 'dt', C, { ctx, x: 0, y: 0, w, h: h / 2 }, true);
    this.oneGraph(cv, 'vt', C, { ctx, x: 0, y: h / 2, w, h: h / 2 }, true);
  },

  readouts() {
    const lanes = this.lanes(), tc = this.tNow(), per = fn => lanes.map(k => fn(this.stateAt(k, tc)));
    return {
      cols: lanes.length > 1 ? [{ name: 'A', cls: 'A' }, { name: 'B', cls: 'B' }] : [{ name: '', cls: 'A' }],
      rows: [
        { label: 'Time t', unit: 's', vals: [fx(tc, 1)] },
        { label: 'Distance s', unit: 'm', vals: per(q => fx(q.x, 1)) },
        { label: 'Velocity v', unit: 'm/s', vals: per(q => fx(q.v, 1)) },
        { label: 'Acceleration a', unit: 'm/s²', vals: per(q => fx(q.a, 2)) },
        { label: 'Average speed s ÷ t', unit: 'm/s', vals: per(q => tc > 0 ? fx(q.x / tc, 1) : '—') },
      ],
    };
  },

  record() {
    const tc = this.tNow();
    return this.lanes().map(k => { const q = this.stateAt(k, tc); return { car: k, t: tc, x: q.x, v: q.v, a: q.a }; });
  },
});
/* ---------------------------------------------------------------------
   EXPERIMENT 8: RADIOACTIVE DECAY AND HALF-LIFE  (a model, like dice)
   --------------------------------------------------------------------- */
const DECAY_CHANCES = [['0.5', '1 in 2 (like tossing a coin)'], ['0.1666667', '1 in 6 (like rolling a dice)'], ['0.1', '1 in 10'], ['0.05', '1 in 20']];
const DECAY_MAX_STEPS = 40;   // minutes the model runs for
const BACKGROUND_MEAN = 3;    // average background counts per minute in Realistic mode

Object.assign(Physics, {
  // One minute of the model. alive[i] = −1 for an undecayed nucleus, or the minute it decayed.
  // Every undecayed nucleus has the same chance p of decaying. Returns how many decayed.
  decayStep(alive, p, minute, rand = Math.random) {
    let n = 0;
    for (let i = 0; i < alive.length; i++) if (alive[i] < 0 && rand() < p) { alive[i] = minute; n++; }
    return n;
  },
  // Half-life of the model in minutes: the time for (1 − p)^t to reach ½.
  halfLife(p) { return Math.log(2) / -Math.log(1 - p); },
  // A random whole number of background counts with the given average (Poisson).
  background(mean, rand = Math.random) {
    let k = 0, prod = rand();
    const L = Math.exp(-mean);
    while (prod > L) { k++; prod *= rand(); }
    return k;
  },
});

  // ---- simulation ----
  lanes() { return this.p.compare ? ['A', 'B'] : ['A']; },
  chance(k) { return +(k === 'B' ? this.p.pB : this.p.p); },
  chanceLabel(k) { const v = k === 'B' ? this.p.pB : this.p.p; return DECAY_CHANCES.find(c => c[0] === v)[1].split(' (')[0]; },
  reset() {
    const mk = () => ({ alive: new Int16Array(this.p.N0).fill(-1), N: this.p.N0, hist: [[0, this.p.N0, 0, 0]] });
    this.s = { t: 0, acc: 0, minute: 0, A: mk(), B: mk() };
  },
  step(dt) {
    const s = this.s;
    s.t += dt; s.acc += dt * 2;                     // the model runs at 2 minutes per second
    while (s.acc >= 1 - 1e-9 && !this.finished()) {
      s.acc -= 1; s.minute++;
      for (const k of this.lanes()) {
        const L = s[k], d = Physics.decayStep(L.alive, this.chance(k), s.minute);

      }

  },
  finished() { return this.s.minute >= DECAY_MAX_STEPS || this.lanes().every(k => this.s[k].N === 0); },
  clock() { return `time = ${this.s.minute} min`; },
  // first minute at which N fell to half or less (from this run)
  measuredHalf(k) { const q = this.s[k].hist.find(r => r[1] <= this.p.N0 / 2); return q ? q[0] : null; },

  drawDiagram(ctx, w, h, C) {
    const lanes = this.lanes(), lw = w / lanes.length, fs = App.fs, N0 = this.p.N0, minute = this.s.minute;
    label(ctx, 'MODEL: each dot is one unstable nucleus. Not real radioactive material.', w / 2, fs * 0.9, C.ink, { weight: 800, fs: fs * 0.9 });
    lanes.forEach((k, i) => {
      const x0 = i * lw, col = k === 'A' ? C.a : C.b, L = this.s[k];
      if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, x0, fs * 1.8, x0, h); }
      label(ctx, `${lanes.length > 1 ? 'Sample ' + k + ': ' : ''}chance ${this.chanceLabel(k)} each minute`, x0 + lw / 2, fs * 2.4, col, { fs: fs * 0.85, weight: 750 });
      const top = fs * 3.4, bottom = h - fs * 2.0, gw = lw - fs * 1.2, gh = bottom - top;
      const cols = Math.ceil(Math.sqrt(N0 * gw / gh)), rows = Math.ceil(N0 / cols);
      const cell = Math.min(gw / cols, gh / rows), ox = x0 + (lw - cols * cell) / 2, oy = top + (gh - rows * cell) / 2;
      for (let j = 0; j < N0; j++) {
        const cx = ox + (j % cols + 0.5) * cell, cy = oy + (Math.floor(j / cols) + 0.5) * cell, a = L.alive[j];
        ctx.beginPath(); ctx.arc(cx, cy, cell * (a === minute && minute > 0 ? 0.45 : 0.36), 0, Math.PI * 2);
        if (a < 0) { ctx.fillStyle = col; ctx.fill(); }
        else if (a === minute) { ctx.fillStyle = C.acc; ctx.fill(); }          // decayed this minute
        else { ctx.strokeStyle = C.muted; ctx.globalAlpha = 0.5; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1; }   // decayed earlier
      }
      if (this.ov.values) {

      }

  drawGraph(cv, id, C) {

    const o = { xLabel: 'Time (minutes)', xMax: tMax, series: [], points: [], lines: [], notes: [], bars: [], notesRight: true };
    if (id === 'N') {
      Object.assign(o, { yLabel: 'Undecayed nuclei N', yMax: niceCeil(N0) });
      lanes.forEach((k, li) => {
        const col = k === 'A' ? C.a : C.b, p = this.chance(k), Th = Physics.halfLife(p), tag = lanes.length > 1 ? k + ': ' : '';
        if (ov.model) {
          const pts = [];

        if (ov.halflife && (li === 0 || this.chance('B') !== this.chance('A'))) {
          for (let m = 1; m <= 3 && m * Th <= tMax; m++) {
            const y = N0 / Math.pow(2, m);
            o.lines.push({ x1: 0, y1: y, x2: m * Th, y2: y, color: col, dash: [3, 5] }, { x1: m * Th, y1: y, x2: m * Th, y2: 0, color: col, dash: [3, 5] });
          }
        }
        o.notes.push({ text: `${tag}model half-life = ${fx(Th, 1)} min`, color: col });
        const mh = this.measuredHalf(k);
        if (mh !== null) o.notes.push({ text: `${tag}this run: N fell to ${N0 / 2} by ${mh} min`, color: col });
      });
      if (ov.halflife) o.notes.push({ text: 'Dashed lines: ½, ¼ and ⅛ left after 1, 2 and 3 half-lives', color: C.muted });
    } else {
      let top = 1;
      lanes.forEach((k, li) => {
        const col = k === 'A' ? C.a : C.b, p = this.chance(k);
        for (const q of this.s[k].hist.slice(1)) {
          o.bars.push({ x: q[0] + (lanes.length > 1 ? (li - 0.5) * 0.4 : 0), y: q[3], width: lanes.length > 1 ? 0.38 : 0.7, color: col });
          top = Math.max(top, q[3]);
        }
        if (ov.model) {
          const pts = [];
          for (let t = 1; t <= tMax; t += 0.25) pts.push([t, N0 * Math.pow(1 - p, t - 1) * p + (this.p.realistic ? BACKGROUND_MEAN : 0)]);
          o.series.push({ pts, color: col, width: 2, dash: [6, 5] });
          top = Math.max(top, N0 * p);
        }
      });
      Object.assign(o, { yLabel: 'Count in that minute', yMax: niceCeil(top * 1.15) });
      if (this.p.realistic) {
        o.lines.push({ x1: 0, y1: BACKGROUND_MEAN, x2: tMax, y2: BACKGROUND_MEAN, color: C.muted, dash: [4, 4], label: `background ≈ ${BACKGROUND_MEAN} per minute` });
        o.notes.push({ text: 'Subtract the background count before finding the half-life', color: C.ink });
      }
      o.notes.push({ text: 'The count rate also halves every half-life', color: C.ink });
    }
    plot(cv, o);
  },

  readouts() {
    const lanes = this.lanes(), N0 = this.p.N0, per = fn => lanes.map(k => fn(this.s[k], k));
    return {
      cols: lanes.length > 1 ? [{ name: 'A', cls: 'A' }, { name: 'B', cls: 'B' }] : [{ name: '', cls: 'A' }],
      rows: [
        { label: 'Time', unit: 'min', vals: [String(this.s.minute)] },
        { label: 'Undecayed nuclei N', unit: '', vals: per(L => String(L.N)) },
        { label: 'Decayed so far', unit: '', vals: per(L => String(N0 - L.N)) },
        { label: 'Fraction left', unit: '%', vals: per(L => fx(100 * L.N / N0, 0)) },
        { label: 'Count this minute', unit: '', vals: per(L => String(L.hist[L.hist.length - 1][3])) },
        { label: 'Half-life (model)', unit: 'min', vals: per((L, k) => fx(Physics.halfLife(this.chance(k)), 1)) },
      ],
    };
  },

  record() {
    return this.lanes().map(k => {
      const last = this.s[k].hist[this.s[k].hist.length - 1];
      return { sample: k, t: last[0], N: last[1], count: last[3] };
    });
  },
});

  water: { label: 'Water in a thin can (c = 4200 J/kg °C)', short: 'water', c: 4200, rho: 1000, color: '#4a90d9' },
};
const HEAT_TIME_SCALE = 20;   // the heating runs 20 × faster than real time (1 s on screen = 20 s)
const HEAT_RUN_TIME = 600;    // s: 10 minutes of heating
const HEATER = { Ch: 60, G: 3 };   // Realistic mode: heater's own heat capacity (J/°C) and how fast it passes energy to the block (W/°C)
const BLOCK_LOSS = { none: 0.4, wrapped: 0.1 };   // W/°C lost to the room (Realistic mode)

Object.assign(Physics, {
  // Temperature rise Δθ (°C) when energy E (J) heats a mass m (kg) with specific heat capacity c: ΔE = m c Δθ
  temperatureRise(E, m, c) { return E / (m * c); },
  // Heat the block for dt seconds with heater power P (W). st = { T, Th (heater temperature), E (energy supplied) }
  heatStep(st, dt, P, m, c, real, kLoss) {
    st.E += P * dt;
    if (!real) { st.T += P * dt / (m * c); st.Th = st.T; st.lost = 0; return st; }
    const toBlock = HEATER.G * (st.Th - st.T), lost = kLoss * (st.T - ROOM_TEMP);
    st.Th += (P - toBlock) * dt / HEATER.Ch;          // the heater warms up first
    st.T += (toBlock - lost) * dt / (m * c);           // the block gains what the heater passes on, minus losses
    st.lost = lost;
    return st;
  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 10: THERMAL INSULATION
   --------------------------------------------------------------------- */
/* How quickly energy escapes from the beaker, in watts per °C of temperature
   difference, by each path: conduction (through the sides), convection
   (warm air and steam rising, mostly from the open top) and radiation.
   css = colour used for that material on screen.                        */
const INSULATORS = [
  { key: 'none', label: 'No insulation', short: 'none', css: 'muted', cond: 0.35, conv: 0.40, rad: 0.25 },
  { key: 'foil', label: 'Aluminium foil', short: 'foil', css: 'friction', cond: 0.33, conv: 0.36, rad: 0.06 },
  { key: 'card', label: 'Card', short: 'card', css: 'b', cond: 0.20, conv: 0.36, rad: 0.18 },
  { key: 'bubble', label: 'Bubble wrap', short: 'bubble', css: 'vel', cond: 0.10, conv: 0.32, rad: 0.12 },
  { key: 'cotton', label: 'Cotton wool', short: 'cotton', css: 'a', cond: 0.06, conv: 0.30, rad: 0.10 },
];
const INSUL_TIME_SCALE = 30;   // 1 s on screen = 30 s of cooling
const INSUL_RUN_TIME = 1200;   // s: 20 minutes
const LID_FACTOR = 0.35;       // a lid cuts convection and evaporation from the top to 35%
const C_WATER = 4200;          // J/kg °C

Object.assign(Physics, {
  // Rates (W per °C) for one beaker. More layers slow conduction; a lid cuts convection.
  insulationRates(ins, layers, lid) {
    const cond = ins.key === 'none' ? ins.cond : ins.cond / layers;
    return { cond, conv: ins.conv * (lid ? LID_FACTOR : 1), rad: ins.rad };
  },
  /* Cool the water for dt seconds. Ideal: every path is proportional to the
     temperature difference (Newton's law of cooling). Realistic: convection and
     evaporation grow faster at high temperatures, and radiation follows T⁴. */
  coolStep(T, dt, rates, mWater, real) {
    const d = T - ROOM_TEMP;
    if (d <= 0) return T;
    let P = (rates.cond + rates.conv + rates.rad) * d;
    if (real) {
      const Tk = T + 273, Rk = ROOM_TEMP + 273;
      P = rates.cond * d + rates.conv * d * Math.pow(d / 40, 0.33) + rates.rad * (Tk ** 4 - Rk ** 4) / (4 * Rk ** 3);
    }
    return T - P * dt / (mWater * C_WATER);
  },
});

  drawBeaker(ctx, ins, x, yb, bw, bh, C, big) {
    const fs = App.fs, T = this.s.T[ins.key], wrap = ins.key === 'none' ? 0 : fs * (big ? 0.35 : 0.22) * this.p.layers;
    const left = x - bw / 2, top = yb - bh, waterTop = top + bh * 0.22;

      ctx.fillRect(left - wrap, yb, bw + 2 * wrap, wrap * 0.6);
      ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
      ctx.strokeRect(left - wrap, top + bh * 0.12, wrap, bh * 0.88); ctx.strokeRect(left + bw, top + bh * 0.12, wrap, bh * 0.88);
    }
    ctx.strokeStyle = C.ink; ctx.lineWidth = big ? 3 : 2;
    ctx.beginPath(); ctx.moveTo(left, top); ctx.lineTo(left, yb); ctx.lineTo(left + bw, yb); ctx.lineTo(left + bw, top); ctx.stroke();
    if (this.p.lid === 'on') { ctx.fillStyle = C.muted; ctx.fillRect(left - wrap - 3, top - fs * 0.35, bw + 2 * wrap + 6, fs * 0.35); }
    // thermometer
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; line(ctx, x + bw * 0.25, top - fs * 1.2, x + bw * 0.25, yb - fs * 0.6);
    ctx.fillStyle = '#e0261b'; ctx.beginPath(); ctx.arc(x + bw * 0.25, yb - fs * 0.6, fs * 0.22, 0, Math.PI * 2); ctx.fill();
    return { left, top, waterTop, wrap };

      const r = this.rates(ins), sc = fs * 0.09;       // arrow length per watt
      const Pc = r.cond * d, Pv = r.conv * d, Pr = r.rad * d;
      const yM = (g.waterTop + benchY) / 2;
      for (const sgn of [-1, 1]) {
        const x1 = bx + sgn * (bw / 2 + g.wrap + 2);

        wavyArrow(ctx, x1, yM - bh * 0.25, x1 + sgn * (fs * 0.6 + Pr * sc), yM - bh * 0.25 - (fs * 0.6 + Pr * sc) * 0.5, C.force, { width: 2.5 });
      }
      if (!(p.lid === 'on' && Pv < 0.5)) {
        for (const dx of [-0.2, 0.15]) {
          const x = bx + dx * bw, y1 = g.top - (p.lid === 'on' ? fs * 0.4 : 0);
          ctx.strokeStyle = C.friction; ctx.lineWidth = 3; ctx.beginPath();
          ctx.moveTo(x, y1); ctx.bezierCurveTo(x - fs, y1 - fs * 1.2, x + fs, y1 - fs * 2, x, y1 - fs * 1.2 - Pv * sc);
          ctx.stroke();
          arrow(ctx, x, y1 - fs * 0.9 - Pv * sc, x, y1 - fs * 1.4 - Pv * sc, C.friction, { width: 3 });
        }
      }
      const v = t => ov.values ? t : t.split(':')[0];
      label(ctx, v(`conduction: ${fx(Pc, 1)} W`), bx + bw / 2 + g.wrap + fs * 0.5, yM + fs * 1.1, '#c06000', { align: 'left', fs: fs * 0.8 });
      label(ctx, v(`radiation: ${fx(Pr, 1)} W`), bx + bw / 2 + g.wrap + fs * 0.5, yM - bh * 0.25 - fs * 2.4, C.force, { align: 'left', fs: fs * 0.8 });
      label(ctx, v(`convection: ${fx(Pv, 1)} W`), bx, g.top - fs * 3.6 - Pv * sc, C.friction, { fs: fs * 0.8 });
    }
    if (ov.eq) {
      const drop = p.T0 - T;
      label(ctx, `Energy lost so far: ΔE = m c Δθ = ${fx(p.mw / 1000, 2)} × 4200 × ${fx(drop, 1)} = ${sf(p.mw / 1000 * C_WATER * drop, 3)} J`,
        fs * 0.4, benchY + (h - benchY) / 2, C.ink, { align: 'left', fs: fs * 0.8 });
    }
    // ----- all five beakers (right) -----
    const x0 = w * 0.47, slot = (w - x0) / INSULATORS.length, sbw = Math.min(slot * 0.5, fs * 3.2), sbh = Math.min(h * 0.3, sbw * 1.4);
    label(ctx, 'All five beakers cool at the same time (click one to close up)', x0 + (w - x0) / 2, fs * 0.9, C.muted, { fs: fs * 0.8 });
    INSULATORS.forEach((m, j) => {

      const gg = this.drawBeaker(ctx, m, cx, benchY - fs * 2.6, sbw, sbh, C, false);
      label(ctx, m.short, cx, benchY - fs * 1.4, col, { fs: fs * 0.8, weight: 800 });
      if (ov.values) label(ctx, `${fx(this.reading(this.s.T[m.key]), 1)} °C`, cx, gg.top - fs * 1.9, col, { fs: fs * 0.85, weight: 800 });
      if (m.key === p.focus) { ctx.strokeStyle = C.accent; ctx.lineWidth = 2.5; ctx.setLineDash([6, 4]); ctx.strokeRect(cx - slot / 2 + 3, fs * 1.8, slot - 6, benchY - fs * 2); ctx.setLineDash([]); }
      addHandle(ctx, { id: 'beaker' + m.key, x: cx, y: benchY - fs * 2.6 - sbh / 2, r: Math.max(sbw * 0.6, fs), cursor: 'pointer',
        start: () => { this.p.focus = m.key; syncControls(); } });
    });

  },

  readouts() {
    const p = this.p;
    return {
      cols: INSULATORS.map(m => ({ name: m.short, css: m.css })),
      rows: [
        { label: 'Time', unit: 'min', vals: [fx(this.s.t / 60, 1)] },

        { label: 'Temperature drop', unit: '°C', vals: INSULATORS.map(m => fx(p.T0 - this.s.T[m.key], 1)) },
        { label: 'Energy lost m c Δθ', unit: 'kJ', vals: INSULATORS.map(m => sf(p.mw / 1000 * C_WATER * (p.T0 - this.s.T[m.key]) / 1000, 2)) },
      ],
    };
  },

  record() {
    const p = this.p;
    return INSULATORS.map(m => ({ mat: m.label, layers: m.key === 'none' ? '–' : String(p.layers), lid: p.lid === 'on' ? 'yes' : 'no',
      t: this.s.t / 60, T: this.reading(this.s.T[m.key]), drop: p.T0 - this.reading(this.s.T[m.key]) }));
  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 11: INFRARED RADIATION (emission and absorption)
   --------------------------------------------------------------------- */
// eps = how good the surface is at emitting (and absorbing) infrared, from 0 to 1.
// Real values: matt black paint 0.95; shiny black paint about 0.88; matt white paint about 0.85;
// polished silver about 0.05.
const SURFACES = [
  { key: 'mattBlack', label: 'Matt black', eps: 0.95, fill: '#1c1c1c', shine: false },
  { key: 'shinyBlack', label: 'Shiny black', eps: 0.88, fill: '#000000', shine: true },
  { key: 'mattWhite', label: 'Matt white', eps: 0.84, fill: '#f2f2f2', shine: false },
  { key: 'shinySilver', label: 'Shiny silver', eps: 0.05, fill: '#c9ced6', shine: true },
];
const SIGMA = 5.67e-8;        // Stefan–Boltzmann constant (W/m² K⁴), not needed for GCSE
const CUBE_FACE_AREA = 0.01;  // m²: each face of the Leslie cube is 10 cm × 10 cm
const IR_TIME_SCALE = 10;     // absorption test: 1 s on screen = 10 s
const PLATE = { C: 20, h: 0.12, area: 0.01, melt: 50 };   // plate heat capacity (J/°C), heat loss (W/°C), area (m²), wax melting point (°C)

Object.assign(Physics, {
  // Infrared reaching the detector (W/m²) from a face at T (°C), d metres away.
  irReading(eps, T, d) {
    const Tk = T + 273, Rk = ROOM_TEMP + 273;
    const geom = Math.min(1, CUBE_FACE_AREA / (Math.PI * d * d));    // spreads out with distance
    return eps * SIGMA * (Tk ** 4 - Rk ** 4) * geom;
  },
  // Absorption test: warm a plate for dt seconds. I = infrared falling on it (W/m²).
  plateStep(T, dt, eps, I) {
    return T + (eps * I * PLATE.area - PLATE.h * (T - ROOM_TEMP)) * dt / PLATE.C;
  },
});
