    const at = d => [px + Math.cos(th) * d * ppm, py + Math.sin(th) * d * ppm];      // point on the beam d metres right of the pivot
    // pivot
    ctx.fillStyle = C.muted; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - fs * 1.5, h * 0.8); ctx.lineTo(px + fs * 1.5, h * 0.8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.ground; ctx.fillRect(0, h * 0.8, w, h * 0.2);
    // beam with a scale every 5 cm
    const [ax, ay] = at(-BEAM.half), [bx, by] = at(BEAM.half);
    ctx.strokeStyle = '#b98a55'; ctx.lineWidth = fs * 0.7; line(ctx, ax, ay, bx, by);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1;
    for (let cm = -50; cm <= 50; cm += 5) {
      const [x, y] = at(cm / 100);
      line(ctx, x, y - fs * 0.35, x, y - (cm % 10 === 0 ? fs * 0.05 : fs * 0.2));
      if (cm % 10 === 0 && cm !== 0) { ctx.fillStyle = C.muted; ctx.font = `${fs * 0.65}px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(String(Math.abs(cm)), x, y - fs * 0.75); }
    }
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(px, py, fs * 0.3, 0, Math.PI * 2); ctx.fill();
    // weights (drag along the beam)
    [['L', -p.dL / 100, p.WL, C.a], ['R', p.dR / 100, p.WR, C.b]].forEach(([side, d, W, col]) => {
      const [hx, hy] = at(d), size = fs * (2.6 + W * 0.15), top = hy + fs * 1.2;
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; line(ctx, hx, hy, hx, top);
      ctx.fillStyle = col; roundRect(ctx, hx - size / 2, top, size, size, 4); ctx.fill(); ctx.strokeStyle = C.ink; ctx.stroke();
      ctx.fillStyle = C.bg; ctx.font = `800 ${fs * 0.85}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(`${fx(W, 1)} N`, hx, top + size / 2);
      addHandle(ctx, { id: 'w' + side, x: hx, y: top + size / 2, r: size * 0.7, cursor: 'ew-resize',
        onDrag: x => { const dd = Math.abs(x - px) / ppm * 100; setParam(this, side === 'L' ? 'dL' : 'dR', dd); this.onParam(); } });
      if (ov.values) label(ctx, `${fx(Math.abs(d) * 100, 0)} cm`, (hx + px) / 2, hy + fs * 0.9, col, { fs: fs * 0.8 });
      if (ov.moments) {
        // curved arrow over the pivot: clockwise on the right, anticlockwise on the left
        const M = W * Math.abs(d), r = fs * (2 + M * 2.2), cw = side === 'R';
        const a0 = cw ? -Math.PI * 0.4 : -Math.PI * 0.85, a1 = cw ? -Math.PI * 0.15 : -Math.PI * 0.6;
        ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(px, py, r, a0, a1); ctx.stroke();
        const tipA = cw ? a1 : a0, tx = px + Math.cos(tipA) * r, ty = py + Math.sin(tipA) * r;
        const tdx = cw ? -Math.sin(tipA) : Math.sin(tipA), tdy = cw ? Math.cos(tipA) : -Math.cos(tipA);   // direction of travel at the tip
        arrow(ctx, tx - tdx * 10, ty - tdy * 10, tx, ty, col, { width: 4 });
        if (ov.values) label(ctx, `${cw ? 'clockwise' : 'anticlockwise'}: ${fx(W, 1)} N × ${fx(Math.abs(d), 2)} m = ${fx(M, 2)} N m`, cw ? w - fs * 0.4 : fs * 0.4, cw ? fs * 2.3 : fs * 2.3, col, { align: cw ? 'right' : 'left', fs: fs * 0.85, weight: 750 });
      }
    });
    const ML = this.ML(), MR = this.MR(), diff = MR - ML;
    const verdict = Math.abs(diff) < 1e-9 ? 'Balanced: clockwise moment = anticlockwise moment'
      : diff > 0 ? 'Clockwise moment is bigger: the right side goes down' : 'Anticlockwise moment is bigger: the left side goes down';
    label(ctx, verdict, w / 2, fs * 0.9, Math.abs(diff) < 1e-9 ? C.vel : C.force, { weight: 800 });
    if (ov.eq) label(ctx, `M = F d   ·   anticlockwise ${fx(ML, 2)} N m   vs   clockwise ${fx(MR, 2)} N m`, w / 2, h * 0.9, C.ink, { fs: fs * 0.9 });
    if (!App.running && s.th === 0 && Math.abs(diff) > 1e-9) label(ctx, 'Beam held level: press “Let go”', w / 2, h * 0.75, C.muted, { fs: fs * 0.8 });
  },

  drawGraph(cv, id, C) {
    const p = this.p;
    if (id === 'Md') {
      const MLnow = this.ML();
      plot(cv, { xLabel: 'Distance from pivot d (m)', yLabel: 'Moment M (N m)', xMax: 0.5, yMax: niceCeil(Math.max(p.WL, p.WR) * 0.5 * 1.1),
        series: [{ pts: [[0, 0], [0.5, p.WL * 0.5]], color: C.a, width: 3, label: `left weight ${fx(p.WL, 1)} N` }, { pts: [[0, 0], [0.5, p.WR * 0.5]], color: C.b, width: 3, label: `right weight ${fx(p.WR, 1)} N` }],
        lines: [{ x1: 0, y1: MLnow, x2: 0.5, y2: MLnow, color: C.a, dash: [5, 5], label: 'anticlockwise moment' }],
        points: [{ x: p.dL / 100, y: MLnow, color: C.a, dot: true }, { x: p.dR / 100, y: this.MR(), color: C.b, dot: true }],
        notes: [{ text: 'Balance where the right line meets the dashed line', color: C.ink }], notesRight: true });
      return;
    }
    const rows = (App.rows[this.id] || []).filter(r => r.bal === 'yes');
    const pts = rows.map(r => ({ x: 1 / r.dR, y: r.WR }));
    const fit = pts.length >= 2 ? fitOrigin(pts) : null;
    const o = { xLabel: '1 ÷ right distance (1/m)', yLabel: 'Right weight at balance (N)', xMax: 20, yMax: 10, points: pts.map(q => ({ x: q.x, y: q.y, color: C.b })), lines: [], notes: [] };
    if (fit) { o.lines.push({ x1: 0, y1: 0, x2: 20, y2: fit.k * 20, color: C.b, width: 2.5 }); o.notes.push({ text: `gradient = ${fx(fit.k, 2)} N m = the anticlockwise moment`, color: C.b }); }
    else o.message = 'Balance the beam several ways (same left side) and record each one';
    plot(cv, o);
  },

  readouts() {
    const ML = this.ML(), MR = this.MR();
    return { cols: [{ name: '' }], rows: [
      { label: 'Anticlockwise moment (left)', unit: 'N m', vals: [fx(ML, 2)] },
      { label: 'Clockwise moment (right)', unit: 'N m', vals: [fx(MR, 2)] },
      { label: 'Difference', unit: 'N m', vals: [fx(Math.abs(MR - ML), 2)] },
      { label: 'Balanced?', unit: '', vals: [Math.abs(MR - ML) < 1e-9 ? 'yes' : 'no'] },
      { label: 'Beam angle', unit: '°', vals: [fx(Math.abs(this.s.th), 1)] },
    ] };
  },

  record() {
    const p = this.p, ML = this.ML(), MR = this.MR();
    return [{ WL: p.WL, dL: p.dL / 100, ML, WR: p.WR, dR: p.dR / 100, MR, bal: Math.abs(MR - ML) < 1e-9 ? 'yes' : 'no' }];
  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 21: PRESSURE IN FLUIDS  (p = h ρ g)
   --------------------------------------------------------------------- */
// rho = density in kg/m³
const LIQUIDS = {
  water: { label: 'Water', rho: 1000, color: 'rgba(70,150,230,0.5)' },
  sea: { label: 'Sea water', rho: 1030, color: 'rgba(40,140,170,0.5)' },
  oil: { label: 'Cooking oil', rho: 920, color: 'rgba(230,190,60,0.55)' },
  alcohol: { label: 'Alcohol (ethanol)', rho: 790, color: 'rgba(200,200,230,0.5)' },
  glycerol: { label: 'Glycerol', rho: 1260, color: 'rgba(180,220,200,0.55)' },
  mercury: { label: 'Mercury', rho: 13600, color: 'rgba(160,165,175,0.75)' },
};
const ATMOSPHERE = 101000;   // Pa: pressure of the air at sea level (Realistic mode adds this)

Object.assign(Physics, {
  liquidPressure(h, rho) { return h * rho * SETTINGS.g; },    // p = h ρ g
});

register({
  id: 'pressure',
  topic: 'Forces',
  title: 'Pressure in liquids',
  equationShort: 'p = h ρ g',
  status: 'ready',
  rp: 'Not a required practical (pressure in a fluid, Physics only)',
  rpType: 'none',

  // DEFAULTS (heights in m)
  defaults: { liq: 'water', liqB: 'oil', H: 0.8, depth: 0.5, realistic: false, compare: false },

  // CONTROLS
  controls: [
    { type: 'select', key: 'liq', label: e => e.p.compare ? 'Liquid A' : 'Liquid', options: Object.keys(LIQUIDS).map(k => [k, `${LIQUIDS[k].label} (${LIQUIDS[k].rho} kg/m³)`]) },
    { type: 'select', key: 'liqB', label: 'Liquid B', options: Object.keys(LIQUIDS).map(k => [k, `${LIQUIDS[k].label} (${LIQUIDS[k].rho} kg/m³)`]), showIf: e => e.p.compare },
    { type: 'slider', key: 'H', label: 'Height of the liquid', unit: 'm', min: 0.2, max: 1, step: 0.05, dp: 2 },
    { type: 'slider', key: 'depth', label: 'Depth of the pressure sensor h', unit: 'm', min: 0, max: 1, step: 0.01, dp: 2 },
  ],
  runLabels: ['▶ Open the holes', '⏸ Close the holes'],

  ideal: {
    idealLabel: 'Ideal: liquid only',
    realLabel: 'Realistic: add the atmosphere',
    note: e => e.p.realistic
      ? '<b>Realistic:</b> the air above the liquid also pushes down, adding about 101 000 Pa at every depth. Many pressure gauges show only the extra pressure from the liquid.'
      : '<b>Ideal:</b> only the pressure caused by the liquid, p = h ρ g.',
  },
  compare: { note: '<b>Compare:</b> two different liquids at the same depth.' },

  overlays: [
    { key: 'arrows', label: 'Pressure arrows', on: true },
    { key: 'values', label: 'Values', on: true },
    { key: 'eq', label: 'Equation', on: true },
  ],
  graphs: [
    { id: 'ph', label: 'Pressure–depth' },
    { id: 'shape', label: 'Pressure in each container' },
  ],

  keyIdea: 'The pressure in a liquid depends only on the depth and the density of the liquid: p = h ρ g. It is the same in every direction at a given depth, and it does not depend on the shape or width of the container.',
  mistake: '“A wide container has more pressure at the bottom, because there is more water.” No: at the same depth in the same liquid, the pressure is the same in every container. Only the depth below the surface and the density matter.',
  assumptions: [
    'The liquid is still, and its density is the same all the way down. g = 9.8 N/kg.',
    'All four containers are filled to the same height, and the sensor is at the same depth in each.',
    'Water jets: the speed of each jet depends on the pressure at its hole, so deeper holes squirt further. Air resistance is ignored.',
    'Drag the pressure sensor up and down.',
  ],
  equations: [
    { sym: 'p = h ρ g', words: 'pressure due to a column of liquid = height of the column × density of the liquid × gravitational field strength', units: 'p in pascals (Pa) · h in m · ρ in kg/m³ · g in N/kg' },
    { sym: 'p = F ⁄ A', words: 'pressure = force normal to a surface ÷ area of that surface', units: 'p in Pa · F in N · A in m²' },
  ],
  predict: [
    { q: 'Four containers of different shapes hold water to the same height. Where is the pressure at the bottom biggest?',
      a: 'It is the same in all of them. Pressure depends only on depth and density, not on the shape or how much liquid there is.',
      setup: p => Object.assign(p, { compare: false, liq: 'water', H: 0.8, depth: 0.8 }) },
    { q: 'We double the depth of the sensor. What happens to the pressure?',
      a: 'It doubles. p = h ρ g, so pressure is directly proportional to depth.',
      setup: p => Object.assign(p, { compare: false, liq: 'water', H: 0.8, depth: 0.3 }) },
    { q: 'At the same depth, is the pressure bigger in water or in oil?',
      a: 'In water, because it is denser than oil (1000 kg/m³ compared with 920 kg/m³).',
      setup: p => Object.assign(p, { compare: true, liq: 'water', liqB: 'oil', H: 0.8, depth: 0.5 }) },
    { q: 'Holes are made at three heights in the side of the tank. Which jet squirts furthest?',
      a: 'The lowest one. The pressure is biggest at the bottom, so the water comes out fastest there.',
      setup: p => Object.assign(p, { compare: false, liq: 'water', H: 0.9, depth: 0.5 }) },
  ],

  table: {
    columns: [
      { key: 'liq', label: 'Liquid' },
      { key: 'rho', label: 'Density ρ', unit: 'kg/m³', fmt: v => fx(v, 0) },
      { key: 'h', label: 'Depth h', unit: 'm', fmt: v => fx(v, 2) },
      { key: 'p', label: 'Pressure p = h ρ g', unit: 'Pa', fmt: v => sf(v, 3) },
      { key: 'kPa', label: 'Pressure', unit: 'kPa', fmt: v => fx(v, 2) },
    ],
    hint: 'Measure depth from the surface of the liquid, in metres. Give pressure in Pa to 3 significant figures (1 kPa = 1000 Pa).',
  },

  // ---- simulation ----
  lanes() { return this.p.compare ? ['A', 'B'] : ['A']; },
  liqOf(k) { return LIQUIDS[k === 'B' ? this.p.liqB : this.p.liq]; },
  h() { return Math.min(this.p.depth, this.p.H); },                 // the sensor cannot be deeper than the liquid
  pressure(k, h) { return Physics.liquidPressure(h === undefined ? this.h() : h, this.liqOf(k).rho) + (this.p.realistic ? ATMOSPHERE : 0); },
  onParam(key) { if (key === 'H' && this.p.depth > this.p.H) setParam(this, 'depth', this.p.H); },
  reset() { this.s = { t: 0 }; },
  step(dt) { this.s.t += dt; },
  finished() { return false; },
  clock() { return ''; },

  drawDiagram(ctx, w, h, C) {
    const lanes = this.lanes(), lh = h / lanes.length, fs = App.fs, ov = this.ov, p = this.p;
    lanes.forEach((k, i) => {
      const y0 = i * lh, liq = this.liqOf(k), baseY = y0 + lh - fs * 1.4, tankH = lh - fs * 3.6, ppm = tankH / 1.0;
      const surfY = baseY - p.H * ppm, sensorY = surfY + this.h() * ppm;
      if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, 0, y0, w, y0); }
      ctx.fillStyle = C.ground; ctx.fillRect(0, baseY, w, y0 + lh - baseY);
      label(ctx, `${lanes.length > 1 ? k + ': ' : ''}${liq.label}, ρ = ${liq.rho} kg/m³`, fs * 0.4, y0 + fs * 0.9, k === 'A' ? C.a : C.b, { align: 'left', weight: 800, fs: fs * 0.9 });
      // four containers: [centre x, half-width at the bottom, half-width at the top]
      const slot = w / 4.6, cont = [[slot * 0.75, slot * 0.38, slot * 0.38], [slot * 1.75, slot * 0.1, slot * 0.1], [slot * 2.75, slot * 0.12, slot * 0.42], [slot * 3.75, slot * 0.42, slot * 0.12]];
      const names = ['wide', 'narrow', 'funnel', 'vase'];
      cont.forEach(([cx, hb, ht], j) => {
        const yTop = baseY - tankH, at = y => hb + (ht - hb) * (baseY - y) / tankH;    // half-width at height y
        ctx.fillStyle = liq.color;
        ctx.beginPath(); ctx.moveTo(cx - at(surfY), surfY); ctx.lineTo(cx + at(surfY), surfY); ctx.lineTo(cx + hb, baseY); ctx.lineTo(cx - hb, baseY); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(cx - ht, yTop); ctx.lineTo(cx - hb, baseY); ctx.lineTo(cx + hb, baseY); ctx.lineTo(cx + ht, yTop); ctx.stroke();
        label(ctx, names[j], cx, baseY + fs * 0.7, C.ink, { fs: fs * 0.8, bg: false });
        // pressure sensor at the same depth in each
        const sy = sensorY, half = at(sy);
        ctx.fillStyle = C.force; ctx.beginPath(); ctx.arc(cx, sy, fs * 0.35, 0, Math.PI * 2); ctx.fill();
        if (ov.arrows) {
          const L = clamp(Physics.liquidPressure(this.h(), liq.rho) / 13000 * fs * 2.5, fs * 0.3, Math.min(half - fs * 0.4, fs * 3));
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) arrow(ctx, cx + dx * (fs * 0.4 + L), sy + dy * (fs * 0.4 + L), cx + dx * fs * 0.4, sy + dy * fs * 0.4, C.force, { width: 2 });
        }
        if (ov.values) label(ctx, `${sf(this.pressure(k), 3)} Pa`, cx, sy - fs * 1.4 - (ov.arrows ? fs * 0.6 : 0), C.ink, { fs: fs * 0.78, weight: 800 });
      });
      // depth marker and the draggable sensor (on the first container)
      ctx.strokeStyle = C.acc; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); line(ctx, fs * 0.3, surfY, w - fs * 0.3, surfY); line(ctx, fs * 0.3, sensorY, w - fs * 0.3, sensorY); ctx.setLineDash([]);
      label(ctx, `h = ${fx(this.h(), 2)} m`, w - fs * 0.4, (surfY + sensorY) / 2, C.acc, { align: 'right', fs: fs * 0.85, weight: 800 });
      addHandle(ctx, { id: 'sensor' + k, x: cont[0][0], y: sensorY, r: fs * 1.1, cursor: 'ns-resize', onDrag: (x, y) => setParam(this, 'depth', clamp((y - surfY) / ppm, 0, p.H)) });
      // water jets from holes in the wide tank (when the holes are open)
      if (App.running) {
        const [cx, hb] = cont[0];
        for (const frac of [0.25, 0.55, 0.85]) {
          const depth = p.H * frac, hy = surfY + depth * ppm, v = Math.sqrt(2 * SETTINGS.g * depth), drop = baseY - hy;
          ctx.strokeStyle = liq.color.replace(/[\d.]+\)$/, '0.9)'); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - hb, hy);
          for (let q = 1; q <= 20; q++) { const t = q / 20 * Math.sqrt(2 * drop / ppm / SETTINGS.g); const x = cx - hb - v * t * ppm * 0.6, y = hy + 0.5 * SETTINGS.g * t * t * ppm; if (y > baseY) break; ctx.lineTo(x, y); }
          ctx.stroke();
        }
      }
      if (ov.eq) label(ctx, `p = h ρ g = ${fx(this.h(), 2)} × ${liq.rho} × ${SETTINGS.g} = ${sf(Physics.liquidPressure(this.h(), liq.rho), 3)} Pa${p.realistic ? ` (+ ${ATMOSPHERE} Pa air)` : ''}`, w / 2, y0 + fs * 2.2, C.ink, { fs: fs * 0.85 });
    });
  },

  drawGraph(cv, id, C) {
    const lanes = this.lanes(), rows = App.rows[this.id] || [], p = this.p;
    if (id === 'ph') {
      const top = Math.max(...lanes.map(k => this.pressure(k, 1)));
      const o = { xLabel: 'Depth h (m)', yLabel: 'Pressure p (Pa)', xMax: 1, yMin: 0, yMax: niceCeil(top * 1.05), series: [], points: [], notes: [] };
      for (const k of lanes) {
        const liq = this.liqOf(k), col = k === 'A' ? C.a : C.b;
        o.series.push({ pts: [[0, this.pressure(k, 0)], [1, this.pressure(k, 1)]], color: col, width: 3, label: liq.label });
        for (const r of rows.filter(r => r.liq === liq.label)) o.points.push({ x: r.h, y: r.p, color: col });
        o.points.push({ x: this.h(), y: this.pressure(k), color: col, dot: true });
        o.notes.push({ text: `${liq.label}: gradient = ρ g = ${sf(liq.rho * SETTINGS.g, 3)} Pa per m`, color: col });
      }
      o.notes.push({ text: p.realistic ? 'Straight line, starting at atmospheric pressure' : 'Straight line through the origin: p ∝ h', color: C.muted });
      plot(cv, o);
      return;
    }
    const bars = [];
    lanes.forEach((k, li) => [0, 1, 2, 3].forEach(j => bars.push({ x: j + 1 + (lanes.length > 1 ? (li - 0.5) * 0.4 : 0), y: this.pressure(k), width: lanes.length > 1 ? 0.36 : 0.6, color: k === 'A' ? C.a : C.b, label: sf(this.pressure(k), 3) })));
    plot(cv, { xLabel: `Container (sensor ${fx(this.h(), 2)} m deep)`, yLabel: 'Pressure (Pa)', xMin: 0.4, xMax: 4.6, yMax: niceCeil(Math.max(1, ...bars.map(b => b.y)) * 1.25), bars,
      xTicks: [[1, 'wide'], [2, 'narrow'], [3, 'funnel'], [4, 'vase']], notes: [{ text: 'Same depth → same pressure, whatever the shape', color: C.ink }] });
  },

  readouts() {
    const lanes = this.lanes();
    return {
      cols: lanes.length > 1 ? [{ name: 'A', cls: 'A' }, { name: 'B', cls: 'B' }] : [{ name: '' }],
      rows: [
        { label: 'Depth h', unit: 'm', vals: [fx(this.h(), 2)] },
        { label: 'Density ρ', unit: 'kg/m³', vals: lanes.map(k => String(this.liqOf(k).rho)) },
        { label: 'Pressure p = h ρ g', unit: 'Pa', vals: lanes.map(k => sf(Physics.liquidPressure(this.h(), this.liqOf(k).rho), 3)) },
        { label: this.p.realistic ? 'Total with the atmosphere' : 'Pressure', unit: 'kPa', vals: lanes.map(k => fx(this.pressure(k) / 1000, 2)) },
      ],
    };
  },

  record() {
    return this.lanes().map(k => { const liq = this.liqOf(k), pr = this.pressure(k); return { liq: liq.label, rho: liq.rho, h: this.h(), p: pr, kPa: pr / 1000 }; });
  },
});

   Everything below runs the screens. You should not need to change it

const App = {
  exps: EXPERIMENTS, // all registered experiments, in home-screen order
  cur: null,         // the experiment on screen
  running: false,
  speed: 1,          // time speed (slow motion < 1)
  fs: 16,            // base font size in px (for canvas text)
  handles: [],       // draggable things drawn this frame
  drag: null,        // the handle being dragged
  hoverId: null,
  rows: {},          // results table rows for each experiment
  graphId: null,
  predictIdx: 0,
  last: 0,
  lastReadout: 0,
};

// Remember theme and text size between visits (ignored if the browser blocks storage).
function store(key, val) {
  try {
    if (val === undefined) return localStorage.getItem('physicsDemos.' + key);
    localStorage.setItem('physicsDemos.' + key, val);
  } catch (err) { return null; }
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// Set a slider value from code (e.g. when dragging an arrow), keeping it in range.
function setParam(e, key, v) {
  const c = e.controls.find(c => c.key === key);
  if (c && c.type === 'slider') v = +clamp(c.min + Math.round((v - c.min) / c.step) * c.step, c.min, c.max).toFixed(6);
  e.p[key] = v;
  syncControls();
}

function toolsHTML() {
  const dark = document.documentElement.dataset.theme === 'dark';
  return `<button class="btn" data-act="theme" title="Switch light / dark background" aria-label="Switch light / dark background">${themeLabel(dark)}</button>
    <button class="btn" data-act="smaller" title="Smaller text" aria-label="Smaller text">A−</button>
    <button class="btn" data-act="bigger" title="Bigger text" aria-label="Bigger text">A+</button>
    <button class="btn" data-act="fullscreen" title="Full screen" aria-label="Full screen">⛶<span class="lbl"> Full screen</span></button>`;
}
// .lbl text is hidden on laptop-width screens to keep the header on one line
const themeLabel = dark => dark ? '☀<span class="lbl"> Light</span>' : '☾<span class="lbl"> Dark</span>';
function badgeHTML(e) {
  return `<span class="badge ${e.rpType === 'model' ? 'model' : e.rpType === 'none' ? 'none' : ''}">${esc(e.rp)}</span>`;
}
function equationsHTML(e) {
  return `<div class="eqlist">${e.equations.map(q => `<div class="eq"><div class="eq-sym">${esc(q.sym)}</div><div class="eq-words">${esc(q.words)}</div><div class="eq-units">${esc(q.units)}</div></div>`).join('')}</div>`;
}
// The equations shown under the graph: symbols only (the words and units are in the Variables panel).
// An experiment can set eqBar: ['...', ...] when its "equations" are statements rather than formulas.
function eqBarHTML(e) {
  return (e.eqBar || e.equations.map(q => q.sym)).map(s => `<span class="eq-sym">${esc(s)}</span>`).join('');
}

function buildControls() {
  const e = App.cur, box = $('#controls');
  box.innerHTML = '';
  for (const c of e.controls) {
    if (c.showIf && !c.showIf(e)) continue;
    const lab = typeof c.label === 'function' ? c.label(e) : c.label;
    const div = document.createElement('div');
    div.className = 'ctl';
    if (c.type === 'slider') {
      div.innerHTML = `<div class="ctl-head"><label for="sl-${c.key}">${esc(lab)}</label><output id="out-${c.key}"></output></div>
        <div class="sl-row"><button class="btn pm" data-d="-1" aria-label="Decrease">−</button>
          <input type="range" id="sl-${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" title="${c.min} to ${c.max} ${esc(c.unit)}">
          <button class="btn pm" data-d="1" aria-label="Increase">+</button></div>`;
      const inp = div.querySelector('input');
      inp.addEventListener('input', () => { setParam(e, c.key, +inp.value); paramChanged(c); });
      div.querySelectorAll('.pm').forEach(b => b.addEventListener('click', () => { setParam(e, c.key, e.p[c.key] + c.step * +b.dataset.d); paramChanged(c); }));
    } else if (c.type === 'select') {
      div.innerHTML = `<div class="ctl-head"><label for="se-${c.key}">${esc(lab)}</label></div>
        <select id="se-${c.key}">${c.options.map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join('')}</select>`;
      const sel = div.querySelector('select');
      sel.value = e.p[c.key];
      // rebuild afterwards: other controls may appear or disappear with this choice
      sel.addEventListener('change', () => { e.p[c.key] = sel.value; paramChanged(c); buildControls(); });
    } else if (c.type === 'button') {
      div.innerHTML = `<button class="btn">${esc(lab)}</button>`;
      div.querySelector('button').addEventListener('click', () => { c.onClick(e); paramChanged(c); buildControls(); });
    } else if (c.type === 'buttons') {
      if (c.items.length > 3) div.classList.add('wide');   // a long row of buttons gets the full width
      div.innerHTML = `<div class="ctl-head"><label>${esc(lab)}</label></div><div class="btnrow"></div>`;
      for (const it of c.items) {
        const b = document.createElement('button');
        b.className = 'btn'; b.textContent = it.label;
        b.addEventListener('click', () => { it.onClick(e); paramChanged(c); buildControls(); });
        div.querySelector('.btnrow').appendChild(b);
      }
    }
    box.appendChild(div);
  }
  syncControls();
}
// Make sliders and drop-downs show the current values.
function syncControls() {
  const e = App.cur;
  if (!e || !$('#controls')) return;
  for (const c of e.controls) {
    if (c.type === 'slider') {
      const inp = $('#sl-' + c.key), out = $('#out-' + c.key);
      if (!inp) continue;
      if (+inp.value !== e.p[c.key]) inp.value = e.p[c.key];
      out.textContent = `${fx(e.p[c.key], c.dp)} ${c.unit}`;
    } else if (c.type === 'select') {
      const sel = $('#se-' + c.key);
      if (sel) sel.value = e.p[c.key];
    }
  }
}
function paramChanged(c) {
  if (c.reset) resetExp();
  if (App.cur.onParam) App.cur.onParam(c.key);   // optional: an experiment can react to a change
  updateReadouts();
}

function buildOverlays() {
  const e = App.cur;
  $('#overlays').innerHTML = '<span class="lbl">Show:</span>' + e.overlays.map(o =>
    `<button class="btn" data-ov="${o.key}" aria-pressed="${e.ov[o.key]}">${esc(o.label)}</button>`).join('');
}
function updateModes() {
  const e = App.cur, p = e.p;
  const cmp = $('[data-act="compare"]');
  if (cmp) cmp.setAttribute('aria-pressed', String(!!p.compare));
  if (e.ideal) {
    const off = p.compare && e.compare && e.compare.disablesIdeal;
    $('[data-act="ideal"]').classList.toggle('on', !p.realistic && !off);
    $('[data-act="real"]').classList.toggle('on', !!p.realistic && !off);
    $('[data-act="ideal"]').disabled = off; $('[data-act="real"]').disabled = off;
  }
  const notes = [];
  if (e.ideal) { const n = e.ideal.note(e); if (n) notes.push(n); }
  if (p.compare && e.compare) notes.push(e.compare.note);
  $('#modeNote').innerHTML = notes.join(' ');
  $('#diagramWrap').classList.toggle('tall', !!p.compare);
}
function updateGraphTabs() {
  document.querySelectorAll('[data-graph]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.graph === App.graphId)));
}
function updateRunButton() {
  const b = $('#runBtn');
  if (!b) return;
  const L = App.cur.runLabels;   // an experiment can name its run button, e.g. "Switch on"
  if (L) b.textContent = App.running ? L[1] : L[0];
  else b.textContent = App.running ? '⏸ Pause' : (App.cur.s.t > 0 && !App.cur.finished() ? '▶ Resume' : '▶ Start');
}
function updateReadouts() {
  const e = App.cur;
  if (!e || !$('#readouts')) return;
  const r = e.readouts();
  // with two values (A and B) they sit side by side to keep the tiles short
  $('#readouts').innerHTML = r.rows.map(row => `<div class="ro"><div class="ro-label">${esc(row.label)}${row.unit ? ` (${esc(row.unit)})` : ''}</div>${row.vals.length > 1 ? '<div class="ro-vals">' : ''}${
    row.vals.map((v, i) => {
      const c = r.cols[i], tint = c.css ? ` style="color:var(--${c.css})"` : '';   // css = a colour name such as 'vel'
      return `<div class="ro-val">${row.vals.length > 1 && c.name ? `<span class="who ${c.cls || ''}"${tint}>${esc(c.name)}</span>` : ''}${esc(v)}</div>`;
    }).join('')}${row.vals.length > 1 ? '</div>' : ''}</div>`).join('');
  // an experiment can show its own clock text (e.g. "time = 3 half-lives")
  $('#clock').textContent = e.clock ? e.clock() : `t = ${fx(e.s.t, 2)} s`;
}
// How far one press of Step moves time on (an experiment can set its own stepSize).
function stepOnce() {
  const e = App.cur;
  App.running = false;
  if (!e.finished()) advance(e.stepSize || SETTINGS.stepSize);
  updateRunButton(); updateReadouts();
}

function setRunning(on) {
  const e = App.cur;
  if (on && e.finished()) e.reset();
  if (on && e.beforeRun) e.beforeRun();
  App.running = on;
  updateRunButton();
}
function resetExp() {
  App.running = false;
  App.cur.reset();
  updateRunButton(); updateReadouts();
  if (App.cur.controls.some(c => c.type === 'button')) buildControls();
}
// Move the simulation on in small pieces so it stays accurate.
function advance(dt) {
  const e = App.cur, n = Math.max(1, Math.ceil(dt / 0.01));
  for (let i = 0; i < n; i++) e.step(dt / n);
}

/* ---------- results table ---------- */
function tableHeader(c) { return c.unit ? `${c.label} (${c.unit})` : c.label; }
function tableCell(c, row) { return c.fmt ? c.fmt(row[c.key]) : String(row[c.key]); }
function renderTable() {
  const e = App.cur, rows = App.rows[e.id], cols = e.table.columns;
  $('#results').innerHTML = `<thead><tr><th>#</th>${cols.map(c => `<th>${esc(tableHeader(c))}</th>`).join('')}</tr></thead><tbody>${
    rows.length ? rows.map((r, i) => `<tr><td>${i + 1}</td>${cols.map(c => `<td>${esc(tableCell(c, r))}</td>`).join('')}</tr>`).join('')
                : `<tr><td colspan="${cols.length + 1}" style="text-align:center">No readings yet. Set up the experiment and press “Record reading”.</td></tr>`}</tbody>`;
  const n = rows.length;
  $('#recCount').textContent = n ? `${n} reading${n > 1 ? 's' : ''} in the Data table` : 'No readings yet';
}
function tableText(sep) {
  const e = App.cur, cols = e.table.columns, rows = App.rows[e.id];
  const q = s => sep === ',' && /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  const plain = s => s.replace(/−/g, '-');
  return [cols.map(c => q(tableHeader(c))).join(sep)]
    .concat(rows.map(r => cols.map(c => q(plain(tableCell(c, r)))).join(sep))).join('\r\n');
}
function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove(); return ok;
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('Table copied: paste it into Excel or Word'),
      () => toast(fallback() ? 'Table copied' : 'Copy failed: use Download CSV instead'));
  } else toast(fallback() ? 'Table copied: paste it into Excel or Word' : 'Copy failed: use Download CSV instead');
}
function downloadCSV() {
  const e = App.cur;
  // ﻿ at the start lets Excel read the ² and Ω symbols correctly
  const blob = new Blob(['﻿' + tableText(',')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `${e.id}-results.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- printable worksheet ----------
   "Print worksheet" opens a selection screen. The core sections are always
   printed; the add-ons can be ticked. The text for each experiment is in
   section 3b (WORKSHEETS). Sections are packed onto real A4 pages here, so
   the preview matches the printout and every page has a numbered footer. */
const WS_CORE = ['Title, topic and AQA reference', 'Name, class and date boxes', 'Aim', 'Method (numbered steps)',
  'Variables table with suggested units', 'Equation with blanks, and its symbols', 'Assumptions', 'Results table (blank rows)', 'Graph area (blank axes)'];
const WS_ADDONS = [
  { id: 'predict', label: 'Predict', note: 'A question to answer before the experiment' },
  { id: 'graphQs', label: 'Graph-reading questions', note: 'Gradient, intercept or area' },
  { id: 'worked', label: 'Worked example', note: 'Steps shown, one step left for students' },
  { id: 'key', label: 'Key idea box', note: 'The main idea in one paragraph' },
  { id: 'mistake', label: 'Common mistake question', note: '“Which of these statements is true?”' },
  { id: 'evaluation', label: 'Evaluation', note: 'Uncertainty, anomalous results and improvements' },
];
App.wsSel = { predict: true, evaluation: true };   // ticked when the selection screen first opens
App.wsKey = false;                                  // preview the answer key instead of the worksheet
const MM = 96 / 25.4;                               // CSS pixels in one millimetre
const WS_BODY_H = 297 - 12 - 18;                    // mm of each A4 page used for sections (top and footer margins)
const WS_GAP = 4.5;                                 // mm between sections

// '___' in worksheet text becomes a gap to write in.
const blanks = s => esc(s).replace(/_{3,}/g, '<span class="blank"></span>');
function rpLine(e) {
  if (e.rpType !== 'rp') return esc(e.rp);
  return `Required practical activity: <span class="ws-ph">RP [number to confirm against AQA specification]</span> · ${esc(e.rp.replace(/^Required practical \d+:\s*/, ''))}`;
}

// Blank graph paper: 2 mm squares with a bold line every 10 mm, labelled axes.
// g.origin: 'corner' (default), 'centre' (four quadrants) or 'left' (x-axis halfway up, for negative y).
function wsGraphSVG(g) {
  const pw = 160, ph = g.h || 84, x0 = 17, y0 = 3, x1 = x0 + pw, y1 = y0 + ph, W = 182, H = ph + 17;
  const ox = g.origin === 'centre' ? x0 + pw / 2 : x0, oy = g.origin === 'centre' || g.origin === 'left' ? y0 + ph / 2 : y1;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}mm" height="${H}mm" font-family="Arial, Helvetica, sans-serif">`;
  for (let i = 0; i <= pw / 2; i++) { const x = x0 + i * 2, major = i % 5 === 0;
    s += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="${major ? '#808080' : '#c4c4c4'}" stroke-width="${major ? 0.25 : 0.12}"/>`; }
  for (let i = 0; i <= ph / 2; i++) { const y = y0 + i * 2, major = i % 5 === 0;
    s += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${major ? '#808080' : '#c4c4c4'}" stroke-width="${major ? 0.25 : 0.12}"/>`; }
  const ax = (xa, ya, xb, yb) => s += `<line x1="${xa}" y1="${ya}" x2="${xb}" y2="${yb}" stroke="#000" stroke-width="0.55"/>`;
  ax(g.origin === 'centre' ? x0 : ox, oy, x1 + 2, oy); ax(ox, y1, ox, y0 - 1);
  s += `<path d="M${x1 + 3.5} ${oy} l-3 -1.4 v2.8 z M${ox} ${y0 - 2.5} l-1.4 3 h2.8 z" fill="#000"/>`;
  if (!g.noZero) s += `<text x="${ox - 1.5}" y="${oy + 4}" font-size="3.6" text-anchor="end">0</text>`;
  s += `<text x="${x0 + pw / 2}" y="${H - 2.5}" font-size="4" font-weight="700" text-anchor="middle">${esc(g.x)}</text>`;
  s += `<text transform="translate(5 ${y0 + ph / 2}) rotate(-90)" font-size="4" font-weight="700" text-anchor="middle">${esc(g.y)}</text>`;
  return s + '</svg>';
}

// The worksheet (key = false) or the answer key (key = true) as a list of sections.
// The answer key only has sections with something to answer, matching the ticked add-ons.
function wsSections(e, sel, key) {
  const w = WORKSHEETS[e.id], S = [];
  const sec = (title, body, cls = '') => S.push(`<section class="ws-sec ${cls}">${title ? `<h3>${esc(title)}</h3>` : ''}${body}</section>`);
  const lines = n => `<div class="ws-lines">${'<div></div>'.repeat(n)}</div>`;
  const ans = t => `<p class="ans">${esc(t)}</p>`;
  const qs = (list, body) => list.map((x, i) => `<div class="ws-q"><p><span class="qn">${i + 1}.</span> ${esc(x.q)}</p>${body(x)}</div>`).join('');

  sec('', `<div class="ws-kicker">GCSE Physics · AQA 8463 · Topic: ${esc(e.topic)}</div>
    <h1>${esc(e.title)}</h1><div class="ws-meta">${rpLine(e)}</div>${key
      ? '<div class="ws-keybanner">TEACHER ANSWER KEY · keep separate from student copies</div>'
      : '<div class="ws-boxes"><div>Name</div><div>Class</div><div>Date</div></div>'}`, 'ws-head');
  if (!key) sec('Aim', `<p>${esc(w.aim)}</p>`);
  if (sel.predict) sec('Predict (before you start)', key
    ? `<p>${esc(w.predict.q)}</p>${ans(w.predict.a)}`
    : `<p>${esc(w.predict.q)}</p><p><b>My prediction:</b></p>${lines(2)}<p style="margin-top:2mm"><b>Because:</b></p>${lines(2)}`);
  if (!key) sec('Method', `<ol>${w.method.map(m => `<li>${esc(m)}</li>`).join('')}</ol>`);
  if (!key) sec('Assumptions', `<ul>${w.assumptions.map(a => `<li>${esc(a)}</li>`).join('')}</ul>`);

  const v = w.variables, nc = v.control.length;
  const vrow = (type, [name, unit], span) => `<tr>${type !== null ? `<td class="row-h"${span ? ` rowspan="${span}"` : ''}>${type}</td>` : ''}<td class="${key ? 'ans' : ''}">${key ? esc(name) : ''}</td><td class="unit">${esc(unit)}</td></tr>`;
  sec('Variables', `${key ? '' : '<p>Write in the variables for this experiment. The suggested units are given.</p>'}
    <table class="ws-t"><thead><tr><th>Type</th><th>Variable</th><th>Suggested unit</th></tr></thead><tbody>
    ${vrow('Independent', v.independent)}${vrow('Dependent', v.dependent)}${v.control.map((c, i) => vrow(i ? null : 'Control', c, nc)).join('')}</tbody></table>`);

  const f = w.formula;
  const syms = f.symbols || [];   // no symbols: the "equation" is key facts in words (e.g. infrared)
  sec(syms.length ? 'Equation' : 'Key facts', `${key ? '' : `<p>${syms.length ? 'Complete the equations. Use the symbols in the table.' : 'Fill in the gaps.'}</p>`}${
    f.lines.map(([q, a]) => `<div class="ws-eqline">${key ? `<span class="ans">${esc(a)}</span>` : blanks(q)}</div>`).join('')}${syms.length ? `
    <table class="ws-t"><thead><tr><th>Symbol</th><th>Quantity</th><th>Unit</th></tr></thead><tbody>${
    syms.map(([s, q, u]) => `<tr><td style="text-align:center;font-weight:700;width:22mm">${esc(s)}</td><td>${esc(q)}</td><td>${esc(u)}</td></tr>`).join('')}</tbody></table>` : ''}`);

  if (key) sec('Results and graph: what to expect', ans(w.graph.expect));
  else {
    const cols = w.results.cols;
    sec('Results', `<table class="ws-t results"><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
      `<tr>${'<td></td>'.repeat(cols.length)}</tr>`.repeat(w.results.rows || 7)}</tbody></table>`);
    sec('Graph', `<p>${esc(w.graph.hint || 'Choose a scale for each axis, plot your results and draw a line of best fit.')}</p><div class="ws-graph">${wsGraphSVG(w.graph)}</div>`);
  }
  if (sel.graphQs) sec('Reading the graph', key ? qs(w.graphQs, x => ans(x.a)) : qs(w.graphQs, x => lines(x.lines || 2)));
  if (sel.worked) {
    const k = w.worked;
    sec('Worked example', `<p>${esc(k.q)}</p><ol>${k.steps.map(s => `<li>${esc(s)}</li>`).join('')}<li>${key
      ? `<span class="ans">${esc(k.answer)}</span>` : `${blanks(k.blank)}<b> ← your turn</b>`}</li></ol>`);
  }
  if (sel.key && !key) sec('Key idea', `<div class="ws-box"><p>${w.keyIdea ? esc(w.keyIdea) : e.keyIdea}</p></div>`);
  if (sel.mistake) {
    const m = w.mistakeQ, L = 'ABCD';
    sec('Check your understanding', key
      ? `<p class="ans">Correct answer: ${L[m.answer]}. ${esc(m.options[m.answer])}</p><p class="ans-note">${esc(m.why)}</p>`
      : `<p>${esc(m.q || 'Which of these statements is true? Tick one box.')}</p><ul class="ws-opts">${
        m.options.map((o, i) => `<li><span class="tick"></span><span><b>${L[i]}</b>  ${esc(o)}</span></li>`).join('')}</ul>`);
  }
  if (sel.evaluation) {
    const ev = w.evaluation, P = [
      { q: 'Uncertainty: which measurement was hardest to make precisely? How could it affect your results?', a: ev.uncertainty },
      { q: 'Anomalous results: how can you spot an anomalous result in your table or on your graph, and what should you do about it?', a: ev.anomalous },
      { q: 'Improvements: suggest one improvement to the method. Explain how it would make your results more accurate or more repeatable.', a: ev.improvement },
    ];
    sec('Evaluation', key ? qs(P, x => ans(x.a)) : qs(P, () => lines(3)));
  }
  return S;
}

// Pack the sections onto A4 pages (a section is never split) and add the footers.
function wsPages(e, sel, key) {
  const secs = wsSections(e, sel, key);
  let m = $('#wsMeasure');
  if (!m) { m = document.createElement('div'); m.id = 'wsMeasure'; document.body.appendChild(m); }
  m.innerHTML = `<div class="ws-page" style="height:auto">${secs.join('')}</div>`;
  const hs = [...m.firstChild.children].map(el => el.getBoundingClientRect().height / MM);
  m.innerHTML = '';
  const pages = [[]];
  let used = 0;
  secs.forEach((s, i) => {
    if (used > 0 && used + hs[i] > WS_BODY_H) { pages.push([]); used = 0; }
    pages[pages.length - 1].push(s);
    used += hs[i] + WS_GAP;
  });
  const doc = key ? 'Teacher answer key' : 'Student worksheet', n = pages.length;
  return pages.map((p, i) => `<div class="ws-page">${p.join('')}<div class="ws-foot"><span>GCSE Physics Demos · ${esc(e.title)} · ${doc}</span><span>Page ${i + 1} of ${n}</span></div></div>`);
}

/* ---------- dragging on the diagram ---------- */
function bindCanvas(cv) {
  const pos = ev => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
  const hit = (x, y) => {
    for (let i = App.handles.length - 1; i >= 0; i--) {
      const h = App.handles[i];
      if (Math.hypot(x - h.x, y - h.y) <= h.r) return h;
    }
    return null;
  };
  cv.addEventListener('pointerdown', ev => {
    const { x, y } = pos(ev), h = hit(x, y);
    if (!h) return;
    App.drag = h; cv.setPointerCapture(ev.pointerId);
    if (h.start) h.start(x, y);
    ev.preventDefault();
  });
  cv.addEventListener('pointermove', ev => {
    const { x, y } = pos(ev);
    if (App.drag) {
      // use this frame's version of the handle so positions are up to date
      const cur = App.handles.find(h => h.id === App.drag.id) || App.drag;
      if (cur.onDrag) cur.onDrag(x, y);
      updateReadouts();
    } else {
      const h = hit(x, y);
      App.hoverId = h ? h.id : null;
      cv.style.cursor = h ? (h.cursor || 'grab') : 'default';
    }
  });
  const end = () => {
    if (!App.drag) return;
    const h = App.handles.find(q => q.id === App.drag.id) || App.drag;
    if (h.end) h.end();
    App.drag = null; updateReadouts();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
}

/* ---------- buttons (one listener for the whole page) ---------- */
document.addEventListener('click', ev => {
  const open = ev.target.closest('[data-open]');
  if (open) { location.hash = open.dataset.open; return; }
  const ovb = ev.target.closest('[data-ov]');
  if (ovb && App.cur) {
    const k = ovb.dataset.ov; App.cur.ov[k] = !App.cur.ov[k];
    ovb.setAttribute('aria-pressed', String(App.cur.ov[k])); return;
  }
  const gb = ev.target.closest('[data-graph]');
  if (gb) { App.graphId = gb.dataset.graph; updateGraphTabs(); return; }
  const sb = ev.target.closest('[data-side]');
  if (sb && App.cur) { toggleSide(sb.dataset.side); return; }
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const e = App.cur;
  switch (b.dataset.act) {
    case 'home': location.hash = ''; break;
    case 'theme': {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      store('theme', dark ? 'dark' : 'light');
      b.innerHTML = themeLabel(dark);
      break;
    }
    case 'smaller': case 'bigger': {
      const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scale')) || 1;
      const next = clamp(+(cur + (b.dataset.act === 'bigger' ? 0.1 : -0.1)).toFixed(2), 0.8, 1.8);
      document.documentElement.style.setProperty('--scale', next);
      store('scale', next);
      break;
    }
    case 'fullscreen':
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => toast('Full screen is not available here'));
      break;
    case 'run': setRunning(!App.running); break;
    case 'step': stepOnce(); break;
    case 'reset': resetExp(); break;
    case 'predict': openPredict(); break;
    case 'worksheet': openWorksheet(); break;
    case 'compare': e.p.compare = !e.p.compare; resetExp(); buildControls(); updateModes(); break;
    case 'ideal': case 'real':
      e.p.realistic = b.dataset.act === 'real';
      if (e.ideal.resetOnChange) resetExp();
      buildControls(); updateModes(); updateReadouts();
      break;
    case 'record': {
      const out = e.record();
      if (typeof out === 'string') { toast(out); break; }   // e.g. "wait for the spring to settle"
      App.rows[e.id].push(...out);
      renderTable(); toast(`Recorded ${out.length} reading${out.length > 1 ? 's' : ''}`);
      break;
    }
    case 'undo': App.rows[e.id].pop(); renderTable(); break;
    case 'clear':
      if (App.rows[e.id].length && confirm('Clear all readings in this table?')) { App.rows[e.id] = []; renderTable(); }
      break;
    case 'copy': if (App.rows[e.id].length) copyText(tableText('\t')); else toast('Record some readings first'); break;
    case 'csv': if (App.rows[e.id].length) downloadCSV(); else toast('Record some readings first'); break;
  }
});

/* ---------- keyboard shortcuts ---------- */
document.addEventListener('keydown', ev => {
  if (!$('#modal').hidden) { if (ev.key === 'Escape') closeModal(); return; }
  const e = App.cur;
  if (!e || e.status !== 'ready' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const tag = ev.target.tagName;
  if (tag === 'SELECT' || (tag === 'INPUT' && ev.key !== ' ')) return;
  if (ev.key === ' ' && (tag === 'BUTTON' || tag === 'SELECT')) return;   // let Space press the focused button
  const k = ev.key.toLowerCase();
  if (k === ' ') { ev.preventDefault(); setRunning(!App.running); }
  else if (k === 's') stepOnce();
  else if (k === 'r') resetExp();
  else if (k === 'p') openPredict();
});

/* ---------- the animation loop ---------- */
function loop(ts) {
  const e = App.cur, cv = $('#diagram');
  if (e && e.status === 'ready' && cv) {
    const dt = Math.min(0.05, Math.max(0, (ts - (App.last || ts)) / 1000));
    if (App.running) {
      advance(dt * App.speed);
      // finished(): the run is over (Start begins again). settled(): optional, pause but keep the state.
      if (e.finished() || (e.settled && e.settled())) { App.running = false; updateRunButton(); updateReadouts(); }
    }
    App.fs = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    const C = colors(), d = prep(cv);
    App.handles = [];
    e.drawDiagram(d.ctx, d.w, d.h, C);
    e.drawGraph($('#graph'), App.graphId, C);
    if (ts - App.lastReadout > 100) { App.lastReadout = ts; updateReadouts(); }
  }
  App.last = ts;
  requestAnimationFrame(loop);
}

/* ---------- start-up ---------- */
function route() {
  closeModal();
  const id = location.hash.replace('#', '');
  if (id === 'selftest') runSelfTest();
  else if (id) openExp(id);
  else renderHome();
}
(function start() {
  const theme = store('theme'), scale = store('scale');
  if (theme) document.documentElement.dataset.theme = theme;
  if (scale) document.documentElement.style.setProperty('--scale', scale);
  window.addEventListener('hashchange', route);
  route();
  requestAnimationFrame(loop);
})();

/* =====================================================================
   5. SELF-TEST
   Open the file with #selftest on the end of the address, e.g.
   physics-demos.html#selftest, to check the physics against the equations.
   ===================================================================== */
function runSelfTest() {
  App.cur = null;
  const lines = [];
  let pass = 0, fail = 0;
  const check = (name, got, want, tol, unit) => {
    const ok = Math.abs(got - want) <= tol;
    if (ok) pass++; else fail++;
    lines.push(`${ok ? 'PASS' : 'FAIL'}  ${name}: sim ${got.toFixed(4)} ${unit}, expected ${want.toFixed(4)} ${unit}`);
  };
  const g = SETTINGS.g;

  lines.push('--- Experiment 1: F = m a (Ideal, no friction): a = F / m ---');
  for (const [F, m] of [[4, 1], [4, 2], [8, 1], [10, 2.5], [20, 5], [1, 0.5], [7.5, 1.5]]) {
    check(`F = ${F} N, m = ${m} kg`, Physics.measureAcceleration(F, m, 0), F / m, 1e-9, 'm/s²');
  }
  lines.push('--- Experiment 1 with friction: a = (F − friction) / m, or 0 if F ≤ friction ---');
  for (const [F, fr, m] of [[5, 1, 2], [6, 1.5, 1.5], [1, 1.5, 1], [1.5, 1.5, 1], [20, 5, 5]]) {
    check(`F = ${F} N, friction = ${fr} N, m = ${m} kg`, Physics.measureAcceleration(F, m, fr), F > fr ? (F - fr) / m : 0, 1e-9, 'm/s²');
  }
  lines.push('--- Experiment 1: zero resultant force means constant velocity ---');
  {
    let x = 0, v = 3;
    for (let i = 0; i < 500; i++) ({ x, v } = Physics.trolleyStep(x, v, 0.01, 0, 1, 0));
    check('Ideal, force removed at 3 m/s: velocity after 5 s', v, 3, 1e-12, 'm/s');
    check('Ideal, force removed at 3 m/s: distance in 5 s (s = v t)', x, 15, 1e-9, 'm');
    x = 0; v = 2;
    for (let i = 0; i < 300; i++) ({ x, v } = Physics.trolleyStep(x, v, 0.01, 1.5, 1, 1.5));
    check('Realistic, applied force = friction at 2 m/s: velocity after 3 s', v, 2, 1e-12, 'm/s');
    x = 0; v = 2;
    for (let i = 0; i < 500; i++) ({ x, v } = Physics.trolleyStep(x, v, 0.01, 0, 1, 1));
    check('Friction 1 N alone stops a 1 kg trolley from 2 m/s: final velocity', v, 0, 1e-12, 'm/s');
    check('...stopping distance (v² = 2 a s gives 2 m)', x, 2, 1e-9, 'm');
  }
  lines.push('--- Experiment 2: vacuum, t = √(2h / g) and v = √(2 g h), same for every mass ---');
  for (const h of [5, 20, 45, 100]) {
    for (const m of [0.1, 5]) {
      const r = Physics.simulateFall(h, m, SHAPES.largeBall, false);
      check(`h = ${h} m, m = ${m} kg: fall time`, r.t, Math.sqrt(2 * h / g), 1e-4, 's');
      check(`h = ${h} m, m = ${m} kg: landing speed`, r.v, Math.sqrt(2 * g * h), 1e-3, 'm/s');
    }
  }
  lines.push('--- Experiment 2: air, long drops reach terminal velocity (air resistance = weight) ---');
  for (const [m, key] of [[0.1, 'largeBall'], [1, 'parachute'], [0.5, 'smallBall']]) {
    const vT = Physics.terminalVelocity(m, SHAPES[key]);
    const r = Physics.simulateFall(1500, m, SHAPES[key], true);
    check(`${m} kg ${key}: landing speed after 1500 m`, r.v, vT, vT * 1e-3, 'm/s');
    check(`${m} kg ${key}: air resistance at vT equals weight`, Physics.drag(vT, SHAPES[key]), m * g, 1e-9, 'N');
  }
  lines.push('--- Experiment 2: in air, same size, heavier lands first; air is slower than vacuum ---');
  {
    const heavy = Physics.simulateFall(50, 5, SHAPES.smallBall, true).t, light = Physics.simulateFall(50, 0.5, SHAPES.smallBall, true).t;
    const vac = Math.sqrt(100 / g);
    check('5 kg lands before 0.5 kg (1 = true)', heavy < light ? 1 : 0, 1, 0, '');
    check('both slower than vacuum (1 = true)', heavy > vac && light > vac ? 1 : 0, 1, 0, '');
    lines.push(`      50 m drop: vacuum ${vac.toFixed(3)} s, 5 kg ${heavy.toFixed(3)} s, 0.5 kg ${light.toFixed(3)} s`);
  }
  lines.push('--- Experiment 3: Hooke’s law, e = F / k up to the limit of proportionality ---');
  for (const [F, key] of [[0.98, 'soft'], [1.96, 'soft'], [3.92, 'soft'], [4.9, 'stiff'], [7.84, 'stiff']]) {
    check(`F = ${F} N, k = ${SPRINGS[key].k} N/m: extension`, Physics.springExtension(F, SPRINGS[key]), F / SPRINGS[key].k, 1e-12, 'm');
  }
  check('Past the limit of proportionality, extension > F / k (1 = true)', Physics.springExtension(7.84, SPRINGS.soft) > 7.84 / 20 ? 1 : 0, 1, 0, '');
  check('Masses removed after 5.88 N (below elastic limit): extension', Physics.springExtension(0, SPRINGS.soft, 5.88), 0, 1e-12, 'm');
  check('Masses removed after 8.82 N (past elastic limit): permanently stretched (1 = true)', Physics.springExtension(0, SPRINGS.soft, 8.82) > 0.001 ? 1 : 0, 1, 0, '');
  check('Elastic energy ½ k e² for k = 20 N/m, e = 0.1 m', 0.5 * 20 * 0.1 * 0.1, 0.1, 1e-12, 'J');

  lines.push('--- Experiment 4: V = I R ---');
  for (const [V, R] of [[6, 10], [3, 10], [3.3, 22], [-4, 20], [1.5, 5]]) {
    check(`Resistor R = ${R} Ω, V = ${V} V: I = V / R`, Physics.ivReading('resistor', V, { R0: R, heating: false }).I, V / R, 1e-12, 'A');
  }
  {
    const lo = Physics.ivReading('lamp', 1, {}), hi = Physics.ivReading('lamp', 6, {});
    check('Lamp at 6 V: current (R = 12.5 Ω)', hi.I, 0.48, 1e-12, 'A');
    check('Lamp: resistance at 6 V > resistance at 1 V (1 = true)', hi.V / hi.I > lo.V / lo.I ? 1 : 0, 1, 0, '');
    check('Resistor warming up (Realistic): R at 6 V > 10 Ω (1 = true)', Physics.resistorR(6, { R0: 10, heating: true }) > 10 ? 1 : 0, 1, 0, '');
    const rev = Physics.ivReading('diode', -6, {}), fwd = Physics.ivReading('diode', 6, {});
    check('Diode reversed at −6 V: current (almost zero)', rev.I, 0, 1e-6, 'A');
    check('Diode forward: p.d. across it is 0.6–0.8 V (1 = true)', fwd.V > 0.6 && fwd.V < 0.8 ? 1 : 0, 1, 0, '');
    check('Diode forward: supply 6 V = diode p.d. + I × 100 Ω', fwd.V + fwd.I * DIODE_RP, 6, 1e-9, 'V');
  }

  lines.push('--- Experiment 5: series and parallel ---');
  {
    const s2 = Physics.solveCircuit('series', [12, 12], 6), p1 = Physics.solveCircuit('parallel', [12], 6), p2 = Physics.solveCircuit('parallel', [12, 12], 6);
    check('Two 12 Ω bulbs in series on 6 V: current (6 ÷ 24)', s2.I, 0.25, 1e-12, 'A');
    check('...p.d. across each bulb', s2.Vi[1], 3, 1e-12, 'V');
    check('Two 12 Ω bulbs in parallel: current in each branch (6 ÷ 12)', p2.Ii[0], 0.5, 1e-12, 'A');
    check('...main current = sum of branch currents', p2.I, p2.Ii[0] + p2.Ii[1], 1e-12, 'A');
    check('Adding a parallel branch: first bulb current unchanged (ideal)', p2.Ii[0], p1.Ii[0], 1e-12, 'A');
    check('10 Ω + 20 Ω in series: total resistance', Physics.solveCircuit('series', [10, 20], 6).Rtot, 30, 1e-12, 'Ω');
    check('10 Ω and 20 Ω in parallel: total resistance (less than 10 Ω)', Physics.solveCircuit('parallel', [10, 20], 6).Rtot, 20 / 3, 1e-12, 'Ω');
    check('Series circuit with a bulb removed: current', Physics.solveCircuit('series', [12, null], 6).I, 0, 0, 'A');
    check('Parallel with one bulb removed: other branch current', Physics.solveCircuit('parallel', [12, null], 6).Ii[0], 0.5, 1e-12, 'A');
    const r1 = Physics.solveCircuit('parallel', [12], 6, 1), r2 = Physics.solveCircuit('parallel', [12, 12], 6, 1);
    check('Battery with 1 Ω inside: a second branch dims the first bulb (1 = true)', r2.Ii[0] < r1.Ii[0] ? 1 : 0, 1, 0, '');
  }

  lines.push('--- Experiment 6: refraction (sin i = n sin r) ---');
  for (const [i, n, r] of [[0, 1.5, 0], [30, 1.5, 19.47], [40, 1.5, 25.37], [60, 1.33, 40.63]]) {
    check(`i = ${i}°, n = ${n}: angle of refraction`, Physics.refractionAngle(i, n), r, 0.01, '°');
  }
  for (const i of [10, 40, 70]) check(`i = ${i}°: emergent angle = incident angle (parallel rays)`, Physics.emergenceAngle(Physics.refractionAngle(i, 1.5), 1.5), i, 1e-9, '°');
  check('i = 0°: no sideways shift', Physics.lateralShift(0, 1.5, 0.06), 0, 1e-12, 'm');

  lines.push('--- Experiment 7: motion graphs ---');
  {
    const j = JOURNEYS.trip, a = Physics.journeyState(j, 4), b = Physics.journeyState(j, 10), c = Physics.journeyState(j, 15);
    check('Speed up at 2.5 m/s² for 4 s: velocity (v = u + a t)', a.v, 10, 1e-12, 'm/s');
    check('...distance = area under v–t = ½ × 4 × 10', a.x, 20, 1e-12, 'm');
    check('Then 6 s at 10 m/s: distance added (s = v t)', b.x - a.x, 60, 1e-12, 'm');
    check('Braking from 10 m/s at 2 m/s²: distance (v² − u² = 2 a s)', c.x - b.x, 10 * 10 / (2 * 2), 1e-12, 'm');
    check('...final velocity', c.v, 0, 1e-12, 'm/s');
    check('Steady 10 m/s for 10 s: distance', Physics.journeyState(JOURNEYS.steady, 10).x, 100, 1e-12, 'm');
  }

  lines.push('--- Experiment 8: decay model ---');
  check('Half-life for a 1 in 2 chance each minute', Physics.halfLife(0.5), 1, 1e-12, 'min');
  check('Half-life for a 1 in 6 chance each minute', Physics.halfLife(1 / 6), 3.8018, 1e-3, 'min');
  {
    const N0 = 200000, alive = new Int16Array(N0).fill(-1);
    let N = N0;

  lines.push('--- Specific heat capacity: ΔE = m c Δθ ---');

  check('Same energy into 2 kg water (c = 4200): Δθ', Physics.temperatureRise(28800, 2, 4200), 28800 / 8400, 1e-12, '°C');

  lines.push('--- Infrared radiation ---');

    const times = SURFACES.map(tMelt);

  lines.push('--- Density: ρ = m / V ---');

  check('A block 8 times bigger: same density', Physics.density(2.7 * 192, 192), 2.7, 1e-12, 'g/cm³');
  check('Displacement: water rises by the object’s volume', Physics.displaced(37, 2.65, false), 37, 1e-12, 'cm³');
  check('Floating wood (0.75 g/cm³, 60 cm³) not pushed under: displaces only', Physics.displaced(60, 0.75, false), 45, 1e-12, 'cm³');
  lines.push('--- Resistance of a wire: R = ρ L / A ---');
  {
    const R1 = Physics.wireR(4.9e-7, 1, 0.3);
    check('Constantan, 1 m, d = 0.30 mm: R = ρL ÷ (π d²/4)', R1, 4.9e-7 / (Math.PI * 0.00015 ** 2), 1e-9, 'Ω');

    const c = Physics.wireCircuit(WIRE_MATERIALS.constantan, 0.5, 0.3, 3, false);
    check('Circuit (Ideal): V ÷ I = R of 50 cm of wire', c.V / c.I, R1 / 2, 1e-9, 'Ω');

  }
  lines.push('--- Ripple tank: v = f λ ---');
  check('6 Hz in deep water: λ = v ÷ f', RIPPLE.vDeep / 6, 0.05, 1e-12, 'm');
  check('...and v = f λ', 6 * 0.05, RIPPLE.vDeep, 1e-12, 'm/s');
  check('Shallow water at 6 Hz: λ', RIPPLE.vShallow / 6, 0.03, 1e-12, 'm');
  check('Waves hitting the boundary at 30° leave at (sin θ₂ = 0.6 sin 30°)', Physics.rippleRefract(30, RIPPLE.vDeep, RIPPLE.vShallow), Math.asin(0.3) / DEG, 1e-9, '°');
  lines.push('--- Waves on a string ---');
  {
    const f1 = Physics.fundamental(0.5 * SETTINGS.g, 1.0);
    check('500 g, 1.0 m: first resonance f₁ = √(T/μ) ÷ 2L', f1, Math.sqrt(4.9 / 0.002) / 2, 1e-9, 'Hz');
    check('3 loops: v = f λ with λ = 2L ÷ 3 equals the wave speed', 3 * f1 * (2 / 3), Physics.stringSpeed(4.9, STRING_MU), 1e-9, 'm/s');
    check('Strongest response exactly at a resonance', Physics.modeAmp(2 * f1, 2, f1, 1), 1, 1e-12, '');
  }
  lines.push('--- Momentum: total p before = total p after ---');
  for (const [mA, mB, uA, uB, e] of [[1, 1, 2, 0, 0], [1, 1, 2, 0, 1], [2, 1, 3, -1, 0.5], [3, 2, 1, -2, 1], [0.5, 4, 2, 0, 0]]) {
    const r = Physics.collide(mA, mB, uA, uB, e);
    check(`m ${mA} & ${mB} kg, u ${uA} & ${uB} m/s, e = ${e}: momentum after`, mA * r.vA + mB * r.vB, mA * uA + mB * uB, 1e-12, 'kg m/s');
  }
  {
    const st = Physics.collide(1, 1, 2, 0, 0), el = Physics.collide(1, 1, 2, 0, 1), el2 = Physics.collide(3, 2, 1, -2, 1);
    check('1 kg at 2 m/s sticks to a still 1 kg: speed after', st.vA, 1, 1e-12, 'm/s');
    check('Elastic, equal masses: moving trolley stops', el.vA, 0, 1e-12, 'm/s');
    check('Elastic: kinetic energy after = before', Physics.kineticEnergy(3, el2.vA) + Physics.kineticEnergy(2, el2.vB), Physics.kineticEnergy(3, 1) + Physics.kineticEnergy(2, -2), 1e-12, 'J');
  }
  lines.push('--- Motor effect: F = B I l ---');
  check('B = 0.2 T, I = 3 A, l = 0.05 m', Physics.motorForce(0.2, 3, 0.05), 0.03, 1e-12, 'N');
  check('Current out of screen, field to the right: force up (+1)', Physics.motorDirection(1, 1), 1, 0, '');
  check('Reverse the current: force down (−1)', Physics.motorDirection(-1, 1), -1, 0, '');
  check('Reverse both: force up again (+1)', Physics.motorDirection(-1, -1), 1, 0, '');
  lines.push('--- Electromagnetic induction ---');
  check('Magnet still: induced p.d.', Physics.inducedPD(200, -0.02, 0, 1), 0, 1e-12, 'V');
  check('Twice the speed: twice the p.d.', Physics.inducedPD(200, -0.02, 0.6, 1) / Physics.inducedPD(200, -0.02, 0.3, 1), 2, 1e-12, '');
  check('Twice the turns: twice the p.d.', Physics.inducedPD(400, -0.02, 0.3, 1) / Physics.inducedPD(200, -0.02, 0.3, 1), 2, 1e-12, '');
  check('Turn the magnet round: p.d. reverses', Physics.inducedPD(200, -0.02, 0.3, -1), -Physics.inducedPD(200, -0.02, 0.3, 1), 1e-12, 'V');
  check('Pull out instead of push in: p.d. reverses', Physics.inducedPD(200, -0.02, -0.3, 1), -Physics.inducedPD(200, -0.02, 0.3, 1), 1e-12, 'V');
  lines.push('--- Moments: M = F d ---');
  check('4 N at 0.20 m', Physics.moment(4, 0.2), 0.8, 1e-12, 'N m');
  check('2 N at 0.40 m balances it', Physics.moment(2, 0.4), Physics.moment(4, 0.2), 1e-12, 'N m');
  lines.push('--- Pressure in a liquid: p = h ρ g ---');
  check('0.5 m of water', Physics.liquidPressure(0.5, 1000), 4900, 1e-9, 'Pa');
  check('0.5 m of cooking oil (920 kg/m³)', Physics.liquidPressure(0.5, 920), 4508, 1e-9, 'Pa');
  check('0.76 m of mercury is about atmospheric pressure', Physics.liquidPressure(0.76, 13600), 101293, 1, 'Pa');
  lines.push('--- Efficiency ---');
  check('Kettle: 1800 J useful from 2000 J', Physics.efficiency(1800, 2000), 0.9, 1e-12, '');
  check('Filament lamp: 3 J light from 60 J', Physics.efficiency(3, 60), 0.05, 1e-12, '');

  lines.push('--- Number formatting ---');
  check('sf(149.2, 2) = 150', +sf(149.2, 2), 150, 0, '');
  check('sf(0.0457, 2) = 0.046', +sf(0.0457, 2), 0.046, 1e-12, '');
  check('fx(2.005, 1) = 2.0', +fx(2.005, 1), 2.0, 1e-12, '');

  lines.push('--- Worksheets: every ready experiment has complete worksheet text ---');
  const need = ['aim', 'method', 'variables', 'formula', 'assumptions', 'results', 'graph', 'predict', 'graphQs', 'worked', 'mistakeQ', 'evaluation'];
  for (const e of EXPERIMENTS.filter(x => x.status === 'ready')) {
    const w = WORKSHEETS[e.id] || {};
    const missing = need.filter(k => !w[k]);
    const blanksOk = w.worked && /_{3}/.test(w.worked.blank) && (w.formula ? w.formula.lines.every(([q]) => /_{3}/.test(q)) : false);
    check(`${e.id}: parts missing (${missing.join(', ') || 'none'})${blanksOk ? '' : ', a formula or worked-example line has no ___ blank'}`, missing.length + (blanksOk ? 0 : 1), 0, 0, '');
  }

  lines.unshift(`SELF-TEST: ${pass} passed, ${fail} failed`, '');
  document.title = `SELFTEST ${fail ? 'FAIL' : 'PASS'} ${pass}/${pass + fail}`;
  $('#app').innerHTML = `<header class="bar"><button class="btn" data-act="home">⌂ Home</button><h1>Physics self-test</h1></header>
    <main class="home"><pre id="selftest" style="font-size:1rem;white-space:pre-wrap">${esc(lines.join('\n'))}</pre></main>`;
}
</script>
</body>
</html>
