<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCSE Physics Demos</title>
<!--
  GCSE PHYSICS DEMOS (AQA 8463)
  A single, self-contained file: no internet connection needed.
  Open it by double-clicking. Works in Chrome, Edge and Firefox.

  To change slider ranges or starting values, scroll down to the
  section called "3. EXPERIMENTS" and look for DEFAULTS and CONTROLS
  inside each experiment.
-->
<style>
/* ===================================================================
   COLOURS AND SIZES
   Light theme first, dark theme underneath. Change colours here.
   =================================================================== */
:root {
  --scale: 1;                 /* text size multiplier (A− / A+ buttons) */
  --font: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --bg: #ffffff;
  --panel: #f1f4f8;
  --panel2: #e2e7ef;
  --ink: #0a0e17;
  --muted: #3d4757;
  --line: #b4bdcb;
  --accent: #0047b3;
  --accent-ink: #ffffff;
  --a: #0a5bd6;               /* object / trolley A */
  --b: #d45a00;               /* object / trolley B */
  --force: #c8102e;           /* applied force, weight */
  --friction: #6a2cc0;        /* friction, air resistance */
  --resultant: #0a0e17;       /* resultant force */
  --vel: #007a3d;             /* velocity */
  --acc: #b0177a;             /* acceleration */
  --grid: #dfe4ec;
  --ground: #8a7457;
  --key-bg: #e6f0ff;
  --key-line: #0047b3;
  --mis-bg: #fff0e3;
  --mis-line: #c45200;
}
:root[data-theme="dark"] {
  --bg: #0b0f17;
  --panel: #151c28;
  --panel2: #222c3c;
  --ink: #f3f6fb;
  --muted: #b9c3d4;
  --line: #3a4659;
  --accent: #5ea8ff;
  --accent-ink: #04101f;
  --a: #5ea8ff;
  --b: #ff9a3d;
  --force: #ff5a6e;
  --friction: #c09bff;
  --resultant: #f3f6fb;
  --vel: #3ddc84;
  --acc: #ff72bf;
  --grid: #253043;
  --ground: #7d6a50;
  --key-bg: #10233f;
  --key-line: #5ea8ff;
  --mis-bg: #33200f;
  --mis-line: #ff9a3d;
}
/* Base text size grows with the screen: about 14px on a 1366px laptop,
   about 18px on a 1920px projector. */
html { font-size: calc(clamp(14px, 0.55vw + 7px, 24px) * var(--scale)); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.35; }
#app { display: flex; flex-direction: column; height: 100vh; }
h1, h2, h3 { margin: 0; }
button, select, input { font: inherit; color: inherit; }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: .6rem; padding: .45rem .8rem; background: var(--panel);
       border-bottom: 2px solid var(--line); flex-wrap: wrap; flex: none; }
.bar h1 { font-size: 1.4rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.bar h1 small { font-size: .9rem; color: var(--muted); font-weight: 600; }
.spacer { flex: 1; }
.eqchip { font-size: 1.05rem; padding: .15em .55em; border: 2px solid var(--ink); border-radius: .4rem; font-weight: 700; }
.badge { font-size: .9rem; font-weight: 700; padding: .3em .7em; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.badge.model { background: var(--mis-line); color: #fff; }
.badge.none { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); }

/* ---------- buttons ---------- */
.btn { min-height: 2.6rem; padding: .45em .95em; border-radius: .5rem; border: 2px solid var(--line);
       background: var(--bg); color: var(--ink); font-weight: 650; font-size: 1rem; cursor: pointer;
       touch-action: manipulation; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .tile:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.on, .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { font-size: 1.15rem; min-width: 8.5rem; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: .55rem; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; }
.seg .btn + .btn { border-left: 2px solid var(--line); }

/* ---------- home screen ---------- */
.home { flex: 1; overflow-y: auto; padding: 1rem 1.2rem 2rem; }
.home .intro { font-size: 1.1rem; color: var(--muted); margin: .2rem 0 1rem; }
.topic { margin-bottom: 1.4rem; }
.topic h2 { font-size: 1.35rem; margin-bottom: .6rem; padding-bottom: .2rem; border-bottom: 3px solid var(--line); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: .9rem; }
.tile { text-align: left; display: flex; flex-direction: column; gap: .35rem; padding: 1rem 1.1rem; min-height: 9rem;
        border: 3px solid var(--line); border-radius: .8rem; background: var(--panel); cursor: pointer; }
.tile:hover { border-color: var(--accent); }
.tile.ready { border-color: var(--accent); }
.tile-title { font-size: 1.3rem; font-weight: 750; }
.tile-eq { font-size: 1.05rem; font-weight: 700; color: var(--muted); }
.tile-num { font-size: .9rem; font-weight: 700; color: var(--muted); }
.tile-foot { margin-top: auto; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.status { font-size: .85rem; font-weight: 700; padding: .2em .6em; border-radius: 999px; }
.status.ready { background: var(--vel); color: var(--bg); }
.status.planned { background: var(--panel2); border: 1px solid var(--line); }

/* ---------- experiment page ---------- */
.exp { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
       gap: .8rem; padding: .7rem .8rem; }
.col { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: .65rem; padding: 0 .3rem .8rem 0; }
.modes { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.mode-note { font-size: .95rem; color: var(--muted); margin-top: -.2rem; }
.mode-note b { color: var(--ink); }
.canvas-wrap { flex: none; position: relative; border: 2px solid var(--line); border-radius: .6rem; overflow: hidden; background: var(--bg); }
.canvas-wrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.diagram-wrap { height: 44vh; min-height: 250px; }
.diagram-wrap.tall { height: 56vh; min-height: 320px; }
.graph-wrap { height: 40vh; min-height: 230px; }
.runbar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.runbar label { display: flex; align-items: center; gap: .4rem; font-weight: 600; }
.runbar select, .ctl select { min-height: 2.6rem; padding: .2em .5em; border: 2px solid var(--line); border-radius: .5rem; background: var(--bg); }
.clock { margin-left: auto; font-size: 1.35rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.chips .lbl { font-weight: 700; margin-right: .2rem; }
.chips .btn { min-height: 2.3rem; font-size: .95rem; padding: .3em .8em; border-radius: 999px; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: .6rem .8rem; }
.ctl { background: var(--panel); border: 2px solid var(--line); border-radius: .6rem; padding: .45rem .7rem .35rem; }
.ctl.wide { grid-column: 1 / -1; }
.ctl-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.ctl-head label { font-weight: 700; font-size: 1.02rem; }
.ctl-head output { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sl-row { display: flex; align-items: center; gap: .45rem; }
.sl-row .btn { min-width: 2.7rem; padding: 0; font-size: 1.4rem; line-height: 1; }
.range-ends { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); padding: 0 3.2rem; }
.ctl select { width: 100%; margin-top: .3rem; font-size: 1rem; }
.ctl .btnrow { display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .3rem; }
.ctl > .btn { width: 100%; }

/* big, touch-friendly sliders (Chrome / Edge and Firefox styles) */
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 2.6rem; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: .6rem; background: var(--panel2); border: 1px solid var(--line); border-radius: .3rem; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 1.9rem; height: 1.9rem; margin-top: -.71rem; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--accent); }
input[type=range]::-moz-range-track { height: .6rem; background: var(--panel2); border: 1px solid var(--line); border-radius: .3rem; }
input[type=range]::-moz-range-thumb { width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--accent); }

/* readouts */
.readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.8rem, 1fr)); gap: .45rem; }
.ro { background: var(--panel); border: 2px solid var(--line); border-radius: .55rem; padding: .3rem .55rem; }
.ro-label { font-size: .85rem; font-weight: 700; color: var(--muted); }
.ro-val { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.ro-val .who { font-size: .8rem; font-weight: 800; margin-right: .3rem; }
.who.A { color: var(--a); } .who.B { color: var(--b); }

/* text cards */
.tabs { display: flex; gap: .4rem; flex-wrap: wrap; }
.tabs .btn { min-height: 2.3rem; font-size: .95rem; }
.cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: .6rem; padding: .55rem .8rem; }
.card h2 { font-size: 1.08rem; margin-bottom: .25rem; }
.card p { margin: 0; font-size: 1.02rem; }
.card ul { margin: .2rem 0 0; padding-left: 1.2rem; }
.card li { margin: .15rem 0; }
.card.key { background: var(--key-bg); border-color: var(--key-line); border-left-width: 8px; }
.card.mistake { background: var(--mis-bg); border-color: var(--mis-line); border-left-width: 8px; }
.eqlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .5rem; }
.eq { border: 1px solid var(--line); border-radius: .5rem; padding: .35rem .6rem; background: var(--bg); }
.eq-sym { font-size: 1.45rem; font-weight: 800; font-family: "Cambria Math", Cambria, "Times New Roman", serif; }
.eq-words { font-size: .95rem; }
.eq-units { font-size: .85rem; color: var(--muted); }
.small { font-size: .9rem; color: var(--muted); }

/* data table */
.data .btnrow { display: flex; gap: .45rem; flex-wrap: wrap; margin: .3rem 0 .4rem; }
.tablewrap { overflow-x: auto; }
table.results { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.results th, table.results td { border: 1px solid var(--line); padding: .3rem .5rem; text-align: right; }
table.results th { background: var(--panel2); font-size: .9rem; text-align: center; }
table.results td:first-child, table.results th:first-child { text-align: center; }

/* ---------- left column: everything needed to run the experiment fits on one screen ----------
   The diagram takes whatever height the controls leave, so nothing needs scrolling. */
.col.left { overflow-y: auto; gap: .45rem; padding-bottom: .2rem; }   /* scrolls only if the text is made much bigger with A+ */
.col.left .diagram-wrap, .col.left .diagram-wrap.tall { flex: 1 1 auto; height: auto; min-height: 9rem; }
.exp.has-rail { grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr) auto; }
.col.left .modes { gap: .4rem; }
.col.left .modes .btn { min-height: 2.45rem; padding: .3em .7em; font-size: .95rem; }
.col.left .runbar .btn { min-height: 2.45rem; padding: .35em .85em; }
.col.left .runbar select { min-height: 2.45rem; }
.col.left .mode-note { font-size: .88rem; margin-top: -.15rem; line-height: 1.25; }
.col.left .clock { font-size: 1.25rem; }
.controls { grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: .4rem .5rem; align-items: start; }
.ctl { padding: .22rem .5rem .25rem; border-radius: .5rem; }
.ctl-head label { font-size: .9rem; line-height: 1.2; }
.ctl-head output { font-size: 1.15rem; }
.sl-row .btn { min-width: 2.3rem; min-height: 2.2rem; font-size: 1.25rem; }
.sl-row input[type=range] { height: 2.2rem; min-width: 0; width: 100%; }
.col.right .readouts { grid-template-columns: repeat(auto-fill, minmax(7.6rem, 1fr)); gap: .4rem; }
.col.right .ro-label { font-size: .8rem; line-height: 1.2; }
.ro-vals { display: flex; flex-wrap: wrap; gap: 0 .7rem; }
.ro-vals .ro-val { font-size: 1.2rem; }

/* narrower screens (laptops): the header tools show icons only (the names are in their tooltips) */
.bar .btn .lbl-short { display: none; }
@media (max-width: 1500px) {
  .bar .btn .lbl { display: none; }
  .bar .btn .lbl-short { display: inline; }
  .bar h1 { font-size: 1.25rem; }
  .bar .badge { font-size: .82rem; }
}
.ctl select { min-height: 2.3rem; margin-top: .15rem; font-size: .95rem; }
.ctl > .btn { min-height: 2.3rem; padding: .25em .6em; font-size: .92rem; }
.ctl .btnrow { gap: .35rem; margin-top: .15rem; }
.ctl .btnrow .btn { min-height: 2.2rem; padding: .2em .65em; font-size: .9rem; }
.chips .btn { min-height: 2.15rem; }

/* ---------- right column: graph, equation, live values ---------- */
.col.right { overflow-y: auto; }
.col.right .graph-wrap { flex: 1 1 auto; height: auto; min-height: 10rem; }
.eqbar { flex: none; display: flex; flex-wrap: wrap; gap: .3rem 1.6rem; justify-content: center; align-items: baseline;
         padding: .3rem .8rem; border: 2px solid var(--ink); border-radius: .6rem; background: var(--bg); }
.eqbar .eq-sym { font-size: 1.6rem; white-space: nowrap; }
.recbar { flex: none; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.recbar .small { font-size: .95rem; }

/* ---------- sidebar: a rail of toggle buttons and the panels they open ----------
   The panels slide over the graph column; any number can be open at once. */
.exp.has-rail { position: relative; }
.rail { display: flex; flex-direction: column; gap: .45rem; padding-bottom: .4rem; overflow-y: auto; }
.rail .btn { width: 5.8rem; min-height: 3.7rem; padding: .3rem .25rem; font-size: .88rem; line-height: 1.15;
             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem; }
.rail .ico { font-size: 1.3rem; line-height: 1; font-weight: 800; }
.drawer { position: absolute; top: .7rem; bottom: .7rem; right: 7.4rem; width: min(34rem, 46%); z-index: 5;
          display: flex; flex-direction: column; gap: .55rem; overflow-y: auto; pointer-events: none; padding: 0 .2rem .2rem; }
.side-panel { pointer-events: auto; flex: none; box-shadow: 0 .4rem 1.6rem rgba(0, 0, 0, .3); }
.side-panel[hidden] { display: none; }
.side-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: .3rem; }
.side-head .btn { min-height: 2.2rem; padding: .1em .65em; font-size: 1.1rem; }
.side-panel .eqlist { grid-template-columns: 1fr; }

/* planned (coming soon) page */
.planned-page { flex: 1; overflow-y: auto; padding: 1rem 1.2rem 2rem; display: grid; gap: .8rem; max-width: 70rem; }
.planned-page .card p, .planned-page .card li { font-size: 1.1rem; }

/* predict pop-up */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 10; }
#modal[hidden] { display: none; }
.modal-card { background: var(--bg); color: var(--ink); border: 3px solid var(--accent); border-radius: 1rem; padding: 1.4rem 1.8rem;
              width: min(62rem, 100%); max-height: 92vh; overflow-y: auto; }
.modal-tag { font-weight: 800; color: var(--accent); font-size: 1.05rem; text-transform: uppercase; letter-spacing: .05em; }
.modal-card h2 { font-size: 2rem; line-height: 1.25; margin: .5rem 0 .7rem; }
.modal-card .think { font-size: 1.15rem; color: var(--muted); margin: 0 0 1rem; }
.answer { font-size: 1.45rem; line-height: 1.35; background: var(--key-bg); border-left: 8px solid var(--key-line); padding: .7rem 1rem; border-radius: .5rem; margin-bottom: 1rem; }
.modal-btns { display: flex; gap: .6rem; flex-wrap: wrap; }
.modal-btns .btn { font-size: 1.15rem; }

/* worksheet selection screen */
.modal-card.ws-card { width: min(88rem, 100%); height: 94vh; max-height: none; padding: 1rem 1.2rem; overflow: hidden;
                      display: grid; grid-template-columns: minmax(17rem, 25rem) 1fr; grid-template-rows: auto 1fr auto; gap: .6rem 1.2rem; }
.ws-card > header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.ws-card > header h2 { font-size: 1.5rem; margin: 0; }
.ws-pick { overflow-y: auto; padding-right: .3rem; }
.ws-pick h3 { font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: .4rem 0 .3rem; }
.ws-pick ul { list-style: none; margin: 0 0 .6rem; padding: 0; }
.ws-pick li { padding: .2rem 0; }
.ws-pick .core { columns: 2; column-gap: .8rem; font-size: .92rem; }
.ws-pick .core li { padding: .1rem 0; break-inside: avoid; }
.ws-pick .core li::before { content: '✓  '; font-weight: 800; color: var(--vel); }
.ws-pick label { display: flex; gap: .55rem; align-items: flex-start; cursor: pointer; padding: .3rem .4rem; border-radius: .4rem; }
.ws-pick label:hover { background: var(--panel); }
.ws-pick input[type=checkbox] { width: 1.3rem; height: 1.3rem; margin: .1rem 0 0; flex: none; accent-color: var(--accent); }
.ws-pick .note { display: block; font-size: .85rem; color: var(--muted); }
.ws-view { display: flex; flex-direction: column; gap: .4rem; min-height: 0; }
.ws-preview { flex: 1; min-height: 0; overflow: auto; background: var(--panel2); border: 2px solid var(--line); border-radius: .6rem; padding: .8rem; }
.ws-scale { transform-origin: 0 0; }
.ws-preview .ws-page { margin: 0 auto 6mm; box-shadow: 0 1mm 4mm rgba(0, 0, 0, .35); }
.ws-card > footer { grid-column: 1 / -1; display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }

/* ---------- the printed worksheet (always black on white, A4 portrait) ---------- */
.ws-page { width: 210mm; height: 297mm; padding: 12mm 14mm 18mm; background: #fff; color: #000; position: relative; overflow: hidden;
           font: 11pt/1.38 Arial, Helvetica, sans-serif; text-align: left; }
.ws-page * { color: #000; }
.ws-foot { position: absolute; left: 14mm; right: 14mm; bottom: 8mm; border-top: .3mm solid #000; padding-top: 1.5mm;
           display: flex; justify-content: space-between; gap: 4mm; font-size: 9pt; }
.ws-sec { margin: 0 0 4.5mm; }
.ws-sec h3 { font-size: 12.5pt; margin: 0 0 1.8mm; padding-bottom: .8mm; border-bottom: .4mm solid #000; }
.ws-sec p { margin: 0 0 1.5mm; }
.ws-sec ol, .ws-sec ul { margin: 0; padding-left: 6mm; }
.ws-sec li { margin: 0 0 1mm; }
.ws-kicker { font-size: 9.5pt; letter-spacing: .02em; }
.ws-head h1 { font-size: 19pt; margin: 1mm 0 1mm; line-height: 1.15; }
.ws-meta { font-size: 10pt; margin-bottom: 3mm; }
.ws-ph { font-weight: 700; border: .3mm dashed #000; padding: 0 1mm; }
.ws-boxes { display: grid; grid-template-columns: 2.2fr 1fr 1fr; gap: 4mm; }
.ws-boxes div { border: .35mm solid #000; height: 10mm; padding: 1mm 2mm; font-size: 9.5pt; font-weight: 700; }
.ws-keybanner { border: .7mm solid #000; padding: 2mm 3mm; font-size: 13pt; font-weight: 800; text-align: center; letter-spacing: .03em; }
table.ws-t { width: 100%; border-collapse: collapse; }
table.ws-t th, table.ws-t td { border: .3mm solid #000; padding: 1.4mm 2mm; vertical-align: top; }
table.ws-t th { font-size: 10pt; text-align: center; vertical-align: middle; }
table.ws-t td.row-h { font-weight: 700; width: 32mm; }
table.ws-t td.unit { width: 34mm; }
table.ws-t.results td { height: 8mm; }
.blank { display: inline-block; min-width: 20mm; border-bottom: .35mm solid #000; margin: 0 1mm; }
.ws-eqline { font-size: 13pt; margin: 0 0 2.5mm; }
.ws-eqline .lbl { font-size: 10pt; font-weight: 700; display: inline-block; min-width: 34mm; }
.ws-lines div { height: 8mm; border-bottom: .25mm solid #444; }
.ws-q { margin: 0 0 2.5mm; break-inside: avoid; }
.ws-q .qn { font-weight: 700; }
.ws-box { border: .45mm solid #000; border-left-width: 2.2mm; padding: 2mm 3mm; }
.ws-opts { list-style: none; padding: 0 !important; margin: 1mm 0 0; }
.ws-opts li { display: flex; gap: 2.5mm; margin-bottom: 1.6mm; }
.ws-opts .tick { flex: none; width: 4.5mm; height: 4.5mm; border: .35mm solid #000; margin-top: .4mm; }
.ws-graph svg { display: block; }
.ans { font-weight: 700; }
.ans-note { font-style: italic; }
#print { display: none; }
#wsMeasure { position: absolute; left: -10000px; top: 0; visibility: hidden; }

@page { size: A4 portrait; margin: 0; }
@media print {
  html, body { height: auto; background: #fff; }
  body > *:not(#print) { display: none !important; }
  #print { display: block; }
  #print .ws-page { break-after: page; page-break-after: always; }
  #print .ws-page:last-child { break-after: auto; page-break-after: auto; }
}

#toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: .6rem 1.1rem;
         border-radius: .6rem; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
#toast.show { opacity: 1; }

/* narrow screens: stack the two columns */
@media (max-width: 900px) {
  #app { height: auto; min-height: 100vh; }
  .exp, .exp.has-rail { grid-template-columns: 1fr; }
  .col, .col.right, .col.left { overflow: visible; }
  .col.left .diagram-wrap { flex: none; height: 44vh; }
  .col.left .diagram-wrap.tall { height: 56vh; }
  .col.right .graph-wrap { flex: none; height: 40vh; }
  .rail { flex-direction: row; flex-wrap: wrap; order: 3; }
  .drawer { position: static; width: auto; order: 4; pointer-events: auto; overflow: visible; }
  .cards2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<div id="print"></div>

<script>
'use strict';
/* =====================================================================
   HOW THIS FILE IS ORGANISED  (search for the numbered headings)
     1. SETTINGS ...... numbers used everywhere (g, air density, ...)
     2. HELPERS ....... number formatting, arrows, the graph plotter
     PHYSICS .......... the equations used by the simulations
     3. EXPERIMENTS ... one block per experiment. Inside each block:
                         DEFAULTS = starting values
                         CONTROLS = sliders (change min / max / step)
                         text for the Key idea, Common mistake, Predict
     3b. WORKSHEET TEXT  what "Print worksheet" puts on paper, per experiment
     4. APP ........... home screen, buttons, sidebar panels, worksheet
                        printing, run loop, results table
     5. SELF-TEST ..... add #selftest to the end of the address in the
                        browser to check the physics numbers
   ===================================================================== */

/* =====================================================================
   1. SETTINGS
   ===================================================================== */
const SETTINGS = {
  g: 9.8,            // gravitational field strength in N/kg (value used by AQA)
  airDensity: 1.2,   // density of air in kg/m³
  maxRunTime: 30,    // s: the trolley simulation pauses itself after this time
  stepSize: 0.1,     // s: how far one press of "Step" moves time on
};

// Topics shown on the home screen, in this order.
const TOPICS = ['Energy', 'Electricity', 'Magnetism', 'Waves', 'Forces', 'Matter', 'Radioactivity', 'Motion'];
const ROOM_TEMP = 20;   // °C: room temperature for the thermal experiments

/* =====================================================================
   2. HELPERS
   ===================================================================== */
const FONT = 'system-ui, "Segoe UI", Roboto, Arial, sans-serif';
const $ = (sel, root = document) => root.querySelector(sel);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Number to a fixed number of decimal places, with a proper minus sign.
function fx(v, dp) {
  if (!isFinite(v)) return '–';
  if (Math.abs(v) < 0.5 * Math.pow(10, -dp)) v = 0;
  return v.toFixed(dp).replace('-', '−');
}
// Number to n significant figures.
function sf(v, n) {
  if (!isFinite(v)) return '–';
  if (v === 0) return '0';
  const dp = n - 1 - Math.floor(Math.log10(Math.abs(v)));
  if (dp >= 0) return fx(v, dp);
  const p = Math.pow(10, -dp);
  return fx(Math.round(v / p) * p, 0);
}
// A "nice" gap between axis ticks (1, 2 or 5 × a power of ten).
function niceStep(range, n) {
  const raw = range / Math.max(1, n);
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
// Round a maximum up to a nice axis end.
function niceCeil(v) {
  if (!(v > 0)) return 1;
  const s = niceStep(v, 5);
  return Math.ceil(v / s - 1e-9) * s;
}
// Straight-line fits. fitOrigin: y = k x.  linFit: y = k x + c.
function fitOrigin(pts) {
  let sxy = 0, sxx = 0;
  for (const p of pts) { sxy += p.x * p.y; sxx += p.x * p.x; }
  return sxx > 0 ? { k: sxy / sxx, c: 0 } : null;
}
function linFit(pts) {
  const n = pts.length;
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (const p of pts) { sx += p.x; sy += p.y; sxx += p.x * p.x; sxy += p.x * p.y; }
  const d = n * sxx - sx * sx;
  if (n < 2 || Math.abs(d) < 1e-12) return null;
  const k = (n * sxy - sx * sy) / d;
  return { k, c: (sy - k * sx) / n };
}

// Make a canvas sharp on high-resolution screens and return its size in CSS pixels.
function prep(cv) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  const W = Math.max(1, Math.round(w * dpr)), H = Math.max(1, Math.round(h * dpr));
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

// Read the theme colours from the CSS above so canvases match the page.
let colorCache = null, colorKey = '';
function colors() {
  const key = document.documentElement.dataset.theme || 'light';
  if (key !== colorKey) {
    const cs = getComputedStyle(document.documentElement);
    colorCache = {};
    for (const n of ['bg', 'panel', 'panel2', 'ink', 'muted', 'line', 'accent', 'a', 'b', 'force', 'friction',
                     'resultant', 'vel', 'acc', 'grid', 'ground']) {
      colorCache[n] = cs.getPropertyValue('--' + n).trim();
    }
    colorKey = key;
  }
  return colorCache;
}

function line(ctx, x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// A text label on a soft background so it can be read over drawings.
// o.align: 'left' | 'center' | 'right'.  o.fs: font size in px.
function label(ctx, text, x, y, color, o = {}) {
  const fs = o.fs || App.fs;
  ctx.save();
  ctx.font = `${o.weight || 650} ${fs}px ${FONT}`;
  const tw = ctx.measureText(text).width, pw = tw + fs * 0.6, ph = fs * 1.35;
  const ax = o.align === 'left' ? 0 : o.align === 'right' ? 1 : 0.5;
  const cw = ctx.canvas.width / (window.devicePixelRatio || 1);
  const bx = clamp(x - ax * pw, 2, Math.max(2, cw - pw - 2)), by = y - ph / 2;
  if (o.bg !== false) {
    ctx.globalAlpha = 0.85; ctx.fillStyle = colors().bg;
    roundRect(ctx, bx, by, pw, ph, ph * 0.3); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + fs * 0.3, y + fs * 0.05);
  ctx.restore();
}

// An arrow from (x1, y1) to (x2, y2). o.width, o.dash, o.label (+ o.lx, o.ly, o.align).
function arrow(ctx, x1, y1, x2, y2, color, o = {}) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  if (len >= 1) {
    const w = o.width || 4, head = Math.min(len, w * 3.4), ang = Math.atan2(y2 - y1, x2 - x1);
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
    if (o.dash) ctx.setLineDash(o.dash);
    line(ctx, x1, y1, x2 - Math.cos(ang) * head * 0.8, y2 - Math.sin(ang) * head * 0.8);
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - Math.cos(ang - 0.45) * head, y2 - Math.sin(ang - 0.45) * head);
    ctx.lineTo(x2 - Math.cos(ang + 0.45) * head, y2 - Math.sin(ang + 0.45) * head);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if (o.label) label(ctx, o.label, o.lx !== undefined ? o.lx : (x1 + x2) / 2, o.ly !== undefined ? o.ly : (y1 + y2) / 2, color, o);
}

// A wavy arrow (for infrared radiation and other waves). o.width, o.waves = number of wiggles.
function wavyArrow(ctx, x1, y1, x2, y2, color, o = {}) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  if (len < 4) return;
  const ux = (x2 - x1) / len, uy = (y2 - y1) / len, amp = o.amp || Math.min(6, len * 0.08);
  const waves = o.waves || Math.max(1, Math.round(len / 18)), head = Math.min(len * 0.4, (o.width || 3) * 3.2);
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = o.width || 3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const s = (len - head) * i / 40, off = Math.sin(i / 40 * waves * Math.PI * 2) * amp;
    const px = x1 + ux * s - uy * off, py = y1 + uy * s + ux * off;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke(); ctx.restore();
  arrow(ctx, x2 - ux * head * 1.2, y2 - uy * head * 1.2, x2, y2, color, { width: o.width || 3 });
}

// Register something on the diagram that can be dragged with mouse or touch.
// h = { id, x, y, r, onDrag(px, py), start(), end(), cursor }
function addHandle(ctx, h) {
  h.r = Math.max(h.r || 0, 22);
  App.handles.push(h);
  const hover = App.hoverId === h.id || (App.drag && App.drag.id === h.id);
  ctx.save();
  ctx.strokeStyle = colors().ink; ctx.lineWidth = hover ? 3 : 1.5; ctx.globalAlpha = hover ? 0.9 : 0.55;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

/* The graph plotter. Draws axes, ticks, gridlines and any of:
     o.series = [{ pts:[[x,y],...], color, width, dash, label }]
     o.points = [{ x, y, color, faded }]           (plotted as crosses)
     o.lines  = [{ x1, y1, x2, y2, color, dash, label }]
     o.shade  = [{ pts, color }]                   (area down to y = 0)
     o.notes  = [{ text, color }]                  (text in the corner)
     o.bars   = [{ x, y, color, width, label }]    (bar chart; width in x units)
     o.xTicks = [[value, 'text'], ...]             (named ticks instead of numbers)
     o.message = text shown in the middle (e.g. "record some data")
   Points with dot: true are drawn as filled circles (e.g. "you are here").
   area = { ctx, x, y, w, h } draws into part of a canvas (two graphs in one). */
function plot(cv, o, area) {
  let ctx, w, h, ox = 0, oy = 0;
  if (area) ({ ctx, x: ox, y: oy, w, h } = area);
  else ({ ctx, w, h } = prep(cv));
  const C = colors(), fs = App.fs;
  const xMin = o.xMin || 0, xMax = o.xMax, yMin = o.yMin || 0, yMax = o.yMax;
  const L = ox + fs * 4.6, R = fs * 1.3, T = oy + fs * 0.9, B = fs * 3.1;
  const pw = ox + w - L - R, ph = oy + h - T - B;
  const X = v => L + (v - xMin) / (xMax - xMin) * pw;
  const Y = v => T + ph - (v - yMin) / (yMax - yMin) * ph;
  const tick = (v, step) => fx(v, Math.max(0, -Math.floor(Math.log10(step) + 1e-9)));

  // gridlines and tick labels
  const xs = niceStep(xMax - xMin, Math.max(3, Math.floor(pw / (fs * 5))));
  const ys = niceStep(yMax - yMin, Math.max(3, Math.floor(ph / (fs * 2.4))));
  ctx.lineWidth = 1; ctx.strokeStyle = C.grid; ctx.fillStyle = C.muted;
  ctx.font = `${fs * 0.85}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  if (o.xTicks) {
    for (const [v, t] of o.xTicks) ctx.fillText(t, X(v), T + ph + fs * 0.35);
  } else {
    for (let v = Math.ceil(xMin / xs - 1e-9) * xs; v <= xMax + xs * 1e-6; v += xs) {
      line(ctx, X(v), T, X(v), T + ph); ctx.fillText(tick(v, xs), X(v), T + ph + fs * 0.35);
    }
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = Math.ceil(yMin / ys - 1e-9) * ys; v <= yMax + ys * 1e-6; v += ys) {
    line(ctx, L, Y(v), L + pw, Y(v)); ctx.fillText(tick(v, ys), L - fs * 0.4, Y(v));
  }
  // axes
  ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  const ax = clamp(X(0), L, L + pw), ay = clamp(Y(0), T, T + ph);
  line(ctx, L, ay, L + pw, ay); line(ctx, ax, T, ax, T + ph);
  // axis titles
  ctx.fillStyle = C.ink; ctx.font = `700 ${fs}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(o.xLabel, L + pw / 2, oy + h - fs * 0.25);
  ctx.save(); ctx.translate(ox + fs * 1.0, T + ph / 2); ctx.rotate(-Math.PI / 2);
  ctx.textBaseline = 'middle'; ctx.fillText(o.yLabel, 0, 0); ctx.restore();

  // everything inside the plot area is clipped to it
  ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
  for (const b of o.bars || []) {
    const x1 = X(b.x - b.width / 2), x2 = X(b.x + b.width / 2), y0 = Y(0), y1 = Y(b.y);
    ctx.fillStyle = b.color; ctx.globalAlpha = 0.85;
    ctx.fillRect(x1, Math.min(y0, y1), x2 - x1, Math.abs(y1 - y0));
    ctx.globalAlpha = 1;
  }
  for (const s of o.shade || []) {
    if (s.pts.length < 2) continue;
    ctx.beginPath(); ctx.moveTo(X(s.pts[0][0]), Y(0));
    for (const q of s.pts) ctx.lineTo(X(q[0]), Y(q[1]));
    ctx.lineTo(X(s.pts[s.pts.length - 1][0]), Y(0)); ctx.closePath();
    ctx.globalAlpha = 0.22; ctx.fillStyle = s.color; ctx.fill(); ctx.globalAlpha = 1;
  }
  for (const l of o.lines || []) {
    ctx.strokeStyle = l.color; ctx.lineWidth = l.width || 2; ctx.setLineDash(l.dash || []);
    line(ctx, X(l.x1), Y(l.y1), X(l.x2), Y(l.y2)); ctx.setLineDash([]);
  }
  for (const s of o.series || []) {
    if (s.pts.length < 2) continue;
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width || 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.setLineDash(s.dash || []);
    ctx.beginPath(); ctx.moveTo(X(s.pts[0][0]), Y(s.pts[0][1]));
    for (const q of s.pts) ctx.lineTo(X(q[0]), Y(q[1]));
    ctx.stroke(); ctx.setLineDash([]);
  }
  for (const p of o.points || []) {   // crosses, as students plot them
    const px = X(p.x), py = Y(p.y), r = fs * 0.45;
    ctx.globalAlpha = p.faded ? 0.35 : 1; ctx.strokeStyle = p.color; ctx.fillStyle = p.color; ctx.lineWidth = 3;
    if (p.dot) { ctx.beginPath(); ctx.arc(px, py, r * 1.1, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = C.bg; ctx.lineWidth = 2; ctx.stroke(); }
    else { line(ctx, px - r, py - r, px + r, py + r); line(ctx, px - r, py + r, px + r, py - r); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  for (const b of o.bars || []) {
    if (b.label) label(ctx, b.label, X(b.x), Y(Math.max(b.y, 0)) - fs * 0.8, C.ink, { fs: fs * 0.85 });
  }
  for (const p of o.points || []) {
    if (p.label) label(ctx, p.label, X(p.x) + fs * 0.8, Y(p.y) - fs * 0.9, p.color, { align: 'left', fs: fs * 0.85 });
  }
  for (const l of o.lines || []) {
    if (l.label) label(ctx, l.label, Math.min(X(l.x2), L + pw) - fs * 0.3, Y(l.y2) - fs * 0.8, l.color, { align: 'right', fs: fs * 0.85 });
  }
  // legend and notes: top-left inside the plot, or top-right with o.notesRight
  // (for graphs whose line starts at the top left, like decay curves)
  let ly = T + fs * 0.9;
  for (const s of (o.series || []).filter(s => s.label)) {
    const x1 = o.notesRight ? L + pw - fs * 2.2 : L + fs * 0.6;
    ctx.strokeStyle = s.color; ctx.lineWidth = Math.min(s.width || 3, 5); ctx.setLineDash(s.dash || []);
    line(ctx, x1, ly, x1 + fs * 1.6, ly); ctx.setLineDash([]);
    if (o.notesRight) label(ctx, s.label, x1 - fs * 0.2, ly, s.color, { align: 'right', fs: fs * 0.9 });
    else label(ctx, s.label, x1 + fs * 1.8, ly, s.color, { align: 'left', fs: fs * 0.9 });
    ly += fs * 1.4;
  }
  for (const n of o.notes || []) {
    if (o.notesRight) label(ctx, n.text, L + pw - fs * 0.5, ly, n.color || C.ink, { align: 'right', fs: fs * 0.9 });
    else label(ctx, n.text, L + fs * 0.5, ly, n.color || C.ink, { align: 'left', fs: fs * 0.9 });
    ly += fs * 1.4;
  }
  if (o.message) label(ctx, o.message, L + pw / 2, T + ph / 2, C.muted, { fs: fs * 0.95 });
  return { X, Y };
}

/* =====================================================================
   PHYSICS
   The equations behind the simulations. Each function is small so it
   can be checked by the self-test (section 5).
   ===================================================================== */
const Physics = {
  /* ---- Trolley on a level track ----
     push     = applied force (N), forwards
     friction = maximum friction force (N); 0 in Ideal mode
     If the trolley is moving, friction acts backwards with its full size.
     If it is still, friction only cancels the push, up to its maximum,
     so a small push does not move it.                                   */
  trolleyForces(v, push, m, friction) {
    const fr = v > 1e-9 ? friction : Math.min(push, friction);
    const net = push - fr;                 // resultant force F
    return { fr, net, a: net / m };        // F = m a  so  a = F / m
  },
  // Move the trolley on by a time dt (s). Uses the constant-acceleration
  // equations, which are exact while the forces are constant.
  trolleyStep(x, v, dt, push, m, friction) {
    const f = Physics.trolleyForces(v, push, m, friction);
    let nv = v + f.a * dt, nx;
    if (v > 1e-9 && nv <= 0) {             // friction stops it part-way through the step
      nx = x + v * v / (2 * -f.a);         // stopping distance from v² = 2 a s
      nv = 0;
    } else {
      nx = x + v * dt + 0.5 * f.a * dt * dt;
    }
    return { x: nx, v: nv, fr: f.fr, net: f.net, a: f.a };
  },
  // "Measure" the acceleration the way the practical does: start from rest,
  // run for 1 s and divide the change in velocity by the time taken.
  measureAcceleration(push, m, friction) {
    let x = 0, v = 0;
    for (let i = 0; i < 100; i++) ({ x, v } = Physics.trolleyStep(x, v, 0.01, push, m, friction));
    return v / 1.0;
  },

  /* ---- Falling objects ----
     Air resistance = ½ × air density × drag coefficient × area × v²
     (students do not need this equation; it just makes air resistance
     grow with speed in a realistic way).                                */
  drag(v, shape) {
    return 0.5 * SETTINGS.airDensity * shape.Cd * shape.area * v * v;
  },
  fallAccel(v, m, shape, air) {
    const W = m * SETTINGS.g;                          // W = m g
    const D = air ? Physics.drag(v, shape) : 0;
    return (W - D) / m;                                // a = resultant force / m
  },
  terminalVelocity(m, shape) {                         // where air resistance = weight
    return Math.sqrt(2 * m * SETTINGS.g / (SETTINGS.airDensity * shape.Cd * shape.area));
  },
  // Move a falling object on by dt. o = { y: height above ground (m), v: speed down (m/s) }.
  // Uses small RK4 steps; records the landing time when it reaches the ground.
  fallStep(o, dt, m, shape, air, t0) {
    const f = v => Physics.fallAccel(v, m, shape, air);
    const n = Math.max(1, Math.ceil(dt / 0.002)), h = dt / n;
    for (let i = 0; i < n && !o.landed; i++) {
      const y0 = o.y, v0 = o.v;
      const k1 = f(v0), k2 = f(v0 + k1 * h / 2), k3 = f(v0 + k2 * h / 2), k4 = f(v0 + k3 * h);
      const v1 = v0 + h * (k1 + 2 * k2 + 2 * k3 + k4) / 6;
      const y1 = y0 - h * (v0 + 2 * (v0 + k1 * h / 2) + 2 * (v0 + k2 * h / 2) + (v0 + k3 * h)) / 6;
      if (y1 <= 0) {                                   // hit the ground during this small step
        const frac = y0 / (y0 - y1);
        o.tLand = t0 + (i + frac) * h;
        o.vLand = v0 + (v1 - v0) * frac;
        o.y = 0; o.v = 0; o.landed = true;
      } else { o.y = y1; o.v = v1; }
    }
    o.a = o.landed ? 0 : f(o.v);
    o.D = air && !o.landed ? Physics.drag(o.v, shape) : 0;
    return o;
  },
  // Run a whole drop instantly and return the fall time and landing speed.
  simulateFall(h, m, shape, air) {
    const o = { y: h, v: 0, landed: false };
    let t = 0;
    while (!o.landed && t < 2000) { Physics.fallStep(o, 0.02, m, shape, air, t); t += 0.02; }
    return { t: o.tLand, v: o.vLand };
  },
};

/* =====================================================================
   3. EXPERIMENTS
   ---------------------------------------------------------------------
   Each experiment is added with  register({ ... }).  A finished one has
   status: 'ready' and these parts (copy experiment 1 as a template):

     id, topic, title, equationShort, rp     names shown on screen
     defaults     starting values for every setting
     controls     sliders / drop-downs / buttons (min, max, step, unit)
     ideal        text for the Ideal / Realistic switch (optional)
     compare      text for Compare mode (optional)
     overlays     which arrows / labels can be switched on and off
     graphs       the graph tabs
     keyIdea, mistake, assumptions, equations, predict   teaching text
     table        columns of the results table
     reset()      put the experiment back to time zero
     step(dt)     move the simulation on by dt seconds
     drawDiagram(ctx, w, h, C)   draw the apparatus
     drawGraph(canvas, graphId, C)
     readouts()   numbers shown under the graph
     record()     returns row(s) for the results table (or a message to show)
     finished()   true when the run is over (pressing Start begins again)

   Optional extras:
     settled()    true when the simulation can pause itself (e.g. spring stopped bouncing)
     onParam(key) react when a control changes
     beforeRun()  called each time Start is pressed (e.g. to begin a sweep)
     stepSize     how far one press of Step moves time on (seconds)
     runLabels    names for the run button, e.g. ['▶ Switch on', '⏸ Switch off']
     clock()      text for the clock next to the run buttons

   A planned experiment (status: 'planned') only needs its teaching text
   plus a plan: [...] list; it shows as "Coming soon" on the home screen.
   ===================================================================== */

const EXPERIMENTS = [];
function register(def) { EXPERIMENTS.push(def); }

/* ---------------------------------------------------------------------
   EXPERIMENT 1: FORCES AND ACCELERATION  (F = m a)
   --------------------------------------------------------------------- */
register({
  id: 'fma',
  topic: 'Forces',
  title: 'Forces and acceleration',
  equationShort: 'F = m a',
  status: 'ready',
  rp: 'Required practical 7: Acceleration',
  rpType: 'rp',

  // DEFAULTS: starting values
  defaults: {

    m: 1.0,          // mass of trolley A (kg)
    FB: 4,           // applied force on trolley B in Compare mode (N)
    mB: 2.0,         // mass of trolley B in Compare mode (kg)

  // CONTROLS: change min / max / step to alter the sliders
  controls: [

    realLabel: 'Realistic: friction',
    note: e => e.p.realistic

  },
  compare: { note: 'Trolley B runs on a second track at the same time, with its own force and mass.' },

  overlays: [

    { key: 'vel', label: 'Velocity', on: true },
    { key: 'acc', label: 'Acceleration', on: false },
    { key: 'values', label: 'Values', on: true },
    { key: 'eq', label: 'Equation', on: true },
  ],
  graphs: [
    { id: 'vt', label: 'Velocity–time (live)' },
    { id: 'aF', label: 'a against F (results)' },

  ],

  keyIdea: 'A resultant force makes an object accelerate: a = F ÷ m. A bigger force gives a bigger acceleration; a bigger mass gives a smaller one. If the resultant force is zero, the velocity does not change: the object stays still or keeps moving at a steady speed.',
  mistake: '“A moving object needs a force to keep it moving.” No: a force is needed to <b>change</b> velocity. Real objects slow down because friction is a force acting backwards. Remove the applied force in Ideal mode and the trolley keeps going.',
  assumptions: [
    'The track is level and air resistance is ignored.',
    'Ideal mode has no friction. Realistic mode treats friction as a constant force that acts against the motion, and holds the trolley still if the applied force is not bigger than it.',
    'The applied force stays constant while it is on. In the real practical a falling mass on a string pulls the trolley, and that hanging mass is accelerated too, so the total mass is trolley + hanging mass.',
    'The view follows the trolley. Arrows are drawn to scale: longer arrow = bigger quantity.',
  ],
  equations: [
    { sym: 'F = m a', words: 'resultant force = mass × acceleration', units: 'F in newtons (N) · m in kilograms (kg) · a in metres per second squared (m/s²)' },
    { sym: 'a = Δv ⁄ t', words: 'acceleration = change in velocity ÷ time taken', units: 'a in m/s² · Δv in m/s · t in seconds (s)' },
  ],
  predict: [
    { q: 'We keep the applied force the same but double the mass. What happens to the acceleration?',
      a: 'It halves. a = F ÷ m, so twice the mass gives half the acceleration. Trolley B (2 kg) speeds up half as quickly as trolley A (1 kg). Press Start to check.',
      setup: p => Object.assign(p, { compare: true, realistic: false, F: 4, m: 1, FB: 4, mB: 2 }) },
    { q: 'We keep the mass the same but double the applied force. What happens to the acceleration?',
      a: 'It doubles. For a fixed mass, acceleration is directly proportional to the resultant force. Press Start to compare trolleys A and B.',

    { q: 'The trolley is moving on a track with no friction. We remove the applied force. What happens next?',
      a: 'It keeps moving at a constant velocity. With no resultant force there is no acceleration, so the velocity stays the same. It does not need a force to keep moving. Press Start, then “Remove the applied force”.',
      setup: p => Object.assign(p, { compare: false, realistic: false, F: 4, m: 1 }) },
    { q: 'With friction, the trolley is already moving. We make the applied force exactly equal to the friction. Does it speed up, slow down or keep a steady speed?',
      a: 'Steady speed. The forces are balanced, so the resultant force is zero and the acceleration is zero. Press Start, wait a second, then press “Balance the forces”.',
      setup: p => Object.assign(p, { compare: false, realistic: true, F: 6, friction: 1.5, m: 1 }) },
  ],

  table: {
    columns: [
      { key: 'trolley', label: 'Trolley' },
      { key: 'F', label: 'Applied force F', unit: 'N', fmt: v => fx(v, 1) },
      { key: 'm', label: 'Mass m', unit: 'kg', fmt: v => fx(v, 2) },
      { key: 'inv', label: '1 ⁄ m', unit: '1/kg', fmt: v => fx(v, 2) },
      { key: 'friction', label: 'Friction', unit: 'N', fmt: v => fx(v, 1) },
      { key: 'net', label: 'Resultant force', unit: 'N', fmt: v => fx(v, 1) },
      { key: 'a', label: 'Acceleration a', unit: 'm/s²', fmt: v => sf(v, 2) },
    ],
    hint: 'Record forces to 1 d.p. (N) and masses to 2 d.p. (kg). Give acceleration to 2 significant figures (m/s²). In the lab, repeat each reading at least 3 times and use the mean.',
  },

  // ---- simulation ----
  reset() {
    const lane = () => ({ x: 0, v: 0 });
    this.s = { t: 0, pushOn: true, A: lane(), B: lane(), hist: { A: [[0, 0]], B: [[0, 0]] }, lastSample: 0 };
  },
  lanes() { return this.p.compare ? ['A', 'B'] : ['A']; },
  // The forces on trolley A or B right now.
  forcesFor(k, ignorePushOff) {
    const p = this.p;
    return {
      push: (this.s.pushOn || ignorePushOff) ? (k === 'B' ? p.FB : p.F) : 0,
      m: k === 'B' ? p.mB : p.m,
      friction: p.realistic ? p.friction : 0,
    };
  },
  step(dt) {
    const s = this.s;
    for (const k of this.lanes()) {
      const f = this.forcesFor(k);
      const r = Physics.trolleyStep(s[k].x, s[k].v, dt, f.push, f.m, f.friction);
      s[k].x = r.x; s[k].v = r.v;
    }
    s.t += dt;
    if (s.t - s.lastSample >= 0.04) {
      s.lastSample = s.t;
      for (const k of this.lanes()) s.hist[k].push([s.t, s[k].v]);
    }
  },
  finished() { return this.s.t >= SETTINGS.maxRunTime; },

  drawDiagram(ctx, w, h, C) {
    const s = this.s, ov = this.ov, fs = App.fs, lanes = this.lanes();
    const ppm = w / 9;          // pixels per metre along the track
    const pxPerN = w / 75;      // force arrow length per newton
    const pxPerV = w / 45;      // velocity arrow length per m/s
    const pxPerA = w / 45;      // acceleration arrow length per m/s²
    const lead = Math.max(...lanes.map(k => s[k].x));
    const camX = Math.max(0, lead - 3);            // the view follows the leading trolley
    const sx = x => (x - camX + 1.2) * ppm;
    const laneH = h / lanes.length;

    lanes.forEach((k, i) => {
      const top = i * laneH, groundY = top + laneH - fs * 4.3;   // room under the track for the equation and message
      const st = s[k], f = this.forcesFor(k), fr = Physics.trolleyForces(st.v, f.push, f.m, f.friction);
      const col = k === 'A' ? C.a : C.b;
      if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 2; line(ctx, 0, top, w, top); }

      // track and metre marks
      ctx.fillStyle = C.panel; ctx.fillRect(0, groundY, w, top + laneH - groundY);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 3; line(ctx, 0, groundY, w, groundY);
      ctx.lineWidth = 2; ctx.fillStyle = C.muted; ctx.font = `${fs * 0.8}px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (let m = Math.max(0, Math.floor(camX - 1.2)); sx(m) < w + 20; m++) {
        line(ctx, sx(m), groundY, sx(m), groundY + fs * 0.45);
        ctx.fillText(m === 0 ? 'start' : m + ' m', sx(m), groundY + fs * 0.5);
      }

      // trolley
      const bw = ppm * 0.8, bh = clamp(laneH * 0.17, 18, 44), wr = bh * 0.38;
      const X = sx(st.x), bodyBottom = groundY - wr * 1.7, bodyTop = bodyBottom - bh, midY = bodyTop + bh / 2;
      if (X + bw / 2 < 0) {
        label(ctx, `◀ Trolley ${k} is ${fx(lead - st.x, 1)} m behind`, fs * 0.5, groundY - fs * 1.5, col, { align: 'left' });
      }
      const rWorld = wr / ppm;
      for (const wx of [X - bw * 0.3, X + bw * 0.3]) {
        ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(wx, groundY - wr, wr, 0, Math.PI * 2); ctx.fill();
        const ang = st.x / rWorld;                // wheels turn as the trolley moves
        ctx.strokeStyle = C.bg; ctx.lineWidth = 2;
        line(ctx, wx - Math.cos(ang) * wr * 0.7, groundY - wr - Math.sin(ang) * wr * 0.7, wx + Math.cos(ang) * wr * 0.7, groundY - wr + Math.sin(ang) * wr * 0.7);
      }
      ctx.fillStyle = col; roundRect(ctx, X - bw / 2, bodyTop, bw, bh, 5); ctx.fill();
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
      // slotted masses on top: one for every 0.5 kg
      const n = clamp(Math.round(f.m / 0.5), 1, 10), slotH = clamp(laneH * 0.016, 2.5, 6);
      for (let j = 0; j < n; j++) {
        ctx.fillStyle = C.muted; ctx.fillRect(X - bw * 0.22, bodyTop - (j + 1) * slotH, bw * 0.44, slotH - 1);
      }
      const stackTop = bodyTop - n * slotH;
      ctx.fillStyle = C.bg; ctx.font = `750 ${Math.min(fs * 0.9, bh * 0.6)}px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`${lanes.length > 1 ? k + ' · ' : ''}${fx(f.m, 1)} kg`, X, midY);

      // force arrows (at the trolley's height)
      if (ov.forces) {
        if (s.pushOn) {
          const x1 = X + bw / 2, x2 = x1 + f.push * pxPerN;
          arrow(ctx, x1, midY, x2, midY, C.force, { width: 5, label: ov.values ? `F = ${fx(f.push, 1)} N` : 'applied force', lx: x2 + fs * 1.4, align: 'left' });
          addHandle(ctx, { id: 'F' + k, x: x2, y: midY, r: fs * 1.1, cursor: 'ew-resize',
            onDrag: px => setParam(this, k === 'B' ? 'FB' : 'F', (px - x1) / pxPerN) });
        }
        if (fr.fr > 0) {
          const x1 = X - bw / 2, y = groundY - wr;
          arrow(ctx, x1, y, x1 - fr.fr * pxPerN, y, C.friction, { width: 5, label: ov.values ? `friction ${fx(fr.fr, 1)} N` : 'friction', lx: x1 - fr.fr * pxPerN - fs * 0.4, ly: y - fs * 0.9, align: 'right' });
        }
      }
      // arrows above the trolley: resultant force, velocity, acceleration
      let y = stackTop - fs * 0.9;
      const row = () => { const r = y; y -= fs * 1.4; return r; };
      if (ov.forces) {
        const ry = row();
        if (Math.abs(fr.net) > 1e-9) arrow(ctx, X, ry, X + fr.net * pxPerN, ry, C.resultant, { width: 3, dash: [8, 5], label: ov.values ? `resultant ${fx(fr.net, 1)} N` : 'resultant force', lx: X + fr.net * pxPerN + (fr.net > 0 ? fs * 0.4 : -fs * 0.4), align: fr.net > 0 ? 'left' : 'right' });
        else label(ctx, 'resultant force = 0', X, ry, C.resultant, { fs: fs * 0.85 });
      }
      if (ov.vel) {
        const vy = row(), len = Math.min(st.v * pxPerV, w * 0.55);
        if (st.v > 1e-6) arrow(ctx, X, vy, X + len, vy, C.vel, { width: 5, label: ov.values ? `v = ${fx(st.v, 2)} m/s` : 'velocity', lx: X + len + fs * 0.4, align: 'left' });
        else label(ctx, 'v = 0', X, vy, C.vel, { fs: fs * 0.85 });
      }
      if (ov.acc) {
        const ay = row(), len = clamp(fr.a * pxPerA, -w * 0.4, w * 0.55);
        if (Math.abs(fr.a) > 1e-9) arrow(ctx, X, ay, X + len, ay, C.acc, { width: 4, label: ov.values ? `a = ${fx(fr.a, 2)} m/s²` : 'acceleration', lx: X + len + (len > 0 ? fs * 0.4 : -fs * 0.4), align: len > 0 ? 'left' : 'right' });
        else label(ctx, 'a = 0', X, ay, C.acc, { fs: fs * 0.85 });
      }

      // under the track: the equation with numbers, then a plain-English message
      if (ov.eq) {
        label(ctx, `a = F ÷ m = ${fx(fr.net, 1)} N ÷ ${fx(f.m, 1)} kg = ${fx(fr.a, 2)} m/s²` + (this.p.realistic ? '   (F = resultant force)' : ''),
          fs * 0.5, groundY + fs * 1.95, C.ink, { align: 'left', fs: fs * 0.95 });
      }
      let msg = '';
      if (st.v > 1e-9 && Math.abs(fr.net) < 1e-9) msg = 'Resultant force = 0, so the velocity stays constant';
      else if (st.v <= 1e-9 && f.push > 0 && f.push <= f.friction) msg = 'Applied force is not bigger than friction, so the trolley stays still';
      else if (st.v > 1e-9 && fr.net < 0) msg = 'Friction is bigger than the applied force, so the trolley slows down';
      if (msg) label(ctx, msg, fs * 0.5, groundY + fs * 3.3, C.vel, { align: 'left', fs: fs * 0.95 });
    });
  },

  drawGraph(cv, id, C) {
    const p = this.p, s = this.s, lanes = this.lanes();
    if (id === 'vt') {
      let vmax = 1;
      for (const k of lanes) for (const q of s.hist[k]) vmax = Math.max(vmax, q[1]);
      const series = lanes.map(k => ({
        pts: s.hist[k].concat([[s.t, s[k].v]]), color: k === 'A' ? C.a : C.b, width: 4,
        label: lanes.length > 1 ? `Trolley ${k}` : null,
      }));
      const notes = lanes.map(k => {
        const f = this.forcesFor(k), a = Physics.trolleyForces(s[k].v, f.push, f.m, f.friction).a;
        return { text: `${lanes.length > 1 ? k + ': ' : ''}gradient = acceleration = ${fx(a, 2)} m/s²`, color: k === 'A' ? C.a : C.b };
      });
      notes.push({ text: 'Straight line = constant acceleration. Flat line = constant velocity.', color: C.muted });
      plot(cv, { xLabel: 'Time t (s)', yLabel: 'Velocity v (m/s)', xMax: Math.max(5, Math.ceil(s.t + 0.5)), yMax: niceCeil(vmax * 1.15), series, notes });
      return;
    }
    // Graphs of recorded results: only readings that match the current set-up are used for the line.
    const rows = App.rows[this.id] || [];
    const fr = p.realistic ? p.friction : 0;
    const near = (a, b) => Math.abs(a - b) < 1e-6;
    if (id === 'aF') {
      const pts = rows.map(r => ({ x: r.F, y: r.a, on: near(r.m, p.m) && near(r.friction, fr) }));
      const fitPts = pts.filter(q => q.on && q.y > 0);
      const fit = fitPts.length >= 2 && new Set(fitPts.map(q => q.x)).size >= 2 ? (fr === 0 ? fitOrigin(fitPts) : linFit(fitPts)) : null;
      const yMax = niceCeil(Math.max(1, ...pts.map(q => q.y)) * 1.15);
      const o = { xLabel: 'Applied force F (N)', yLabel: 'Acceleration a (m/s²)', xMax: 20, yMax, notes: [], lines: [],
                  points: pts.map(q => ({ x: q.x, y: q.y, color: q.on ? C.a : C.muted, faded: !q.on })) };
      if (fit) {
        const x0 = fit.c < 0 ? -fit.c / fit.k : 0;
        o.lines.push({ x1: x0, y1: fit.k * x0 + fit.c, x2: 20, y2: fit.k * 20 + fit.c, color: C.a, width: 2.5 });
        o.notes.push({ text: `Gradient = ${sf(fit.k, 3)} m/s² per N`, color: C.a });
        o.notes.push({ text: `Gradient = 1 ÷ m, so m = 1 ÷ ${sf(fit.k, 3)} = ${sf(1 / fit.k, 2)} kg`, color: C.ink });
        o.notes.push(fr === 0
          ? { text: 'Straight line through the origin: a is directly proportional to F', color: C.muted }
          : { text: `Line meets the force axis at ${fx(x0, 1)} N: that is the friction force`, color: C.friction });
      } else o.message = `Record readings at different forces with m = ${fx(p.m, 1)} kg to draw this graph`;
      if (pts.some(q => !q.on)) o.notes.push({ text: 'Faded crosses: other masses or friction', color: C.muted });
      plot(cv, o);
      return;
    }
    if (id === 'am') {
      const pts = rows.map(r => ({ x: r.inv, y: r.a, on: near(r.F, p.F) && near(r.friction, fr) }));
      const fitPts = pts.filter(q => q.on && q.y > 0);
      const fit = fitPts.length >= 2 && new Set(fitPts.map(q => q.x)).size >= 2 ? fitOrigin(fitPts) : null;
      const yMax = niceCeil(Math.max(1, ...pts.map(q => q.y)) * 1.15);
      const o = { xLabel: '1 ⁄ mass (1/kg)', yLabel: 'Acceleration a (m/s²)', xMax: 2, yMax, notes: [], lines: [],
                  points: pts.map(q => ({ x: q.x, y: q.y, color: q.on ? C.a : C.muted, faded: !q.on })) };
      if (fit) {
        o.lines.push({ x1: 0, y1: 0, x2: 2, y2: fit.k * 2, color: C.a, width: 2.5 });
        o.notes.push({ text: `Gradient = resultant force = ${sf(fit.k, 3)} N`, color: C.a });
        o.notes.push({ text: 'Straight line through the origin: a is inversely proportional to m', color: C.muted });
      } else o.message = `Record readings at different masses with F = ${fx(p.F, 1)} N to draw this graph`;
      if (pts.some(q => !q.on)) o.notes.push({ text: 'Faded crosses: other forces or friction', color: C.muted });
      plot(cv, o);
    }
  },

  readouts() {
    const s = this.s, lanes = this.lanes();
    const per = fn => lanes.map(k => { const f = this.forcesFor(k); return fn(k, f, Physics.trolleyForces(s[k].v, f.push, f.m, f.friction)); });
    return {
      cols: lanes.length > 1 ? [{ name: 'A', cls: 'A' }, { name: 'B', cls: 'B' }] : [{ name: '', cls: 'A' }],
      rows: [
        { label: 'Applied force', unit: 'N', vals: per((k, f) => fx(f.push, 1)) },
        { label: 'Friction', unit: 'N', vals: per((k, f, r) => fx(r.fr, 1)) },
        { label: 'Resultant force', unit: 'N', vals: per((k, f, r) => fx(r.net, 1)) },
        { label: 'Acceleration a', unit: 'm/s²', vals: per((k, f, r) => fx(r.a, 2)) },
        { label: 'Velocity v', unit: 'm/s', vals: per(k => fx(s[k].v, 2)) },
        { label: 'Distance', unit: 'm', vals: per(k => fx(s[k].x, 2)) },
      ],
    };
  },

  // Each reading: run the trolley from rest for 1 s and work out a = Δv / t.
  record() {
    return this.lanes().map(k => {
      const f = this.forcesFor(k, true);
      const a = Physics.measureAcceleration(f.push, f.m, f.friction);
      return { trolley: k, F: f.push, m: f.m, inv: 1 / f.m, friction: f.friction, net: a * f.m, a };
    });
  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 2: FREE FALL WITH AND WITHOUT AIR RESISTANCE
   --------------------------------------------------------------------- */
// Object shapes. area = cross-section facing the air (m²), Cd = drag coefficient.
const SHAPES = {
  smallBall: { label: 'Small ball (10 cm across)', area: Math.PI * 0.05 * 0.05, Cd: 0.47 },
  largeBall: { label: 'Large ball (40 cm across)', area: Math.PI * 0.2 * 0.2, Cd: 0.47 },
  parachute: { label: 'Parachute (1 m² canopy)', area: 1.0, Cd: 1.4 },
};
const shapeOptions = Object.keys(SHAPES).map(k => [k, SHAPES[k].label]);

register({
  id: 'fall',
  topic: 'Forces',
  title: 'Free fall and air resistance',
  equationShort: 'W = m g',
  status: 'ready',
  rp: 'Not a required practical (falling objects, terminal velocity)',
  rpType: 'none',

  // DEFAULTS: starting values
  defaults: {
    h: 20,                 // drop height (m)
    mA: 5, shapeA: 'smallBall',
    mB: 0.1, shapeB: 'largeBall',
    realistic: false,      // false = vacuum, true = air

  // ---- simulation ----
  scenarios() { return this.p.compare ? ['vac', 'air'] : [this.p.realistic ? 'air' : 'vac']; },
  objInfo(k) {
    const p = this.p;
    return k === 'A' ? { m: p.mA, shapeKey: p.shapeA, shape: SHAPES[p.shapeA] } : { m: p.mB, shapeKey: p.shapeB, shape: SHAPES[p.shapeB] };
  },
  reset() {
    const s = { t: 0, lastSample: 0, vac: {}, air: {}, hist: { vac: {}, air: {} } };
    this.pred = { vac: {}, air: {} };     // full results worked out in advance, used to fix the graph axes
    for (const sc of ['vac', 'air']) {
      for (const k of ['A', 'B']) {
        const { m, shape } = this.objInfo(k);
        s[sc][k] = { y: this.p.h, v: 0, a: Physics.fallAccel(0, m, shape, sc === 'air'), D: 0, landed: false, tLand: null, vLand: null };
        s.hist[sc][k] = [[0, 0, s[sc][k].a]];
        this.pred[sc][k] = Physics.simulateFall(this.p.h, m, shape, sc === 'air');
      }
    }
    this.s = s;
  },
  step(dt) {
    const s = this.s;
    for (const sc of ['vac', 'air']) {
      for (const k of ['A', 'B']) {
        const o = s[sc][k];
        if (o.landed) continue;
        const { m, shape } = this.objInfo(k);
        Physics.fallStep(o, dt, m, shape, sc === 'air', s.t);
        if (o.landed) s.hist[sc][k].push([o.tLand, o.vLand, Physics.fallAccel(o.vLand, m, shape, sc === 'air')]);
      }
    }
    s.t += dt;
    if (s.t - s.lastSample >= 0.03) {
      s.lastSample = s.t;
      for (const sc of ['vac', 'air']) for (const k of ['A', 'B']) {
        const o = s[sc][k];
        if (!o.landed) s.hist[sc][k].push([s.t, o.v, o.a]);
      }
    }
  },
  finished() { return this.scenarios().every(sc => this.s[sc].A.landed && this.s[sc].B.landed); },

  // The height shown on the ruler jumps in steps so the scale stays steady.
  viewHeightFor(h) { return [10, 20, 30, 50, 75, 100, 120].find(v => v >= h * 1.1) || 120; },

  drawDiagram(ctx, w, h, C) {
    const p = this.p, s = this.s, ov = this.ov, fs = App.fs, scen = this.scenarios();
    const pw = w / scen.length;
    const topY = fs * 3.4, groundY = h - fs * 2.0;
    if (!this.dragging) this.viewH = this.viewHeightFor(p.h);
    const ppm = (groundY - topY) / this.viewH;
    const vScale = (groundY - topY) * 0.45 / Math.sqrt(2 * SETTINGS.g * this.viewH);   // px per m/s
    const Lw = clamp((groundY - topY) * 0.14, 28, 80);                                // weight arrow length
    const lfs = scen.length > 1 ? fs * 0.8 : fs * 0.9;

    scen.forEach((sc, i) => {
      const x0 = i * pw, air = sc === 'air';
      if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, x0, 0, x0, h); }
      ctx.fillStyle = C.ground; ctx.fillRect(x0, groundY, pw, h - groundY);
      let title = air ? 'Air' : 'Vacuum: no air';
      if (ov.eq) title += air ? ':  a = (W − air resistance) ÷ m' : ':  a = W ÷ m = g';
      label(ctx, title, x0 + pw / 2, fs * 0.95, C.ink, { fs: fs * (scen.length > 1 ? 0.9 : 1.05), weight: 750 });

      // ruler
      const rx = x0 + fs * 3.0, step = niceStep(this.viewH, 5);
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; line(ctx, rx, groundY, rx, groundY - this.viewH * ppm);
      ctx.fillStyle = C.muted; ctx.font = `${fs * 0.8}px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      for (let m = 0; m <= this.viewH + 1e-6; m += step) {
        const y = groundY - m * ppm;
        line(ctx, rx - fs * 0.4, y, rx, y); ctx.fillText(m + ' m', rx - fs * 0.5, y);
      }
      // release height
      const ry = groundY - p.h * ppm;
      ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]); line(ctx, rx, ry, x0 + pw, ry); ctx.setLineDash([]);
      if (i === 0) label(ctx, `h = ${fx(p.h, 0)} m`, rx + fs * 0.4, ry - fs * 0.8, C.ink, { align: 'left', fs: lfs });

      ['A', 'B'].forEach((k, j) => {
        const { m, shapeKey, shape } = this.objInfo(k), o = s[sc][k], col = k === 'A' ? C.a : C.b;
        const cx = x0 + pw * (j ? 0.75 : 0.45);
        const r = shapeKey === 'largeBall' ? fs * 1.5 : shapeKey === 'parachute' ? fs * 0.55 : fs * 0.75;
        const cy = groundY - o.y * ppm - r;
        label(ctx, `${k}: ${fx(m, 1)} kg`, cx, fs * 2.3, col, { fs: lfs, weight: 750 });
        // the object
        ctx.fillStyle = col; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        let topOfObj = cy - r;
        if (shapeKey === 'parachute') {
          const cw = fs * 2.0, ch = fs * 1.2, canY = cy - fs * 2.2;
          ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
          line(ctx, cx, cy - r, cx - cw, canY); line(ctx, cx, cy - r, cx + cw, canY); line(ctx, cx, cy - r, cx, canY);
          ctx.fillStyle = col; ctx.globalAlpha = 0.55;
          ctx.beginPath(); ctx.ellipse(cx, canY, cw, ch, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
          ctx.globalAlpha = 1; ctx.lineWidth = 2; ctx.stroke();
          topOfObj = canY - ch;
        }
        if (o.landed) {
          label(ctx, `landed: ${fx(o.tLand, 2)} s`, cx, groundY + fs * 1.0, col, { fs: lfs, weight: 750 });
        } else {
          const W = m * SETTINGS.g;
          if (ov.forces) {
            arrow(ctx, cx, cy + r, cx, cy + r + Lw, C.force, { width: 4, label: ov.values ? `W ${sf(W, 2)} N` : 'weight', lx: cx - fs * 0.5, ly: cy + r + Lw * 0.6, align: 'right', fs: lfs });
            if (air && o.D > 1e-6) {
              const dl = Lw * Math.min(o.D / W, 1.05);
              // no label on arrows too short to see
              arrow(ctx, cx, topOfObj, cx, topOfObj - dl, C.friction, { width: 4, label: dl < fs * 0.6 ? '' : ov.values ? `air res. ${sf(o.D, 2)} N` : 'air resistance', lx: cx - fs * 0.5, ly: topOfObj - dl * 0.6, align: 'right', fs: lfs });
            }
          }
          if (ov.vel && o.v > 1e-3) {
            const vx = cx + r + fs * 0.6;
            arrow(ctx, vx, cy, vx, cy + o.v * vScale, C.vel, { width: 4, label: ov.values ? `v ${fx(o.v, 1)} m/s` : 'velocity', lx: vx + fs * 0.3, ly: cy + o.v * vScale * 0.5, align: 'left', fs: lfs });
          }
          if (ov.acc && o.a > 1e-3) {
            const ax = cx + r + fs * (ov.vel ? 1.6 : 0.6), al = o.a / SETTINGS.g * Lw;
            arrow(ctx, ax, cy, ax, cy + al, C.acc, { width: 3, label: ov.values ? `a ${fx(o.a, 1)} m/s²` : 'acceleration', lx: ax + fs * 0.3, ly: cy - fs * 0.6, align: 'left', fs: lfs });
          }
        }
        // drag an object up or down to change the drop height (only before the drop starts)
        if (s.t === 0 && !App.running) {
          addHandle(ctx, { id: 'drop' + sc + k, x: cx, y: cy, r: r + 8, cursor: 'ns-resize',
            start: () => { this.dragging = true; },
            end: () => { this.dragging = false; },
            onDrag: (px, py) => { setParam(this, 'h', (groundY - py - r) / ppm); this.reset(); } });
        }
      });
    });
  },

  drawGraph(cv, id, C) {
    const p = this.p, s = this.s, scen = this.scenarios(), cmp = scen.length > 1;
    let tMax = 1, vMax = 1;

        pts, color: k === 'A' ? C.a : C.b,
        width: vac && !cmp ? (k === 'A' ? 8 : 3) : (vac ? 4 : 4),
        dash: vac && (cmp || k === 'B') ? (k === 'A' ? [14, 8] : [6, 10]) : null,
        label: `${k}${cmp ? (vac ? ' in vacuum' : ' in air') : ''}${vac && !cmp && k === 'B' ? ' (on top of A)' : ''}`,

      if (scen.includes('vac')) notes.push({ text: `Vacuum: straight line, gradient = acceleration = ${fx(SETTINGS.g, 1)} m/s² (= g)`, color: C.ink });
      if (scen.includes('air')) {
        for (const k of ['A', 'B']) {
          const { m, shape } = this.objInfo(k), vT = Physics.terminalVelocity(m, shape);
          if (vT < yMax) lines.push({ x1: 0, y1: vT, x2: tMax, y2: vT, color: k === 'A' ? C.a : C.b, dash: [3, 6], label: `terminal velocity ${k} = ${sf(vT, 2)} m/s` });
        }
        notes.push({ text: 'Air: the curve flattens as air resistance grows', color: C.ink });
      }
      plot(cv, { xLabel: 'Time t (s)', yLabel: 'Velocity v (m/s)', xMax: tMax, yMax, series, notes, lines });
    } else {
      notes.push({ text: 'In air, acceleration falls to zero at terminal velocity', color: C.ink });
      plot(cv, { xLabel: 'Time t (s)', yLabel: 'Acceleration a (m/s²)', xMax: tMax, yMax: 15, series, notes });
    }
  },

  readouts() {
    const s = this.s, scen = this.scenarios(), cmp = scen.length > 1;
    const cols = [], objs = [];
    for (const sc of scen) for (const k of ['A', 'B']) {
      cols.push({ name: cmp ? `${k} ${sc === 'vac' ? 'vac' : 'air'}` : k, cls: k });
      objs.push({ o: s[sc][k], info: this.objInfo(k) });

    return {
      cols,
      rows: [
        { label: 'Velocity v', unit: 'm/s', vals: objs.map(q => q.o.landed ? 'landed' : fx(q.o.v, 1)) },
        { label: 'Acceleration a', unit: 'm/s²', vals: objs.map(q => fx(q.o.a, 1)) },
        { label: 'Weight W = m g', unit: 'N', vals: objs.map(q => sf(q.info.m * SETTINGS.g, 2)) },
        { label: 'Air resistance', unit: 'N', vals: objs.map(q => sf(q.o.D, 2)) },
        { label: 'Fall time', unit: 's', vals: objs.map(q => q.o.landed ? fx(q.o.tLand, 2) : '—') },

  },

  record() {
    const rows = [];
    for (const sc of this.scenarios()) for (const k of ['A', 'B']) {
      const { m, shape } = this.objInfo(k), r = Physics.simulateFall(this.p.h, m, shape, sc === 'air');
      rows.push({ obj: k, m, shape: shape.label.split(' (')[0], mode: sc === 'air' ? 'air' : 'vacuum', h: this.p.h, t: r.t, v: r.v });
    }
    return rows;
  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 3: HOOKE'S LAW  (F = k e)
   --------------------------------------------------------------------- */
// The springs. k = spring constant (N/m), lop = force at the limit of
// proportionality (N), L0 = original length (m).
const SPRINGS = {
  soft: { label: 'Spring A: soft (k = 20 N/m)', short: 'A (soft)', k: 20, lop: 5, L0: 0.15 },
  stiff: { label: 'Spring B: stiff (k = 40 N/m)', short: 'B (stiff)', k: 40, lop: 8, L0: 0.15 },
};
const SLOTTED_MASS = 0.1;   // kg: each slotted mass is 100 g
const MAX_MASSES = 12;      // how many slotted masses there are

Object.assign(Physics, {
  /* Extension e (m) of a spring with a force F (N) on it.
     Up to the limit of proportionality: e = F / k (Hooke's law).
     Beyond it the spring stretches more for each newton, so the graph curves.
     Fmax = the biggest force the spring has ever had. Past the elastic limit
     (1.2 × the limit of proportionality) the spring stays permanently stretched. */
  springExtension(F, spring, Fmax = 0) {
    const { k, lop } = spring, extra = 0.5 / (k * lop);
    const loading = f => f / k + (f > lop ? extra * (f - lop) * (f - lop) : 0);
    if (Fmax > Physics.elasticLimit(spring) && F < Fmax) return loading(Fmax) - Fmax / k + F / k;
    return loading(F);
  },
  elasticLimit(spring) { return 1.2 * spring.lop; },
});
