    // side j: 0 = right (towards detector), 1 = bottom, 2 = left, 3 = top
    const sides = [[L + S - band, T, band, S], [L, T + S - band, S, band], [L, T, band, S], [L, T, S, band]];
    const out = [[1, 0], [0, 1], [-1, 0], [0, -1]];
    for (let j = 0; j < 4; j++) {
      const sf_ = SURFACES[(face + j) % 4], [x, y, wd, ht] = sides[j];
      this.drawFaceBand(ctx, sf_, x, y, wd, ht, C);
      const mx = x + wd / 2, my = y + ht / 2, [ox, oy] = out[j];
      if (j === 0) label(ctx, `${sf_.label} (facing the detector)`, L + S, T - fs * 0.9, C.ink, { align: 'left', fs: fs * 0.8, weight: 800 });
      else label(ctx, sf_.label, mx + ox * fs * 3.2, my + oy * fs * 1.0, C.ink, { fs: fs * 0.8, weight: 750 });
      if (ov.ir && j !== 0) {
        const len = fs * (0.8 + 3.5 * sf_.eps * (p.T - ROOM_TEMP) / 75);
        for (const off of [-0.25, 0.25]) {
          const sx = mx + ox * band * 0.6 + (oy ? 0 : 0) + (ox ? 0 : off * S), sy = my + oy * band * 0.6 + (ox ? off * S : 0);
          wavyArrow(ctx, sx, sy, sx + ox * len, sy + oy * len, C.force, { width: 2 });
        }
      }
      addHandle(ctx, { id: 'face' + j, x: mx, y: my, r: fs * 1.2, cursor: 'pointer',
        start: () => { if (j) { p.face = String((face + j) % 4); syncControls(); updateReadouts(); } } });
    }
    // detector
    const pxPerCm = (w * 0.93 - (L + S) - fs * 3) / 30, dx = L + S + p.d * pxPerCm, reading = this.detector(face);
    if (ov.ir) {
      const n = Math.max(1, Math.round(1 + 4 * SURFACES[face].eps));
      for (let k = 0; k < n; k++) {
        const yy = cy + (k - (n - 1) / 2) * fs * 0.9;
        wavyArrow(ctx, L + S + 4, yy, dx - 4, cy + (k - (n - 1) / 2) * fs * 0.35, C.force, { width: 2 });
      }
    }
    ctx.fillStyle = C.panel2; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(dx, cy - fs * 0.6); ctx.lineTo(dx + fs * 1.2, cy - fs * 1.1); ctx.lineTo(dx + fs * 1.2, cy + fs * 1.1); ctx.lineTo(dx, cy + fs * 0.6); ctx.closePath(); ctx.fill(); ctx.stroke();
    roundRect(ctx, dx + fs * 1.2, cy - fs * 1.2, fs * 2.6, fs * 2.4, 5); ctx.fill(); ctx.stroke();
    label(ctx, 'IR detector', dx + fs * 2.5, cy + fs * 2.0, C.muted, { fs: fs * 0.8 });
    if (ov.values) label(ctx, `${fx(reading, 1)} W/m²`, dx + fs * 2.5, cy - fs * 2.2, C.ink, { fs: fs * 1.2, weight: 800 });
    // distance marker
    ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); line(ctx, L + S, cy + S / 2 + fs * 0.8, dx, cy + S / 2 + fs * 0.8); ctx.setLineDash([]);
    label(ctx, `${p.d} cm`, (L + S + dx) / 2, cy + S / 2 + fs * 0.8, C.muted, { fs: fs * 0.85 });
    addHandle(ctx, { id: 'detector', x: dx + fs * 1.6, y: cy, r: fs * 1.6, cursor: 'ew-resize',
      onDrag: px => setParam(this, 'd', (px - fs * 1.6 - (L + S)) / pxPerCm) });
    label(ctx, 'Click a face to turn it towards the detector. Drag the detector to change the distance.', w / 2, h - fs * 0.8, C.muted, { fs: fs * 0.78 });
  },
  drawAbsorb(ctx, w, h, C, fs, ov, p) {
    const cx = w / 2, top = h * 0.14, bot = h * 0.86, D = w * 0.24, ph = (bot - top) * 0.4;
    label(ctx, 'Absorption: four plates face a radiant heater', cx, fs * 0.9, C.ink, { weight: 800, fs: fs * 0.9 });
    // heater
    const glow = ctx.createLinearGradient(cx - fs, 0, cx + fs, 0);
    glow.addColorStop(0, 'rgba(255,90,20,0)'); glow.addColorStop(0.5, `rgba(255,90,20,${0.4 + 0.12 * p.heater})`); glow.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = glow; ctx.fillRect(cx - fs * 2, top, fs * 4, bot - top);
    ctx.fillStyle = '#ff5a1f'; ctx.fillRect(cx - fs * 0.4, top, fs * 0.8, bot - top);
    label(ctx, `heater (setting ${p.heater})`, cx, bot + fs * 0.9, C.ink, { fs: fs * 0.8 });
    SURFACES.forEach((sf_, j) => {
      const side = j < 2 ? -1 : 1, px = cx + side * D, py = top + (j % 2) * (bot - top) * 0.52;
      const T = this.s.plate[sf_.key], faceX = px - side * fs * 0.3;
      // plate: surface faces the heater, back is plain metal with wax and a pin
      this.drawFaceBand(ctx, sf_, side < 0 ? px : px - fs * 0.6, py, fs * 0.6, ph, C);
      const backX = side < 0 ? px - fs * 0.25 : px + fs * 0.05;
      ctx.fillStyle = C.muted; ctx.fillRect(backX, py, fs * 0.25, ph);
      const fell = this.s.fell[sf_.key], waxX = side < 0 ? backX - fs * 0.45 : backX + fs * 0.25 + fs * 0.45, waxY = py + ph * 0.5;
      if (fell === null) {
        ctx.fillStyle = '#f2e3a0'; ctx.beginPath(); ctx.arc(waxX, waxY, fs * 0.45, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = C.ink; ctx.lineWidth = 2; line(ctx, waxX, waxY, waxX + side * fs * 1.0, waxY);
      } else {
        const drop = Math.min(bot - waxY, fs * 0.5 * Math.pow((this.s.t - fell) / 4, 2) + 2);
        ctx.strokeStyle = C.ink; ctx.lineWidth = 2; line(ctx, waxX, waxY + drop, waxX + side * fs * 1.0, waxY + drop + fs * 0.3);
      }
      if (ov.ir) {
        const n = 3;
        for (let k = 0; k < n; k++) {
          const yy = py + ph * (k + 0.5) / n;
          wavyArrow(ctx, cx - side * -fs * 0.6 * 1, yy, faceX + side * fs * 0.5 * -1, yy, C.force, { width: 2 });
          if (1 - sf_.eps > 0.3) wavyArrow(ctx, faceX - side * fs * 0.8, yy + fs * 0.4, faceX - side * (fs * 0.8 + D * 0.45 * (1 - sf_.eps)), yy + fs * 1.0, C.friction, { width: 2 });
        }
      }
      const lx = side < 0 ? px - fs * 3.2 : px + fs * 3.2;
      label(ctx, sf_.label, lx, py + fs * 0.4, C.ink, { fs: fs * 0.8, weight: 800 });
      if (ov.values) label(ctx, `${fx(T, 1)} °C${fell !== null ? ' · pin fell' : ''}`, lx, py + fs * 1.8, fell !== null ? C.force : C.ink, { fs: fs * 0.8 });
    });
    if (ov.ir) label(ctx, 'red: infrared from the heater · purple: infrared reflected', cx, h - fs * 0.6, C.muted, { fs: fs * 0.75 });
  },

  drawGraph(cv, id, C) {
    const p = this.p, rows = App.rows[this.id] || [];
    if (p.mode === 'emit') {
      const latest = {};
      for (const r of rows) if (r.test === 'emission') latest[r.surface] = r.reading;
      const bars = SURFACES.map((sf_, j) => ({ x: j + 1, y: latest[sf_.label] || 0, width: 0.6, color: sf_.key === 'shinySilver' ? C.muted : sf_.key === 'mattWhite' ? C.b : C.a,
                                                label: latest[sf_.label] !== undefined ? fx(latest[sf_.label], 1) : '' }));
      const model = SURFACES.map(sf_ => Physics.irReading(sf_.eps, p.T, p.d / 100));
      const o = { xLabel: 'Surface facing the detector', yLabel: 'Detector reading (W/m²)', xMin: 0.4, xMax: 4.6,
        yMax: niceCeil(Math.max(5, ...model, ...bars.map(b => b.y)) * 1.2), bars, xTicks: SURFACES.map((s, j) => [j + 1, s.label]), points: [], notes: [] };
      o.points.push({ x: +p.face + 1, y: this.detector(+p.face), color: C.force, dot: true, label: 'now' });
      if (this.ov.model) SURFACES.forEach((s, j) => o.points.push({ x: j + 1, y: model[j], color: C.ink }));
      o.notes.push({ text: 'Record a reading for each face to build the bar chart', color: C.muted });
      plot(cv, o);

    }
    plot(cv, { xLabel: 'Time (s)', yLabel: 'Plate temperature (°C)', xMax: 600, yMin: ROOM_TEMP, yMax: niceCeil(ROOM_TEMP + this.heaterI() * PLATE.area / PLATE.h + 5),
      series: SURFACES.map(sf_ => ({ pts: this.s.hist[sf_.key].concat([[this.s.t, this.s.plate[sf_.key]]]), label: sf_.label, width: 3,
        color: sf_.key === 'mattBlack' ? C.a : sf_.key === 'shinyBlack' ? C.acc : sf_.key === 'mattWhite' ? C.b : C.muted })),
      lines: [{ x1: 0, y1: PLATE.melt, x2: 600, y2: PLATE.melt, color: C.force, dash: [5, 5], label: 'wax melts (50 °C)' }],
      notesRight: true, notes: [{ text: 'Better absorber → heats up faster', color: C.ink }] });
  },

  readouts() {
    const p = this.p;
    if (p.mode === 'emit') {
      return { cols: [{ name: '' }], rows: [
        { label: 'Water temperature', unit: '°C', vals: [fx(p.T, 0)] },
        { label: 'Face towards detector', unit: '', vals: [SURFACES[+p.face].label] },
        { label: 'Emitting ability (0–1)', unit: '', vals: [fx(SURFACES[+p.face].eps, 2)] },
        { label: 'Distance', unit: 'cm', vals: [fx(p.d, 0)] },
        { label: 'Detector reading', unit: 'W/m²', vals: [fx(this.detector(+p.face), 1)] },
      ] };
    }
    return {
      cols: SURFACES.map(s => ({ name: s.label })),
      rows: [
        { label: 'Time', unit: 's', vals: [fx(this.s.t, 0)] },
        { label: 'Plate temperature', unit: '°C', vals: SURFACES.map(s => fx(this.s.plate[s.key], 1)) },
        { label: 'Pin fell at', unit: 's', vals: SURFACES.map(s => this.s.fell[s.key] === null ? '—' : fx(this.s.fell[s.key], 0)) },

  },

  record() {
    const p = this.p;
    if (p.mode === 'emit') {
      const sf_ = SURFACES[+p.face];
      return [{ test: 'emission', surface: sf_.label, T: p.T, d: p.d, reading: this.detector(+p.face) }];
    }
    return SURFACES.map(sf_ => ({ test: 'absorption', surface: sf_.label, T: this.s.plate[sf_.key], t: this.s.t }));
  },
});

const DENSITY_MATERIALS = {
  aluminium: { label: 'Aluminium', rho: 2.70, color: '#a9b4c2' },
  steel: { label: 'Steel', rho: 7.85, color: '#7b8088' },
  copper: { label: 'Copper', rho: 8.96, color: '#c8743a' },
  lead: { label: 'Lead', rho: 11.3, color: '#59606b' },
  glass: { label: 'Glass', rho: 2.50, color: '#8fd1c3' },
  stone: { label: 'Stone (granite)', rho: 2.65, color: '#8f8a80' },
  plastic: { label: 'Acrylic plastic', rho: 1.18, color: '#e7a7c9' },

const CYLINDER = { start: 200, max: 500 };   // cm³: water at the start, and the size of the measuring cylinder

Object.assign(Physics, {
  density(m, V) { return m / V; },                 // ρ = m ÷ V
  // Volume of water pushed aside. A floating object only pushes aside its own mass of water
  // (1 g of water = 1 cm³), unless it is pushed right under.
  displaced(V, rho, pushedUnder) { return rho < 1 && !pushedUnder ? V * rho / 1.0 : V; },
});

  drawObject(ctx, k, x, yb, k_, C, fit) {

      ctx.fillStyle = C.panel2; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;

      ctx.fillStyle = '#0b2'; ctx.font = `800 ${fs * 0.95}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      ctx.beginPath(); ctx.moveTo(cylX - cw / 2, cTop); ctx.lineTo(cylX - cw / 2, benchY); ctx.lineTo(cylX + cw / 2, benchY); ctx.lineTo(cylX + cw / 2, cTop); ctx.stroke();
      ctx.fillStyle = C.muted; ctx.font = `${fs * 0.7}px ${FONT}`; ctx.textAlign = 'left';
      for (let v = 0; v <= CYLINDER.max; v += 10) {

  drawGraph(cv, id, C) {

  readouts() {

      rows: [
        { label: 'Mass m (from balance)', unit: 'g', vals: per(st => st.mass === null ? 'not weighed' : fx(st.mass, 1)) },
        { label: 'Volume V', unit: 'cm³', vals: per(st => st.vol === null ? 'not measured' : fx(st.vol, 1)) },
        { label: 'Density ρ = m ÷ V', unit: 'g/cm³', vals: per(st => st.mass !== null && st.vol ? fx(st.mass / st.vol, 2) : '—') },

  record() {
    const out = [];
    for (const k of this.lanes()) {
      const st = this.s[k];

  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 13: RESISTANCE OF A WIRE  (V = I R)
   --------------------------------------------------------------------- */
// rho = resistivity (Ω m), alpha = how much resistance rises per °C (only matters in Realistic mode)
const WIRE_MATERIALS = {
  constantan: { label: 'Constantan', rho: 4.9e-7, alpha: 0.00001 },
  nichrome: { label: 'Nichrome', rho: 1.1e-6, alpha: 0.0004 },
  copper: { label: 'Copper', rho: 1.7e-8, alpha: 0.0039 },
};
const WIRE_RS = 2;          // Ω: protective resistor in series, so the current never gets too big
const WIRE_CONTACT = 0.15;  // Ω: resistance where the crocodile clips touch the wire (Realistic mode)

Object.assign(Physics, {
  // R = ρ L ⁄ A, with A = π d² ⁄ 4. L in m, d in mm. (Not on the AQA equation sheet.)
  wireR(rho, Lm, dmm) { const r = dmm / 2000; return rho * Lm / (Math.PI * r * r); },
  // Readings from the circuit: supply Vs in series with the protective resistor and the wire.
  wireCircuit(mat, Lm, dmm, Vs, real) {
    const R0 = Physics.wireR(mat.rho, Lm, dmm);
    let R = R0, I = Vs / (R + WIRE_RS);
    if (real) {
      for (let i = 0; i < 6; i++) {                      // the wire warms up a little, then add the contact resistance
        const dT = 40 * I * I * R0 / Math.max(Lm, 0.05);
        R = R0 * (1 + mat.alpha * dT) + WIRE_CONTACT;
        I = Vs / (R + WIRE_RS);
      }
    }
    return { R, R0, I, V: I * R };
  },
});

          o.lines.push({ x1: 0, y1: fit.c, x2: 100, y2: fit.k * 100 + fit.c, color: col, width: 2.5 });

        }
        const now = this.reading(k);
        o.points.push({ x: p.L, y: now.V / now.I, color: col, dot: true });
      }
      o.notes.push({ text: p.realistic ? 'Straight line, shifted up by the contact resistance' : 'Straight line through the origin: R ∝ L (double the length, double R)', color: C.muted });
      if (!rows.length) o.message = 'Press “Measure 10 → 100 cm” or record readings at several lengths';
    } else if (id === 'Rd') {
      const Lm = p.L / 100, yTop = Physics.wireR(mat.rho, Lm, 0.2);
      Object.assign(o, { xLabel: 'Diameter d (mm)', xMax: 1, yMax: niceCeil(yTop * 1.1) });
      const pts = [];
      for (let d = 0.2; d <= 1.0001; d += 0.01) pts.push([d, Physics.wireR(mat.rho, Lm, d)]);
      o.series.push({ pts, color: C.muted, width: 2, dash: [6, 5], label: `R = ρL ÷ A for L = ${p.L} cm` });
      for (const r of rows.filter(r => Math.abs(r.L - p.L) < 1e-9)) o.points.push({ x: r.d, y: r.R, color: C.acc });
      for (const k of lanes) { const now = this.reading(k); o.points.push({ x: this.dOf(k), y: now.V / now.I, color: k === 'A' ? C.a : C.b, dot: true }); }
      o.notes.push({ text: 'A curve, NOT a straight line: R ∝ 1 ÷ d²', color: C.ink }, { text: 'Double the diameter → a quarter of the resistance', color: C.ink });
    } else {
      const Lm = p.L / 100, Amin = Math.PI * 0.1 * 0.1;     // mm² for d = 0.2 mm
      Object.assign(o, { xLabel: '1 ÷ area (1/mm²)', xMax: niceCeil(1 / Amin), yMax: niceCeil(Physics.wireR(mat.rho, Lm, 0.2) * 1.1) });
      o.lines.push({ x1: 0, y1: 0, x2: o.xMax, y2: o.xMax * mat.rho * Lm * 1e6, color: C.muted, dash: [6, 5], label: 'gradient = ρ L' });
      for (const r of rows.filter(r => Math.abs(r.L - p.L) < 1e-9)) o.points.push({ x: 4 / (Math.PI * r.d * r.d), y: r.R, color: C.acc });
      for (const k of lanes) { const now = this.reading(k), d = this.dOf(k); o.points.push({ x: 4 / (Math.PI * d * d), y: now.V / now.I, color: k === 'A' ? C.a : C.b, dot: true }); }
      o.notes.push({ text: 'Straight line through the origin: R ∝ 1 ÷ A', color: C.ink }, { text: 'Half the area (thinner wire) → double the resistance', color: C.ink });
    }
    plot(cv, o);
  },

  readouts() {
    const lanes = this.lanes(), per = fn => lanes.map(k => fn(this.reading(k), this.dOf(k)));
    return {
      cols: lanes.length > 1 ? [{ name: 'A', cls: 'A' }, { name: 'B', cls: 'B' }] : [{ name: '', cls: 'A' }],
      rows: [
        { label: 'Length L', unit: 'cm', vals: [fx(this.p.L, 0)] },
        { label: 'Diameter d', unit: 'mm', vals: per((r, d) => fx(d, 2)) },
        { label: 'Area A = π d² ÷ 4', unit: 'mm²', vals: per((r, d) => sf(Math.PI * d * d / 4, 3)) },
        { label: 'p.d. V', unit: 'V', vals: per(r => fx(r.V, 2)) },
        { label: 'Current I', unit: 'A', vals: per(r => fx(r.I, 2)) },
        { label: 'Resistance R = V ÷ I', unit: 'Ω', vals: per(r => sf(r.V / r.I, 3)) },

  },

  record() {
    return this.lanes().map(k => { const r = this.reading(k); return { mat: WIRE_MATERIALS[this.p.mat].label, L: this.p.L, d: this.dOf(k), V: r.V, I: r.I, R: r.V / r.I, real: this.p.realistic }; });
  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 14: WAVES IN A RIPPLE TANK  (v = f λ)
   --------------------------------------------------------------------- */
// Tank size (m), wave speeds in deep and shallow water (m/s), and where the shallow region starts (m from the dipper).
const RIPPLE = { W: 0.40, H: 0.30, vDeep: 0.30, vShallow: 0.18, yb: 0.16 };

Object.assign(Physics, {
  // Wave direction after crossing into shallow water: sin θ₂ = (v₂ ÷ v₁) sin θ₁ (angles from the normal).
  rippleRefract(theta1, v1, v2) { return Math.asin(Math.sin(theta1 * DEG) * v2 / v1) / DEG; },
});
// Keep only the part of a polygon where n · p ≥ c (used to split the tank at the boundary).
function clipPoly(poly, n, c) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = n[0] * a[0] + n[1] * a[1] - c, db = n[0] * b[0] + n[1] * b[1] - c;
    if (da >= 0) out.push(a);
    if ((da >= 0) !== (db >= 0)) { const t = da / (da - db); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  }
  return out;
}

  step(dt) { this.s.t += dt; },

  tDraw(f) { return this.p.strobe === 'freeze' ? 0 : this.p.strobe === 'slow' ? this.s.t * 0.5 / f : this.s.t; },
  // Geometry of the boundary and both wave directions (all in metres).
  waveGeom(f) {
    const th = (this.p.shallow === 'on' ? this.p.angle : 0) * DEG;
    const tHat = [Math.cos(th), Math.sin(th)], nHat = [-Math.sin(th), Math.cos(th)], p0 = [RIPPLE.W / 2, RIPPLE.yb];
    const K1 = 2 * Math.PI * f / RIPPLE.vDeep, K2 = 2 * Math.PI * f / RIPPLE.vShallow;
    const k1 = [0, K1], k1t = k1[0] * tHat[0] + k1[1] * tHat[1], k2n = Math.sqrt(K2 * K2 - k1t * k1t);
    const k2 = [k1t * tHat[0] + k2n * nHat[0], k1t * tHat[1] + k2n * nHat[1]];
    return { th, tHat, nHat, p0, K1, K2, k1, k2, lam1: RIPPLE.vDeep / f, lam2: RIPPLE.vShallow / f,
             theta1: th / DEG, theta2: Physics.rippleRefract(th / DEG, RIPPLE.vDeep, RIPPLE.vShallow) };
  },
  // Wave height (−1 to 1) at point (x, y) in metres.
  heightAt(f, x, y, tt) {
    const g = this.waveGeom(f), w = 2 * Math.PI * f;
    const deep = this.p.shallow !== 'on' || (x - g.p0[0]) * g.nHat[0] + (y - g.p0[1]) * g.nHat[1] < 0;
    if (deep) return Math.cos(w * tt - g.K1 * y);
    const c = (g.k2[0] - g.k1[0]) * g.p0[0] + (g.k2[1] - g.k1[1]) * g.p0[1];
    return Math.cos(w * tt - (g.k2[0] * x + g.k2[1] * y) + c);
  },

  drawDiagram(ctx, w, h, C) {
    const lanes = this.lanes(), lw = w / lanes.length;
    lanes.forEach((k, i) => this.drawTank(ctx, k, i * lw, lw, h, C, i));
  },
  drawTank(ctx, k, x0, lw, h, C, i) {
    const fs = App.fs, ov = this.ov, p = this.p, f = this.fOf(k), tt = this.tDraw(f), g = this.waveGeom(f);
    if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, x0, 0, x0, h); }
    const top = fs * 2.6, avW = lw - fs * 1.6, avH = h - top - fs * 1.8;
    const ppm = Math.min(avW / RIPPLE.W, avH / RIPPLE.H), TW = RIPPLE.W * ppm, TH = RIPPLE.H * ppm, left = x0 + (lw - TW) / 2;
    const X = x => left + x * ppm, Y = y => top + y * ppm;
    const path = poly => { ctx.beginPath(); poly.forEach((q, j) => j ? ctx.lineTo(X(q[0]), Y(q[1])) : ctx.moveTo(X(q[0]), Y(q[1]))); ctx.closePath(); };
    const rect = [[0, 0], [RIPPLE.W, 0], [RIPPLE.W, RIPPLE.H], [0, RIPPLE.H]];
    const c0 = g.nHat[0] * g.p0[0] + g.nHat[1] * g.p0[1];
    const deepPoly = p.shallow === 'on' ? clipPoly(rect, [-g.nHat[0], -g.nHat[1]], -c0) : rect;
    const shallowPoly = p.shallow === 'on' ? clipPoly(rect, g.nHat, c0) : [];
    ctx.fillStyle = '#1f5f86'; path(rect); ctx.fill();
    if (shallowPoly.length) { ctx.fillStyle = '#3b86b0'; path(shallowPoly); ctx.fill(); }
    // crests (bright) and troughs (dark), drawn as lines in each region
    const drawLines = (poly, dir, lam, s0) => {
      if (poly.length < 3) return;
      ctx.save(); path(poly); ctx.clip();
      const proj = rect.map(q => q[0] * dir[0] + q[1] * dir[1]), smin = Math.min(...proj), smax = Math.max(...proj);
      const u = [-dir[1], dir[0]], big = RIPPLE.W + RIPPLE.H;
      let s = s0 - Math.ceil((s0 - smin) / lam + 1) * lam;
      for (; s <= smax + lam; s += lam) {
        for (const [off, col, wd] of [[0, 'rgba(255,255,255,0.8)', 0.22], [lam / 2, 'rgba(0,10,40,0.45)', 0.18]]) {
          const ss = s + off, cx = dir[0] * ss, cy = dir[1] * ss;
          ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, lam * ppm * wd);
          line(ctx, X(cx - u[0] * big), Y(cy - u[1] * big), X(cx + u[0] * big), Y(cy + u[1] * big));
        }
      }
      ctx.restore();
    };
    const wt = 2 * Math.PI * f * tt;
    drawLines(deepPoly, [0, 1], g.lam1, wt / g.K1);
    if (shallowPoly.length) {
      const c = (g.k2[0] - g.k1[0]) * g.p0[0] + (g.k2[1] - g.k1[1]) * g.p0[1];
      drawLines(shallowPoly, [g.k2[0] / g.K2, g.k2[1] / g.K2], g.lam2, (wt + c) / g.K2);
      ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
      const a = [g.p0[0] - g.tHat[0], g.p0[1] - g.tHat[1]], b = [g.p0[0] + g.tHat[0], g.p0[1] + g.tHat[1]];
      ctx.save(); path(rect); ctx.clip(); line(ctx, X(a[0]), Y(a[1]), X(b[0]), Y(b[1])); ctx.restore(); ctx.setLineDash([]);
    }
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.strokeRect(left, top, TW, TH);
    // the dipper
    const bob = Math.sin(2 * Math.PI * f * tt) * 2;
    ctx.fillStyle = C.muted; ctx.fillRect(left + TW * 0.05, top - fs * 0.9 + bob, TW * 0.9, fs * 0.6);
    label(ctx, `${this.lanes().length > 1 ? 'Tank ' + k + ': ' : ''}dipper vibrating at ${fx(f, 1)} Hz`, x0 + lw / 2, fs * 0.8, k === 'A' ? C.a : C.b, { fs: fs * 0.85, weight: 750 });
    // wave directions and the normal at the boundary
    if (ov.rays) {
      const ax = RIPPLE.W * 0.18, y1 = 0.03, yHit = g.p0[1] + (ax - g.p0[0]) * Math.tan(g.th);
      arrow(ctx, X(ax), Y(y1), X(ax), Y(Math.min(yHit, RIPPLE.H) - 0.01), '#ffd34d', { width: 4 });
      if (shallowPoly.length && yHit < RIPPLE.H) {
        const d2 = [g.k2[0] / g.K2, g.k2[1] / g.K2], L2 = Math.min(0.1, (RIPPLE.H - yHit) / d2[1] * 0.9);
        arrow(ctx, X(ax), Y(yHit), X(ax + d2[0] * L2), Y(yHit + d2[1] * L2), '#ffd34d', { width: 4 });
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
        line(ctx, X(ax - g.nHat[0] * 0.05), Y(yHit - g.nHat[1] * 0.05), X(ax + g.nHat[0] * 0.05), Y(yHit + g.nHat[1] * 0.05)); ctx.setLineDash([]);
        if (ov.values && p.angle > 0) label(ctx, `direction changes by ${fx(g.theta1 - g.theta2, 0)}°`, X(ax) + fs * 0.6, Y(yHit) + fs * 1.8, '#111', { align: 'left', fs: fs * 0.8 });
      }
    }
    if (ov.values) {
      label(ctx, `deep: λ = ${fx(g.lam1 * 100, 1)} cm, v = ${fx(RIPPLE.vDeep, 2)} m/s`, left + TW - fs * 0.3, top + fs * 0.9, '#111', { align: 'right', fs: fs * 0.8 });
      if (shallowPoly.length) label(ctx, `shallow: λ = ${fx(g.lam2 * 100, 1)} cm, v = ${fx(RIPPLE.vShallow, 2)} m/s`, left + TW - fs * 0.3, top + TH - fs * 0.9, '#111', { align: 'right', fs: fs * 0.8 });
    }
    if (p.strobe !== 'off') label(ctx, p.strobe === 'freeze' ? 'STROBE: waves look still' : 'STROBE: slow motion', left + fs * 0.3, top + TH - fs * 0.9, C.force, { align: 'left', fs: fs * 0.8, weight: 800 });
    if (ov.eq) label(ctx, `v = f λ = ${fx(f, 1)} Hz × ${fx(g.lam1, 3)} m = ${fx(f * g.lam1, 2)} m/s`, x0 + lw / 2, h - fs * 0.7, C.ink, { fs: fs * 0.85 });
    // the ruler (tank A only): drag either end
    if (ov.ruler && i === 0) {
      const r = this.ruler, dist = Math.hypot(r.x2 - r.x1, r.y2 - r.y1);
      ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = fs * 0.5; line(ctx, X(r.x1), Y(r.y1), X(r.x2), Y(r.y2));
      ctx.strokeStyle = '#5b4a1f'; ctx.lineWidth = 1;
      const n = Math.floor(dist * 100);
      for (let j = 0; j <= n; j++) {
        const f_ = j / 100 / dist, px = X(r.x1 + (r.x2 - r.x1) * f_), py = Y(r.y1 + (r.y2 - r.y1) * f_), nx = -(r.y2 - r.y1) / dist, ny = (r.x2 - r.x1) / dist;
        const L = (j % 5 === 0 ? 0.25 : 0.12) * fs;
        line(ctx, px - nx * L, py - ny * L, px + nx * L, py + ny * L);
      }
      label(ctx, `ruler: ${fx(dist * 100, 1)} cm`, X(r.x2) + fs * 0.6, Y(r.y2) + fs * 0.6, '#111', { align: 'left', fs: fs * 0.8, weight: 800 });
      const clampPt = (px, py) => [clamp((px - left) / ppm, 0, RIPPLE.W), clamp((py - top) / ppm, 0, RIPPLE.H)];
      addHandle(ctx, { id: 'r1', x: X(r.x1), y: Y(r.y1), r: fs * 0.8, cursor: 'move', onDrag: (px, py) => { [r.x1, r.y1] = clampPt(px, py); } });
      addHandle(ctx, { id: 'r2', x: X(r.x2), y: Y(r.y2), r: fs * 0.8, cursor: 'move', onDrag: (px, py) => { [r.x2, r.y2] = clampPt(px, py); } });
    }
  },

  drawGraph(cv, id, C) {
    const lanes = this.lanes(), rows = App.rows[this.id] || [];
    if (id === 'profile') {
      const series = lanes.map(k => {
        const f = this.fOf(k), tt = this.tDraw(f), pts = [];
        for (let y = 0; y <= RIPPLE.H + 1e-9; y += RIPPLE.H / 400) pts.push([y * 100, this.heightAt(f, RIPPLE.W / 2, y, tt)]);
        return { pts, color: k === 'A' ? C.a : C.b, width: 3, label: lanes.length > 1 ? `Tank ${k}: ${fx(f, 1)} Hz` : null };
      });
      const o = { xLabel: 'Distance from the dipper along the middle of the tank (cm)', yLabel: 'Water height', xMax: RIPPLE.H * 100, yMin: -1.6, yMax: 1.6, series, lines: [], notes: [] };
      if (this.p.shallow === 'on') {
        o.lines.push({ x1: RIPPLE.yb * 100, y1: -1.6, x2: RIPPLE.yb * 100, y2: 1.6, color: C.muted, dash: [5, 5], label: 'shallow →' });
        o.notes.push({ text: 'In shallow water the waves are closer together (shorter λ)', color: C.ink });
      } else o.notes.push({ text: 'Crests are one wavelength apart', color: C.ink });
      plot(cv, o);
      return;
    }
    const o = { xLabel: '1 ÷ frequency (s)', yLabel: 'Wavelength λ (cm)', xMax: 0.5, yMax: niceCeil(RIPPLE.vDeep * 0.5 * 100), lines: [], points: [], notes: [] };
    for (const [region, v, col] of [['deep', RIPPLE.vDeep, C.a], ['shallow', RIPPLE.vShallow, C.b]]) {
      const pts = rows.filter(r => r.region === region).map(r => ({ x: 1 / r.f, y: r.lambda }));
      for (const q of pts) o.points.push({ x: q.x, y: q.y, color: col });
      const fit = pts.length >= 2 ? fitOrigin(pts) : null;
      if (fit) { o.lines.push({ x1: 0, y1: 0, x2: 0.5, y2: fit.k * 0.5, color: col, width: 2.5 }); o.notes.push({ text: `${region}: gradient = speed = ${fx(fit.k / 100, 2)} m/s`, color: col }); }
    }
    for (const k of lanes) { const f = this.fOf(k); o.points.push({ x: 1 / f, y: RIPPLE.vDeep / f * 100, color: k === 'A' ? C.a : C.b, dot: true }); }
    o.notes.push({ text: 'Straight line through the origin: λ = v × (1 ÷ f)', color: C.muted });
    if (!rows.length) o.message = 'Record readings at several frequencies';
    plot(cv, o);
  },

  readouts() {
    const lanes = this.lanes(), per = fn => lanes.map(k => fn(this.waveGeom(this.fOf(k)), this.fOf(k))), sh = this.p.shallow === 'on';
    const rows = [
      { label: 'Frequency f', unit: 'Hz', vals: per((g, f) => fx(f, 1)) },
      { label: 'Period T = 1 ÷ f', unit: 's', vals: per((g, f) => fx(1 / f, 3)) },
      { label: 'Deep: wavelength λ', unit: 'cm', vals: per(g => fx(g.lam1 * 100, 2)) },
      { label: 'Deep: speed v = f λ', unit: 'm/s', vals: per((g, f) => fx(f * g.lam1, 2)) },
    ];
    if (sh) rows.push({ label: 'Shallow: wavelength λ', unit: 'cm', vals: per(g => fx(g.lam2 * 100, 2)) },
                      { label: 'Shallow: speed v = f λ', unit: 'm/s', vals: per((g, f) => fx(f * g.lam2, 2)) },
                      { label: 'Change of direction', unit: '°', vals: per(g => fx(g.theta1 - g.theta2, 1)) });
    const r = this.ruler;
    rows.push({ label: 'Ruler length', unit: 'cm', vals: [fx(Math.hypot(r.x2 - r.x1, r.y2 - r.y1) * 100, 1)] });
    return { cols: lanes.length > 1 ? [{ name: 'A', cls: 'A' }, { name: 'B', cls: 'B' }] : [{ name: '', cls: 'A' }], rows };
  },

  record() {
    const out = [];
    for (const k of this.lanes()) {
      const f = this.fOf(k), g = this.waveGeom(f);
      out.push({ region: 'deep', f, lambda: g.lam1 * 100, v: f * g.lam1 });
      if (this.p.shallow === 'on') out.push({ region: 'shallow', f, lambda: g.lam2 * 100, v: f * g.lam2 });
    }
    return out;
  },
});

   EXPERIMENT 15: WAVES ON A STRING (standing waves)

const STRING_MU = 0.002;   // kg/m: mass of each metre of string
const VIS_F = 0.8;         // Hz: how fast the string seems to vibrate on screen (real vibrations are far too fast to see)

Object.assign(Physics, {
  // Wave speed on a string: v = √(T ÷ μ). (Not on the AQA sheet; the practical uses v = f λ.)
  stringSpeed(T, mu) { return Math.sqrt(T / mu); },
  // Lowest resonant frequency: one loop, so λ = 2L and f = v ÷ 2L.
  fundamental(T, L) { return Physics.stringSpeed(T, STRING_MU) / (2 * L); },
  // How strongly loop pattern n (1, 2, 3...) is excited at frequency f (1 at resonance).
  modeAmp(f, n, f1, width) { const x = (f - n * f1) / width; return 1 / (1 + x * x); },
});

  },

  // ---- simulation ----
  lanes() { return this.p.compare ? ['A', 'B'] : ['A']; },
  modeOf(k) { return this.p.compare ? (k === 'A' ? 'standing' : 'travelling') : this.p.mode; },
  tension() { return this.p.mass / 1000 * SETTINGS.g; },
  f1() { return Physics.fundamental(this.tension(), this.p.L); },
  width() { return this.f1() * (this.p.realistic ? 0.07 : 0.025); },
  amps() { const out = []; for (let n = 1; n <= 15; n++) out.push(Physics.modeAmp(this.p.f, n, this.f1(), this.width())); return out; },
  // the loop pattern we are near, and whether it is a clear resonance
  nearest() { const n = Math.max(1, Math.round(this.p.f / this.f1())); return { n, on: Physics.modeAmp(this.p.f, n, this.f1(), this.width()) > 0.5 }; },
  jump(dir) { const n = Math.max(1, Math.round(this.p.f / this.f1()) + dir); setParam(this, 'f', n * this.f1()); },
  reset() { this.s = { t: 0 }; },
  step(dt) { this.s.t += dt; },
  finished() { return false; },
  clock() { const r = this.nearest(); return r.on ? `Resonance: ${r.n} loop${r.n > 1 ? 's' : ''}` : 'No resonance'; },
  // String displacement (−1 to 1) at fraction u = x ÷ L along it.
  shape(k, u) {
    const ph = 2 * Math.PI * VIS_F * this.s.t;
    if (this.modeOf(k) === 'travelling') {
      const lam = Physics.stringSpeed(this.tension(), STRING_MU) / this.p.f / this.p.L;     // in units of L
      return 0.6 * Math.sin(2 * Math.PI * (u / lam - VIS_F * this.s.t)) * (this.p.realistic ? Math.exp(-u * 0.4) : 1);
    }
    let y = 0;
    this.amps().forEach((A, j) => { y += A * Math.sin((j + 1) * Math.PI * u); });
    y *= 0.9 * Math.cos(ph);
    if (this.p.realistic) y += 0.06 * (1 - u) * Math.cos(ph);
    return y;
  },

  drawDiagram(ctx, w, h, C) {
    const lanes = this.lanes(), lh = h / lanes.length, fs = App.fs, ov = this.ov, p = this.p;
    const gx = w * 0.06, pinX = gx + fs * 3.2, ppm = (w * 0.86 - pinX) / 1.5, bx = pinX + p.L * ppm;
    lanes.forEach((k, i) => {
      const y0 = i * lh, sy = y0 + lh * 0.48, amp = lh * 0.26, mode = this.modeOf(k), near = this.nearest();
      if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, 0, y0, w, y0); }
      label(ctx, mode === 'standing' ? 'Standing wave' : 'Travelling wave (far end absorbs it)', fs * 0.4, y0 + fs * 0.9, k === 'A' ? C.a : C.b, { align: 'left', weight: 800, fs: fs * 0.9 });
      // vibration generator and pulley / bridge
      ctx.fillStyle = C.panel2; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      roundRect(ctx, gx, sy - fs * 1.4, fs * 2.8, fs * 2.8, 5); ctx.fill(); ctx.stroke();
      label(ctx, `${fx(p.f, 1)} Hz`, gx + fs * 1.4, sy + fs * 2.1, C.ink, { fs: fs * 0.8, weight: 800 });
      ctx.fillStyle = C.muted; ctx.beginPath(); ctx.arc(bx, sy, fs * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
      line(ctx, bx + fs * 0.7, sy, bx + fs * 0.7, sy + lh * 0.3);
      ctx.fillStyle = C.muted;
      const nm = Math.round(p.mass / 100);
      for (let j = 0; j < nm; j++) ctx.fillRect(bx + fs * 0.7 - fs * 0.8, sy + lh * 0.3 + j * fs * 0.32, fs * 1.6, fs * 0.28);
      if (ov.values) label(ctx, `${p.mass} g → T = ${fx(this.tension(), 2)} N`, bx + fs * 2, sy + lh * 0.32, C.ink, { align: 'left', fs: fs * 0.8 });
      addHandle(ctx, { id: 'bridge' + k, x: bx, y: sy, r: fs * 1.2, cursor: 'ew-resize', onDrag: px => setParam(this, 'L', (px - pinX) / ppm) });
      // the two travelling waves that add up to make the standing wave
      if (ov.parts && mode === 'standing' && near.on) {
        const ph = 2 * Math.PI * VIS_F * this.s.t, n = near.n;
        for (const [sgn, col] of [[1, C.force], [-1, C.friction]]) {
          ctx.strokeStyle = col; ctx.globalAlpha = 0.6; ctx.lineWidth = 2; ctx.beginPath();
          for (let j = 0; j <= 120; j++) { const u = j / 120; const y = 0.45 * Math.sin(n * Math.PI * u - sgn * ph); j ? ctx.lineTo(pinX + u * p.L * ppm, sy - y * amp) : ctx.moveTo(pinX, sy - y * amp); }
          ctx.stroke(); ctx.globalAlpha = 1;
        }
      }
      // the string
      ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.beginPath();
      for (let j = 0; j <= 160; j++) { const u = j / 160, y = this.shape(k, u); j ? ctx.lineTo(pinX + u * p.L * ppm, sy - y * amp) : ctx.moveTo(pinX, sy - y * amp); }
      ctx.stroke();
      line(ctx, gx + fs * 2.8, sy, pinX, sy - this.shape(k, 0) * amp);
      if (ov.dots) {
        for (let j = 1; j < 12; j++) {
          const u = j / 12; ctx.fillStyle = C.acc; ctx.beginPath(); ctx.arc(pinX + u * p.L * ppm, sy - this.shape(k, u) * amp, fs * 0.28, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (ov.nodes && mode === 'standing' && near.on) {
        for (let j = 0; j <= near.n; j++) label(ctx, 'N', pinX + j / near.n * p.L * ppm, sy + amp + fs * 0.6, C.vel, { fs: fs * 0.85, weight: 800 });
        for (let j = 0; j < near.n; j++) label(ctx, 'A', pinX + (j + 0.5) / near.n * p.L * ppm, sy - amp - fs * 0.6, C.force, { fs: fs * 0.85, weight: 800 });
      }
      if (ov.eq) {
        const v = Physics.stringSpeed(this.tension(), STRING_MU);
        const text = mode === 'travelling' ? `λ = v ÷ f = ${fx(v, 1)} ÷ ${fx(p.f, 1)} = ${fx(v / p.f, 2)} m: every point moves the same amount`
          : near.on ? `${near.n} loop${near.n > 1 ? 's' : ''}: λ = 2L ÷ ${near.n} = ${fx(2 * p.L / near.n, 2)} m, v = f λ = ${fx(p.f, 1)} × ${fx(2 * p.L / near.n, 2)} = ${sf(p.f * 2 * p.L / near.n, 3)} m/s`
          : 'Not at a resonance: no clear standing wave';
        label(ctx, text, w / 2, y0 + lh - fs * 0.8, C.ink, { fs: fs * 0.85 });
      }
    });
    // scale under the string length
    if (this.ov.values) label(ctx, `L = ${fx(p.L, 2)} m (drag the pulley)`, (pinX + bx) / 2, fs * 0.9, C.muted, { fs: fs * 0.8 });
  },

  drawGraph(cv, id, C) {
    const p = this.p, f1 = this.f1(), lanes = this.lanes();
    if (id === 'res') {
      const pts = [];
      for (let f = 5; f <= 150; f += 0.25) { let a = 0; for (let n = 1; n <= 15; n++) a = Math.max(a, Physics.modeAmp(f, n, f1, this.width())); pts.push([f, a]); }
      const lines = [];
      for (let n = 1; n * f1 <= 150 && n <= 6; n++) lines.push({ x1: n * f1, y1: 0, x2: n * f1, y2: 1.15, color: C.muted, dash: [3, 5], label: `${n} loop${n > 1 ? 's' : ''}` });
      let a = 0; for (let n = 1; n <= 15; n++) a = Math.max(a, Physics.modeAmp(p.f, n, f1, this.width()));
      plot(cv, { xLabel: 'Frequency f (Hz)', yLabel: 'Size of vibration', xMin: 0, xMax: 150, yMax: 1.3, series: [{ pts, color: C.a, width: 3 }], lines,
        points: [{ x: p.f, y: a, color: C.force, dot: true, label: 'now' }],
        notes: [{ text: `Resonance at f₁ = ${fx(f1, 1)} Hz and whole-number multiples of it`, color: C.ink }], notesRight: true });
      return;
    }
    const series = lanes.map(k => { const pts = []; for (let j = 0; j <= 200; j++) { const u = j / 200; pts.push([u * p.L, this.shape(k, u)]); } return { pts, color: k === 'A' ? C.a : C.b, width: 3, label: lanes.length > 1 ? this.modeOf(k) : null }; });
    plot(cv, { xLabel: 'Distance along the string (m)', yLabel: 'Displacement', xMax: niceCeil(p.L), yMin: -1.3, yMax: 1.3, series,
      notes: [{ text: 'Nodes: points that never move', color: C.ink }] });
  },

  readouts() {
    const near = this.nearest(), v = Physics.stringSpeed(this.tension(), STRING_MU);
    return { cols: [{ name: '' }], rows: [
      { label: 'Frequency f', unit: 'Hz', vals: [fx(this.p.f, 1)] },
      { label: 'Tension T = m g', unit: 'N', vals: [fx(this.tension(), 2)] },
      { label: 'Length L', unit: 'm', vals: [fx(this.p.L, 2)] },
      { label: 'Loops (standing wave)', unit: '', vals: [near.on ? String(near.n) : 'none'] },
      { label: 'Wavelength λ', unit: 'm', vals: [near.on ? fx(2 * this.p.L / near.n, 2) : fx(v / this.p.f, 2) + ' (travelling)'] },
      { label: 'Wave speed v = f λ', unit: 'm/s', vals: [sf(v, 3)] },
      { label: 'First resonance f₁', unit: 'Hz', vals: [fx(this.f1(), 1)] },
    ] };
  },

  record() {
    const near = this.nearest();
    if (!near.on) return 'Find a resonance first (a clear standing wave), then record';
    const lam = 2 * this.p.L / near.n;
    return [{ f: this.p.f, T: this.tension(), L: this.p.L, n: String(near.n), lambda: lam, v: this.p.f * lam }];
  },
});

  lanes() { return this.p.compare ? ['A', 'B'] : ['A']; },
  vals(k) {
    if (k === 'B') { const d = DEVICES[this.p.devB]; return { dev: d, Pin: d.Pin, Pu: d.Pu, Pw: d.Pin - d.Pu }; }
    return { dev: DEVICES[this.p.dev], Pin: this.p.Pin, Pu: this.p.Pu, Pw: this.p.Pw };
  },
  // keep useful + wasted = input whichever slider moves
  onParam(key) {
    const p = this.p;
    if (key === 'dev') { const d = DEVICES[p.dev]; setParam(this, 'Pin', d.Pin); setParam(this, 'Pu', d.Pu); }
    if (key === 'Pw') { setParam(this, 'Pw', Math.min(p.Pw, p.Pin)); setParam(this, 'Pu', p.Pin - p.Pw); }
    else { setParam(this, 'Pu', Math.min(p.Pu, p.Pin)); setParam(this, 'Pw', p.Pin - p.Pu); }
  },
  reset() { this.s = { t: 0, lastSample: 0, hist: { A: [[0, 0, 0, 0]], B: [[0, 0, 0, 0]] }, E: { A: [0, 0, 0], B: [0, 0, 0] }, phase: 0 }; },
  step(dt) {
    const s = this.s;
    s.t += dt;
    for (const k of this.lanes()) { const v = this.vals(k); s.E[k][0] += v.Pin * dt; s.E[k][1] += v.Pu * dt; s.E[k][2] += v.Pw * dt; }
    if (s.t - s.lastSample >= 0.25) { s.lastSample = s.t; for (const k of this.lanes()) s.hist[k].push([s.t, ...s.E[k]]); }
  },
  finished() { return this.s.t >= 60; },
  clock() { return `t = ${fx(this.s.t, 1)} s`; },

  drawDiagram(ctx, w, h, C) {
    const lanes = this.lanes(), lh = h / lanes.length, fs = App.fs, ov = this.ov, dt = frameDt(this);
    if (App.running) this.s.phase += dt;
    lanes.forEach((k, i) => {
      const y0 = i * lh, v = this.vals(k), eff = Physics.efficiency(v.Pu, v.Pin);
      if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, 0, y0, w, y0); }
      label(ctx, `${lanes.length > 1 ? k + ': ' : ''}${v.dev.label}`, fs * 0.4, y0 + fs * 0.9, k === 'A' ? C.a : C.b, { align: 'left', weight: 800 });
      // Sankey diagram: band widths are proportional to the energy
      const W0 = Math.min(lh * 0.34, fs * 6), xs = w * 0.06, xSplit = w * 0.36, xEnd = w * 0.8, yTop = y0 + lh * 0.25;
      const wu = W0 * eff, ww = W0 - wu, yWaste = y0 + lh - fs * 1.2;
      // input band, then it splits: useful carries straight on, wasted bends down into the room
      const cxW = xSplit + ww / 2 + fs, yBend = yTop + wu + ww / 2;
      ctx.globalAlpha = 0.85; ctx.lineCap = 'butt';
      ctx.fillStyle = C.a; ctx.fillRect(xs, yTop, xSplit - xs, W0);
      if (wu > 0.5) { ctx.fillStyle = C.vel; ctx.beginPath(); ctx.moveTo(xSplit, yTop); ctx.lineTo(xEnd, yTop); ctx.lineTo(xEnd + fs * 0.9, yTop + wu / 2); ctx.lineTo(xEnd, yTop + wu); ctx.lineTo(xSplit, yTop + wu); ctx.closePath(); ctx.fill(); }
      if (ww > 0.5) {
        ctx.strokeStyle = C.force; ctx.lineWidth = ww; ctx.beginPath();
        ctx.moveTo(xSplit, yBend); ctx.quadraticCurveTo(cxW, yBend, cxW, Math.max(yBend + ww, yWaste - fs * 0.8)); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // energy "packets" moving along (they are never destroyed)
      if (ov.flow) {
        ctx.fillStyle = C.bg;
        const ph = (this.s.phase * 60) % 30;
        for (let x = xs + ph; x < xSplit; x += 30) ctx.fillRect(x, yTop + W0 / 2 - 2, 6, 4);
        if (wu > 4) for (let x = xSplit + ph; x < xEnd; x += 30) ctx.fillRect(x, yTop + wu / 2 - 2, 6, 4);
        if (ww > 4) for (let y = yBend + ww / 2 + fs * 0.4 + ph; y < yWaste - fs * 0.8; y += 30) ctx.fillRect(cxW - 3, y, 6, 4);
        // in the room: wasted energy spreads out
        for (let j = 0; j < 5; j++) wavyArrow(ctx, cxW, yWaste - fs * 0.8, cxW + (j - 2) * fs * 1.6, yWaste + fs * 0.4, C.force, { width: 1.5, amp: 2 });
      }
      const draggableY = yTop + wu;
      addHandle(ctx, { id: 'split' + k, x: xSplit, y: draggableY, r: fs * 0.9, cursor: 'ns-resize',
        onDrag: (px, py) => { if (k !== 'A') return; const e = clamp((py - yTop) / W0, 0, 1); setParam(this, 'Pu', e * this.p.Pin); this.onParam('Pu'); } });
      if (ov.values) {
        label(ctx, `Total input: ${fx(v.Pin, 0)} J each second`, xs, yTop - fs * 0.8, C.a, { align: 'left', fs: fs * 0.85, weight: 750 });
        label(ctx, `Useful (${v.dev.useful}): ${fx(v.Pu, 0)} J (${fx(eff * 100, 0)}%)`, xEnd + fs, yTop + wu / 2, C.vel, { align: 'right', fs: fs * 0.85, weight: 750 });
        label(ctx, `Wasted: ${fx(v.Pw, 0)} J (${fx((1 - eff) * 100, 0)}%) → ${v.dev.wasted}`, cxW + ww / 2 + fs * 0.6, yWaste - fs * 1.4, C.force, { align: 'left', fs: fs * 0.8, weight: 750 });
      }
      if (ov.eq) {
        const E = this.s.E[k], dT = E[2] / ROOM_HEAT_CAPACITY;
        label(ctx, `efficiency = ${fx(v.Pu, 0)} ÷ ${fx(v.Pin, 0)} = ${fx(eff, 2)} (${fx(eff * 100, 0)}%)`, w - fs * 0.4, y0 + fs * 0.9, C.ink, { align: 'right', fs: fs * 0.85 });
        if (this.s.t > 0) label(ctx, `So far: ${fx(E[0], 0)} J in = ${fx(E[1], 0)} J useful + ${fx(E[2], 0)} J wasted · room ${fx(dT, 3)} °C warmer`, w - fs * 0.4, y0 + fs * 2.2, C.muted, { align: 'right', fs: fs * 0.75 });
      }
    });
  },

  drawGraph(cv, id, C) {
    const lanes = this.lanes();
    if (id === 'E') {
      const top = Math.max(1, ...lanes.map(k => this.vals(k).Pin * 60));
      const series = [];
      for (const k of lanes) {
        const h = this.s.hist[k].concat([[this.s.t, ...this.s.E[k]]]), tag = lanes.length > 1 ? k + ': ' : '';
        series.push({ pts: h.map(q => [q[0], q[1]]), color: C.a, width: 5, label: `${tag}total input` });
        series.push({ pts: h.map(q => [q[0], q[2] + q[3]]), color: C.ink, width: 2, dash: [6, 5], label: `${tag}useful + wasted` });
        series.push({ pts: h.map(q => [q[0], q[2]]), color: C.vel, width: 3, label: `${tag}useful` });
        series.push({ pts: h.map(q => [q[0], q[3]]), color: C.force, width: 3, label: `${tag}wasted` });
      }
      plot(cv, { xLabel: 'Time t (s)', yLabel: 'Energy transferred (J)', xMax: 60, yMax: niceCeil(top), series,
        notes: [{ text: 'useful + wasted = input: no energy is used up', color: C.ink }] });
      return;
    }
    const bars = [], xTicks = [];
    lanes.forEach((k, li) => {
      const E = this.s.t > 0 ? this.s.E[k] : [this.vals(k).Pin, this.vals(k).Pu, this.vals(k).Pw], off = lanes.length > 1 ? (li - 0.5) * 0.4 : 0, bw = lanes.length > 1 ? 0.36 : 0.6;
      bars.push({ x: 1 + off, y: E[0], width: bw, color: C.a, label: fx(E[0], 0) });
      bars.push({ x: 2 + off, y: E[1], width: bw, color: C.vel, label: fx(E[1], 0) });
      bars.push({ x: 3 + off, y: E[2], width: bw, color: C.force, label: fx(E[2], 0) });
      bars.push({ x: 4 + off, y: E[1] + E[2], width: bw, color: C.muted, label: fx(E[1] + E[2], 0) });
    });
    xTicks.push([1, 'input (before)'], [2, 'useful (after)'], [3, 'wasted (after)'], [4, 'total after']);
    plot(cv, { xLabel: this.s.t > 0 ? `Energy so far (${fx(this.s.t, 1)} s)` : 'Energy in 1 second', yLabel: 'Energy (J)', xMin: 0.4, xMax: 4.6,
      yMax: niceCeil(Math.max(1, ...bars.map(b => b.y)) * 1.2), bars, xTicks, notes: [{ text: 'Total after = input before (conservation of energy)', color: C.ink }] });
  },

  readouts() {
    const lanes = this.lanes(), per = fn => lanes.map(k => fn(this.vals(k), this.s.E[k]));
    return {
      cols: lanes.length > 1 ? [{ name: 'A', cls: 'A' }, { name: 'B', cls: 'B' }] : [{ name: '', cls: 'A' }],
      rows: [
        { label: 'Total input each second', unit: 'J', vals: per(v => fx(v.Pin, 0)) },
        { label: 'Useful output each second', unit: 'J', vals: per(v => fx(v.Pu, 0)) },
        { label: 'Wasted each second', unit: 'J', vals: per(v => fx(v.Pw, 0)) },
        { label: 'Efficiency', unit: '', vals: per(v => `${fx(Physics.efficiency(v.Pu, v.Pin), 2)} (${fx(Physics.efficiency(v.Pu, v.Pin) * 100, 0)}%)`) },
        { label: 'Energy wasted so far', unit: 'J', vals: per((v, E) => fx(E[2], 0)) },
        { label: 'Room temperature rise', unit: '°C', vals: per((v, E) => fx(E[2] / ROOM_HEAT_CAPACITY, 3)) },
      ],
    };
  },

  record() {
    return this.lanes().map(k => { const v = this.vals(k), e = Physics.efficiency(v.Pu, v.Pin); return { dev: v.dev.label, Pin: v.Pin, Pu: v.Pu, Pw: v.Pw, eff: e, pct: e * 100 }; });
  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 17: MOMENTUM AND COLLISIONS  (p = m v)
   --------------------------------------------------------------------- */
const TRACK = { length: 4, trolley: 0.4, contact: 0.06 };   // m, m, s (how long the bumpers are pushing on each other)
const TROLLEY_FRICTION = 0.15;                              // m/s² slowing in Realistic mode

Object.assign(Physics, {
  // Velocities after a 1-D collision. e = 1: elastic (bounce); e = 0: the trolleys stick together.
  collide(mA, mB, uA, uB, e) {
    const P = mA * uA + mB * uB, M = mA + mB;
    return { vA: (P + mB * e * (uB - uA)) / M, vB: (P + mA * e * (uA - uB)) / M };
  },
  momentum(m, v) { return m * v; },              // p = m v
  kineticEnergy(m, v) { return 0.5 * m * v * v; },   // Eₖ = ½ m v²
});

  table: {
    columns: [

      { key: 'mA', label: 'm A', unit: 'kg', fmt: v => fx(v, 1) },
      { key: 'uA', label: 'u A', unit: 'm/s', fmt: v => fx(v, 2) },

      { key: 'vB', label: 'v B', unit: 'm/s', fmt: v => fx(v, 2) },
      { key: 'p0', label: 'p before', unit: 'kg m/s', fmt: v => fx(v, 2) },
      { key: 'p1', label: 'p after', unit: 'kg m/s', fmt: v => fx(v, 2) },
      { key: 'k0', label: 'Eₖ before', unit: 'J', fmt: v => fx(v, 2) },

    ],
    hint: 'Measure velocities with light gates before and after. Give momentum to 2 or 3 significant figures, and remember that a velocity to the left is negative.',
  },

  // ---- simulation ----
  lanes() { return this.p.compare ? ['A', 'B'] : ['A']; },
  bounce(k) { const t = this.p.compare ? (k === 'A' ? 'elastic' : 'inelastic') : this.p.type; return t === 'elastic' ? 1 : t === 'inelastic' ? 0 : this.p.e; },
  typeName(k) { const e = this.bounce(k); return e === 1 ? 'elastic' : e === 0 ? 'inelastic (stick)' : `partly elastic (${fx(e, 1)})`; },
  reset() {
    const p = this.p, mk = () => ({ xA: 1.0, xB: 2.6, vA: p.uA, vB: p.uB, FA: 0, contact: null, stuck: false, done: false, hist: [[0, p.mA * p.uA, p.mB * p.uB, 0]] });
    this.s = { t: 0, lastSample: 0, A: mk(), B: mk() };
  },
  step(dt) {
    const s = this.s, p = this.p;
    const n = Math.ceil(dt / 0.002), h = dt / n;
    for (let i = 0; i < n; i++) {
      s.t += h;
      for (const k of this.lanes()) {
        const st = s[k];
        st.FA = 0;
        const gap = (st.xB - TRACK.trolley / 2) - (st.xA + TRACK.trolley / 2);
        if (!st.contact && !st.stuck && !st.done && gap <= 0 && st.vA > st.vB) {
          const fin = Physics.collide(p.mA, p.mB, st.vA, st.vB, this.bounce(k));
          st.contact = { tc: 0, J: p.mA * (fin.vA - st.vA), fin, t0: s.t };
        }
        if (st.contact) {
          const c = st.contact;
          c.tc += h;
          if (c.tc >= TRACK.contact) {
            st.vA = c.fin.vA; st.vB = c.fin.vB; st.contact = null; st.done = true;
            if (this.bounce(k) === 0) st.stuck = true;
          } else {
            st.FA = c.J * Math.PI / (2 * TRACK.contact) * Math.sin(Math.PI * c.tc / TRACK.contact);   // force on A; force on B is −FA
            st.vA += st.FA / p.mA * h; st.vB -= st.FA / p.mB * h;
          }
        }
        if (p.realistic) {
          const slow = v => Math.sign(v) * Math.max(0, Math.abs(v) - TROLLEY_FRICTION * h);
          st.vA = slow(st.vA); st.vB = slow(st.vB);
          if (st.stuck) st.vB = st.vA;
        }
        st.xA += st.vA * h; st.xB += st.vB * h;
        if (st.stuck) st.xB = st.xA + TRACK.trolley;
      }
      if (s.t - s.lastSample >= (this.lanes().some(k => s[k].contact) ? 0.004 : 0.03)) {
        s.lastSample = s.t;
        for (const k of this.lanes()) s[k].hist.push([s.t, p.mA * s[k].vA, p.mB * s[k].vB, s[k].FA]);
      }
    }
  },
  // the run ends after 5 s, or once both trolleys have rolled off the ends of the track
  finished() {
    const off = x => x < -0.6 || x > TRACK.length + 0.6;
    return this.s.t >= 5 || this.lanes().every(k => off(this.s[k].xA) && off(this.s[k].xB));
  },
  clock() { return `t = ${fx(this.s.t, 2)} s`; },
  totals(k) {
    const p = this.p, st = this.s[k], fin = Physics.collide(p.mA, p.mB, p.uA, p.uB, this.bounce(k));
    const willHit = p.uA > p.uB;
    const after = willHit ? fin : { vA: p.uA, vB: p.uB };
    return { p0: p.mA * p.uA + p.mB * p.uB, p1: p.mA * after.vA + p.mB * after.vB,
             k0: Physics.kineticEnergy(p.mA, p.uA) + Physics.kineticEnergy(p.mB, p.uB), k1: Physics.kineticEnergy(p.mA, after.vA) + Physics.kineticEnergy(p.mB, after.vB),
             vA: after.vA, vB: after.vB, pNow: p.mA * st.vA + p.mB * st.vB };
  },

  drawDiagram(ctx, w, h, C) {
    const lanes = this.lanes(), lh = h / lanes.length, fs = App.fs, ov = this.ov, p = this.p;
    const x0 = fs * 1.5, ppm = (w - 2 * x0) / TRACK.length, X = x => x0 + x * ppm, pxV = w / 18;
    lanes.forEach((k, i) => {
      const y0 = i * lh, st = this.s[k], groundY = y0 + lh * 0.66, T = this.totals(k);
      if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, 0, y0, w, y0); }
      ctx.strokeStyle = C.ink; ctx.lineWidth = 3; line(ctx, 0, groundY, w, groundY);
      label(ctx, this.typeName(k), fs * 0.4, y0 + fs * 0.9, C.ink, { align: 'left', weight: 800, fs: fs * 0.9 });
      const tw = TRACK.trolley * ppm, th = Math.min(lh * 0.22, fs * 2.2);
      [['A', st.xA, p.mA, st.vA, C.a], ['B', st.xB, p.mB, st.vB, C.b]].forEach(([name, x, m, v, col], j) => {
        const cx = X(x), top = groundY - th - fs * 0.5;
        ctx.fillStyle = col; roundRect(ctx, cx - tw / 2, top, tw, th, 5); ctx.fill();
        ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = C.ink; for (const wx of [cx - tw * 0.3, cx + tw * 0.3]) { ctx.beginPath(); ctx.arc(wx, groundY - fs * 0.25, fs * 0.25, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = C.bg; ctx.font = `800 ${fs * 0.85}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(`${name} · ${fx(m, 1)} kg`, cx, top + th / 2);
        // spring bumper on the facing ends
        const bx = j === 0 ? cx + tw / 2 : cx - tw / 2, dir = j === 0 ? 1 : -1, comp = st.contact ? Math.min(1, Math.abs(st.FA) / 40) : 0;
        ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(bx, top + th / 2);
        const bl = fs * 0.5 * (1 - comp * 0.6);
        for (let q = 1; q <= 4; q++) ctx.lineTo(bx + dir * bl * q / 4, top + th / 2 + (q % 2 ? -4 : 4));
        ctx.stroke();
        if (ov.vel) {
          const ay = top - fs * (j === 0 ? 0.9 : 2.2);      // B's arrow sits higher so the labels never overlap
          if (Math.abs(v) > 1e-3) arrow(ctx, cx, ay, cx + v * pxV, ay, C.vel, { width: 4, label: ov.values ? `${fx(v, 2)} m/s` : '', lx: cx + v * pxV + Math.sign(v) * fs * 0.4, align: v > 0 ? 'left' : 'right', fs: fs * 0.85 });
          else label(ctx, 'v = 0', cx, ay, C.vel, { fs: fs * 0.8 });
          if (this.s.t === 0 && !App.running) {
            addHandle(ctx, { id: 'v' + name + k, x: cx + v * pxV, y: ay, r: fs, cursor: 'ew-resize',
              onDrag: px => { setParam(this, name === 'A' ? 'uA' : 'uB', (px - cx) / pxV); this.reset(); } });
          }
        }
        if (ov.values) label(ctx, `p${name} = ${fx(m, 1)} × ${fx(v, 2)} = ${fx(m * v, 2)} kg m/s`, cx, groundY + fs * (j === 0 ? 0.9 : 2.2), col, { fs: fs * 0.78, weight: 750 });
        if (ov.forces && st.contact) {
          const F = j === 0 ? st.FA : -st.FA, L = clamp(Math.abs(F) * fs * 0.1, fs * 0.5, w * 0.15) * Math.sign(F);
          arrow(ctx, cx, top + th + fs * 0.05, cx + L, top + th + fs * 0.05, C.force, { width: 5, label: `${fx(Math.abs(F), 0)} N`, lx: cx + L, ly: top + th + fs * 0.9, fs: fs * 0.85 });
        }
      });
      if (ov.eq) {
        const text = `total momentum before = ${fx(T.p0, 2)} kg m/s · now = ${fx(T.pNow, 2)} kg m/s`;
        label(ctx, text, w - fs * 0.4, y0 + fs * 0.9, C.ink, { align: 'right', fs: fs * 0.85 });
        if (st.contact && ov.forces) label(ctx, 'Forces on A and B: equal size, opposite directions', w / 2, y0 + fs * 2.3, C.force, { fs: fs * 0.85, weight: 800 });
      }
    });
  },

  drawGraph(cv, id, C) {
    const lanes = this.lanes(), p = this.p;
    if (id === 'p') {
      const series = [];
      let top = 1;
      for (const k of lanes) {
        const h = this.s[k].hist, tag = lanes.length > 1 ? `${k}: ` : '';
        series.push({ pts: h.map(q => [q[0], q[1]]), color: C.a, width: 3, label: `${tag}trolley A` });
        series.push({ pts: h.map(q => [q[0], q[2]]), color: C.b, width: 3, label: `${tag}trolley B` });
        series.push({ pts: h.map(q => [q[0], q[1] + q[2]]), color: C.ink, width: 4, dash: lanes.length > 1 && k === 'B' ? [8, 5] : null, label: `${tag}total` });
        for (const q of h) top = Math.max(top, Math.abs(q[1]), Math.abs(q[2]), Math.abs(q[1] + q[2]));
      }
      const yMax = niceCeil(top * 1.2);
      plot(cv, { xLabel: 'Time t (s)', yLabel: 'Momentum p (kg m/s)', xMax: Math.max(2, niceCeil(this.s.t)), yMin: -yMax, yMax, series, notesRight: true,
        notes: [{ text: p.realistic ? 'Friction slowly takes momentum away' : 'Total momentum stays the same', color: C.ink }] });
      return;
    }
    if (id === 'F') {
      const st = this.s[lanes[0]], hits = st.hist.filter(q => Math.abs(q[3]) > 1e-6);
      if (!hits.length) { plot(cv, { xLabel: 'Time (s)', yLabel: 'Force (N)', xMax: 0.1, yMin: -10, yMax: 10, message: 'Press Go: the forces appear when the trolleys collide' }); return; }
      const t0 = hits[0][0] - 0.02, pts = st.hist.filter(q => q[0] >= t0 && q[0] <= t0 + 0.12);
      const top = niceCeil(Math.max(...pts.map(q => Math.abs(q[3]))) * 1.2);
      plot(cv, { xLabel: 'Time since just before the collision (s)', yLabel: 'Force (N)', xMax: 0.12, yMin: -top, yMax: top,
        series: [{ pts: pts.map(q => [q[0] - t0, q[3]]), color: C.a, width: 4, label: 'force on A' }, { pts: pts.map(q => [q[0] - t0, -q[3]]), color: C.b, width: 4, label: 'force on B' }],
        notesRight: true, notes: [{ text: 'Equal size, opposite direction at every moment', color: C.ink }] });
      return;
    }
    const bars = [];
    lanes.forEach((k, li) => {
      const T = this.totals(k), off = lanes.length > 1 ? (li - 0.5) * 0.4 : 0, bw = lanes.length > 1 ? 0.36 : 0.6, col = k === 'A' ? C.a : C.b;
      bars.push({ x: 1 + off, y: T.k0, width: bw, color: col, label: fx(T.k0, 2) }, { x: 2 + off, y: T.k1, width: bw, color: col, label: fx(T.k1, 2) });
    });
    plot(cv, { xLabel: lanes.length > 1 ? 'Kinetic energy (A: elastic, B: sticky)' : 'Kinetic energy', yLabel: 'Total kinetic energy (J)', xMin: 0.4, xMax: 2.6,
      yMax: niceCeil(Math.max(1, ...bars.map(b => b.y)) * 1.25), bars, xTicks: [[1, 'before'], [2, 'after']],
      notes: [{ text: 'Elastic: kinetic energy conserved. Sticky: some lost to heat and sound.', color: C.ink }] });
  },

  readouts() {
    const lanes = this.lanes(), p = this.p, per = fn => lanes.map(k => fn(this.totals(k), this.s[k]));
    return {
      cols: lanes.length > 1 ? [{ name: 'elastic', cls: 'A' }, { name: 'sticky', cls: 'B' }] : [{ name: '' }],
      rows: [
        { label: 'Total momentum before', unit: 'kg m/s', vals: per(T => fx(T.p0, 2)) },
        { label: 'Total momentum after', unit: 'kg m/s', vals: per(T => fx(T.p1, 2)) },
        { label: 'Velocities after (A, B)', unit: 'm/s', vals: per(T => `${fx(T.vA, 2)}, ${fx(T.vB, 2)}`) },
        { label: 'Kinetic energy before', unit: 'J', vals: per(T => fx(T.k0, 2)) },
        { label: 'Kinetic energy after', unit: 'J', vals: per(T => fx(T.k1, 2)) },
        { label: 'Total momentum now', unit: 'kg m/s', vals: per(T => fx(T.pNow, 2)) },
      ],
    };
  },

  record() {
    const p = this.p;
    return this.lanes().map(k => { const T = this.totals(k); return { type: this.typeName(k), mA: p.mA, uA: p.uA, mB: p.mB, uB: p.uB, vA: T.vA, vB: T.vB, p0: T.p0, p1: T.p1, k0: T.k0, k1: T.k1 }; });
  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 18: THE MOTOR EFFECT  (F = B I l)
   --------------------------------------------------------------------- */
Object.assign(Physics, {
  // Force on a wire at right angles to a magnetic field: F = B I l (N).
  motorForce(B, I, l) { return B * I * l; },
  // Direction (+1 = up the screen, −1 = down). current: +1 out of the screen, −1 into it; field: +1 left → right.
  // Worked out with Fleming's left-hand rule (F = I l × B).
  motorDirection(current, field) { return current * field; },
});

register({

  equationShort: 'F = B I l',

  equations: [

  predict: [

  table: {

  },

  // ---- simulation ----
  lanes() { return this.p.compare ? ['A', 'B'] : ['A']; },
  curOf(k) { return k === 'B' ? -this.p.cur : this.p.cur; },
  force(k) { return Physics.motorForce(this.p.B, this.p.I, this.p.l) * Physics.motorDirection(this.curOf(k), this.p.field); },   // + = up
  reset() { this.s = { t: 0, y: { A: 0, B: 0 }, v: { A: 0, B: 0 } }; },
  step(dt) {
    const s = this.s;
    s.t += dt;
    for (const k of this.lanes()) {                // the wire swings towards a position set by the force
      const target = clamp(this.force(k) / 0.5, -1, 1);
      s.v[k] += ((target - s.y[k]) * 40 - s.v[k] * 6) * dt; s.y[k] += s.v[k] * dt;
    }
  },
  settled() { return false; },
  finished() { return false; },
  clock() { return App.running ? 'Current: ON' : 'Current: OFF'; },

  drawDiagram(ctx, w, h, C) {
    const lanes = this.lanes(), lw = w / lanes.length, fs = App.fs, ov = this.ov, p = this.p, on = App.running;
    // swing back to the middle when the current is off
    if (!on) for (const k of lanes) { this.s.y[k] *= 0.9; }
    lanes.forEach((k, i) => {
      const x0 = i * lw, cx = x0 + lw * 0.42, cy = h * 0.52, gapW = Math.min(lw * 0.42, h * 0.62), magW = Math.min(lw * 0.14, fs * 4), magH = h * 0.5;
      if (i > 0) { ctx.strokeStyle = C.line; ctx.lineWidth = 3; line(ctx, x0, 0, x0, h); }
      if (lanes.length > 1) label(ctx, k === 'A' ? 'A: as set' : 'B: current reversed', x0 + fs * 0.4, fs * 0.9, k === 'A' ? C.a : C.b, { align: 'left', weight: 800, fs: fs * 0.9 });
      const leftPole = p.field > 0 ? 'N' : 'S', rightPole = p.field > 0 ? 'S' : 'N';
      for (const [px, pole] of [[cx - gapW / 2 - magW, leftPole], [cx + gapW / 2, rightPole]]) {
        ctx.fillStyle = pole === 'N' ? '#d6312b' : '#2b5fd6'; ctx.fillRect(px, cy - magH / 2, magW, magH);
        ctx.fillStyle = '#fff'; ctx.font = `800 ${fs * 1.6}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(pole, px + magW / 2, cy);
        addHandle(ctx, { id: 'mag' + k + pole, x: px + magW / 2, y: cy, r: fs * 1.4, cursor: 'pointer', start: () => { p.field = -p.field; } });
      }
      // magnet's field: uniform lines from N to S
      if (ov.field && p.B > 0) {
        for (let j = -3; j <= 3; j++) {
          const y = cy + j * magH / 8;
          const xa = cx - gapW / 2 + 4, xb = cx + gapW / 2 - 4;
          ctx.strokeStyle = C.friction; ctx.globalAlpha = 0.55 + p.B; ctx.lineWidth = 1.5; line(ctx, xa, y, xb, y); ctx.globalAlpha = 1;
          const mx = (xa + xb) / 2 + (j % 2) * fs;
          arrow(ctx, mx - p.field * fs * 0.5, y, mx + p.field * fs * 0.5, y, C.friction, { width: 2 });
        }
      }
      // the wire, seen end-on, moved by the force
      const wy = cy - this.s.y[k] * magH * 0.35, r = fs * 0.9, cur = this.curOf(k);
      if (ov.wireField && on && p.I > 0) {
        for (const rr of [r * 1.8, r * 2.8]) {
          ctx.strokeStyle = C.acc; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, wy, rr, 0, Math.PI * 2); ctx.stroke();
          // current out of the screen: field goes anticlockwise, so on the right of the circle it points up
          arrow(ctx, cx + rr, wy + cur * fs * 0.4, cx + rr, wy - cur * fs * 0.4, C.acc, { width: 2 });
        }
        const strong = this.force(k) > 0 ? 'below' : 'above';
        label(ctx, 'fields add: stronger', cx, strong === 'below' ? wy + r * 3.6 : wy - r * 3.6, C.acc, { fs: fs * 0.75 });
        label(ctx, 'fields cancel: weaker', cx, strong === 'below' ? wy - r * 3.6 : wy + r * 3.6, C.acc, { fs: fs * 0.75 });
      }
      ctx.fillStyle = '#c8743a'; ctx.beginPath(); ctx.arc(cx, wy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = C.ink;
      if (cur > 0) { ctx.beginPath(); ctx.arc(cx, wy, r * 0.25, 0, Math.PI * 2); ctx.fill(); }
      else { line(ctx, cx - r * 0.55, wy - r * 0.55, cx + r * 0.55, wy + r * 0.55); line(ctx, cx - r * 0.55, wy + r * 0.55, cx + r * 0.55, wy - r * 0.55); }
      label(ctx, cur > 0 ? '⊙ current out of the screen' : '⊗ current into the screen', cx, cy + magH / 2 + fs * 1.0, C.ink, { fs: fs * 0.8, weight: 750 });
      addHandle(ctx, { id: 'wire' + k, x: cx, y: wy, r: r * 1.4, cursor: 'pointer', start: () => { if (k === 'A') p.cur = -p.cur; } });
      const F = this.force(k);
      if (ov.force && on && Math.abs(F) > 1e-9) {
        const L = clamp(Math.abs(F) / 0.5, 0.15, 1) * magH * 0.4;
        arrow(ctx, cx + r * 2.2, wy, cx + r * 2.2, wy - Math.sign(F) * L, C.force, { width: 5, label: ov.values ? `F = ${sf(Math.abs(F), 3)} N ${F > 0 ? 'up' : 'down'}` : 'force', lx: cx + r * 2.6, ly: wy - Math.sign(F) * L * 0.6, align: 'left', fs: fs * 0.85 });
      }
      if (!on) label(ctx, 'Current off: no force', cx, cy - magH / 2 - fs * 0.8, C.muted, { fs: fs * 0.85 });
      // Fleming's left-hand rule
      if (ov.hand) {
        const hx = x0 + lw - fs * 5.6, hy = h - fs * 5, Lh = fs * 2.2;
        ctx.fillStyle = C.panel; ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; roundRect(ctx, hx - fs * 5.2, hy - fs * 4.2, fs * 10.6, fs * 8.8, 8); ctx.fill(); ctx.stroke();
        label(ctx, 'Fleming’s left-hand rule', hx, hy + fs * 3.9, C.ink, { fs: fs * 0.8, weight: 800, bg: false });
        const fDir = Math.sign(F) || 1;
        arrow(ctx, hx, hy, hx + p.field * Lh, hy, C.friction, { width: 3 });
        label(ctx, 'First: Field', hx + p.field * Lh, hy + fs * 0.8, C.friction, { fs: fs * 0.72, bg: false });
        arrow(ctx, hx, hy, hx, hy - fDir * Lh, C.force, { width: 3 });
        label(ctx, 'thuMb: Motion', hx, hy - fDir * Lh - fDir * fs * 0.6, C.force, { fs: fs * 0.72, bg: false });
        arrow(ctx, hx, hy, hx - cur * Lh * 0.6, hy + cur * Lh * 0.6, C.acc, { width: 3 });
        label(ctx, `seCond: Current ${cur > 0 ? '(towards you)' : '(away)'}`, hx - cur * Lh * 0.6, hy + cur * Lh * 0.6 + fs * 0.7, C.acc, { fs: fs * 0.72, bg: false });
      }
      if (ov.eq) label(ctx, `F = B I l = ${fx(p.B, 2)} × ${fx(on ? p.I : 0, 1)} × ${fx(p.l, 2)} = ${sf(on ? Math.abs(F) : 0, 3)} N`, x0 + lw * 0.42, fs * (lanes.length > 1 ? 2.3 : 0.9), C.ink, { fs: fs * 0.85 });
    });
  },

  drawGraph(cv, id, C) {
    const p = this.p, rows = App.rows[this.id] || [];
    const byI = id === 'FI', xMax = byI ? 5 : 0.5;
    const model = x => byI ? Physics.motorForce(p.B, x, p.l) : Physics.motorForce(x, p.I, p.l);
    const mine = rows.filter(r => byI ? (r.B === p.B && r.l === p.l) : (r.I === p.I && r.l === p.l));
    const pts = mine.map(r => ({ x: byI ? r.I : r.B, y: r.F }));
    const fit = pts.length >= 2 ? fitOrigin(pts) : null;
    const o = { xLabel: byI ? 'Current I (A)' : 'Magnetic flux density B (T)', yLabel: 'Force F (N)', xMax, yMax: niceCeil(Math.max(model(xMax), ...pts.map(q => q.y), 0.01) * 1.15),
      lines: [{ x1: 0, y1: 0, x2: xMax, y2: model(xMax), color: C.muted, dash: [6, 5], label: 'F = B I l' }],
      points: pts.map(q => ({ x: q.x, y: q.y, color: C.a })).concat([{ x: byI ? p.I : p.B, y: Physics.motorForce(p.B, p.I, p.l), color: C.force, dot: true, label: 'now' }]),
      notes: [{ text: 'Straight line through the origin: F ∝ ' + (byI ? 'I' : 'B'), color: C.ink }] };
    if (fit) o.notes.push({ text: `gradient = ${sf(fit.k, 3)} ${byI ? `N/A = B l` : 'N/T = I l'}`, color: C.a });
    plot(cv, o);
  },

  readouts() {
    const lanes = this.lanes(), p = this.p, per = fn => lanes.map(k => fn(k));
    return {
      cols: lanes.length > 1 ? [{ name: 'A', cls: 'A' }, { name: 'B', cls: 'B' }] : [{ name: '' }],
      rows: [
        { label: 'Flux density B', unit: 'T', vals: [fx(p.B, 2)] },
        { label: 'Current I', unit: 'A', vals: [fx(p.I, 1)] },
        { label: 'Length l', unit: 'm', vals: [fx(p.l, 2)] },
        { label: 'Force F = B I l', unit: 'N', vals: [sf(Physics.motorForce(p.B, p.I, p.l), 3)] },
        { label: 'Current direction', unit: '', vals: per(k => this.curOf(k) > 0 ? 'out of screen' : 'into screen') },
        { label: 'Force direction', unit: '', vals: per(k => this.force(k) > 0 ? 'up' : this.force(k) < 0 ? 'down' : 'none') },
      ],
    };
  },

  record() {
    const p = this.p, F = this.force('A');
    return [{ B: p.B, I: p.I, l: p.l, F: Math.abs(F), dir: F > 0 ? 'up' : F < 0 ? 'down' : '—' }];
  },
});

/* ---------------------------------------------------------------------
   EXPERIMENT 19: ELECTROMAGNETIC INDUCTION
   --------------------------------------------------------------------- */
const MAGNET = { phi0: 4e-4, a: 0.04, start: -0.25 };   // flux through one turn when the magnet is in the middle (Wb), size of the field region (m), start position (m)

Object.assign(Physics, {
  // Magnetic flux through one turn of the coil when the magnet's centre is x metres from the middle of the coil.
  flux(x) { return MAGNET.phi0 / Math.pow(1 + (x / MAGNET.a) ** 2, 1.5); },
  dFluxDx(x) { const u = x / MAGNET.a; return MAGNET.phi0 * -3 * u / Math.pow(1 + u * u, 2.5) / MAGNET.a; },
  // Induced p.d. = −N × (rate of change of flux). pole = +1 if the N pole leads, −1 if the S pole leads.
  inducedPD(N, x, v, pole) { return -N * Physics.dFluxDx(x) * v * pole; },
});

        { label: 'Pole going in first', unit: '', vals: lanes.map(k => this.poleOf(k) > 0 ? 'North' : 'South') },

  },

  record() {
    const p = this.p, names = { inout: 'push in, pull out', through: 'right through', speedup: 'speeding up', still: 'held still', drag: 'by hand' };
    const peak = Math.max(...this.s.hist.A.map(q => Math.abs(q[1])));

  },
});

  moment(F, d) { return F * d; },     // moment = force × perpendicular distance from the pivot

  ML() { return Physics.moment(this.p.WL, this.p.dL / 100); },
  MR() { return Physics.moment(this.p.WR, this.p.dR / 100); },
  reset() { this.s = { t: 0, th: 0, w: 0 }; },
  step(dt) {

    if (this.p.realistic && Math.abs(s.w) < 1e-3 && Math.abs(net) < BEAM.friction) torque = 0;
    s.w += (torque / BEAM.inertia / DEG - 2 * s.w) * dt;     // angular acceleration in °/s², with some damping
    s.th += s.w * dt;
    if (Math.abs(s.th) > BEAM.maxTilt) { s.th = Math.sign(s.th) * BEAM.maxTilt; s.w = 0; }
    s.t += dt;

  clock() { const d = this.MR() - this.ML(); return Math.abs(d) < 1e-9 ? 'Balanced' : d > 0 ? 'Clockwise wins' : 'Anticlockwise wins'; },
